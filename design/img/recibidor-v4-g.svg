<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f7f3ec"/>
    </linearGradient>
    <linearGradient id="wallGlow" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#fdf6e8" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#faf7f2" stop-opacity="0"/>
      <stop offset="1" stop-color="#eee7db" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="floorRake" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6d3ac" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#d8c19a" stop-opacity="0"/>
      <stop offset="1" stop-color="#b89b6e" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="oakPanel" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0" stop-color="#e0cba4"/>
      <stop offset="0.5" stop-color="#d0b88b"/>
      <stop offset="1" stop-color="#c0a377"/>
    </linearGradient>
    <linearGradient id="oakPanel2" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#dcc59c"/>
      <stop offset="1" stop-color="#c3a87e"/>
    </linearGradient>
    <linearGradient id="oakEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="pine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2cca2"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="walnutG" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#6d5138"/>
      <stop offset="0.55" stop-color="#5c4632"/>
      <stop offset="1" stop-color="#4a3624"/>
    </linearGradient>
    <linearGradient id="blackCab" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#3d3a36"/>
      <stop offset="0.5" stop-color="#2a2724"/>
      <stop offset="1" stop-color="#15130f"/>
    </linearGradient>
    <linearGradient id="ledGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf9f5c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#cf9f5c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassPane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8cdd6" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#e3e1dc" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#9a968f" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="chromeBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e1dc"/>
      <stop offset="0.45" stop-color="#c9c5be"/>
      <stop offset="0.55" stop-color="#9a968f"/>
      <stop offset="1" stop-color="#c9c5be"/>
    </linearGradient>
    <linearGradient id="mirrorGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6ecef"/>
      <stop offset="0.45" stop-color="#cdd8dd"/>
      <stop offset="0.55" stop-color="#b8cdd6"/>
      <stop offset="1" stop-color="#d5ddd8"/>
    </linearGradient>
    <linearGradient id="cushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8dcc6"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="jute" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0cba4"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="bagOlive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8c62"/>
      <stop offset="1" stop-color="#63654a"/>
    </linearGradient>
    <linearGradient id="bagOak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="bagWal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d5138"/>
      <stop offset="1" stop-color="#4a3624"/>
    </linearGradient>
    <linearGradient id="toteLinen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8dcc6"/>
      <stop offset="1" stop-color="#d0bd9c"/>
    </linearGradient>
    <linearGradient id="bamboo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="0.5" stop-color="#cf9f5c"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <radialGradient id="lightPool" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#fdf3df" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fdf3df" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- wall -->
  <rect x="0" y="0" width="800" height="600" fill="url(#wall)"/>
  <rect x="0" y="0" width="800" height="420" fill="url(#wallGlow)"/>
  <rect x="0" y="0" width="800" height="600" fill="url(#lightPool)"/>

  <!-- floor band lower third -->
  <rect x="0" y="410" width="800" height="190" fill="url(#floor)"/>
  <rect x="0" y="410" width="800" height="190" fill="url(#floorRake)"/>
  <!-- skirting line -->
  <rect x="0" y="402" width="800" height="10" fill="#e8dcc6"/>
  <rect x="0" y="410" width="800" height="3" fill="#a5876a" opacity="0.5"/>
  <!-- plank lines -->
  <g stroke="#b89b6e" stroke-width="1.4" opacity="0.45">
    <line x1="0" y1="452" x2="800" y2="452"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="552" x2="800" y2="552"/>
  </g>
  <g stroke="#a5876a" stroke-width="1" opacity="0.35">
    <line x1="150" y1="413" x2="150" y2="452"/>
    <line x1="430" y1="452" x2="430" y2="500"/>
    <line x1="620" y1="413" x2="620" y2="452"/>
    <line x1="300" y1="500" x2="300" y2="552"/>
    <line x1="560" y1="500" x2="560" y2="552"/>
    <line x1="220" y1="552" x2="220" y2="600"/>
    <line x1="640" y1="552" x2="640" y2="600"/>
  </g>

  <!-- ================= SHOE CABINET (three flip fronts) ================= -->
  <ellipse cx="185" cy="452" rx="150" ry="16" fill="rgba(31,27,22,0.12)"/>
  <rect x="60" y="230" width="250" height="212" rx="10" fill="url(#oakPanel)" stroke="#a5876a" stroke-width="2"/>
  <rect x="60" y="230" width="250" height="212" rx="10" fill="none" stroke="#e0cba4" stroke-width="1" opacity="0.6"/>
  <!-- wood grain -->
  <g stroke="#bda175" stroke-width="1" opacity="0.4" fill="none">
    <path d="M74 250 q60 -6 120 0 t110 4"/>
    <path d="M74 285 q70 8 130 -2 t100 2"/>
    <path d="M74 330 q60 -8 120 -2 t110 6"/>
    <path d="M74 380 q80 6 140 -4 t90 2"/>
    <path d="M74 415 q60 -4 120 2 t110 -2"/>
  </g>
  <!-- three flip fronts -->
  <g>
    <rect x="74" y="244" width="222" height="58" rx="6" fill="url(#oakPanel2)" stroke="#a5876a" stroke-width="1.5"/>
    <rect x="74" y="308" width="222" height="58" rx="6" fill="url(#oakPanel2)" stroke="#a5876a" stroke-width="1.5"/>
    <rect x="74" y="372" width="222" height="58" rx="6" fill="url(#oakPanel2)" stroke="#a5876a" stroke-width="1.5"/>
    <!-- top-edge highlights (raking light) -->
    <rect x="76" y="246" width="218" height="3" rx="1.5" fill="#efe0c2" opacity="0.8"/>
    <rect x="76" y="310" width="218" height="3" rx="1.5" fill="#efe0c2" opacity="0.8"/>
    <rect x="76" y="374" width="218" height="3" rx="1.5" fill="#efe0c2" opacity="0.8"/>
    <!-- recessed finger pulls (bottom notch) -->
    <rect x="160" y="292" width="50" height="6" rx="3" fill="#8a6f52" opacity="0.7"/>
    <rect x="160" y="356" width="50" height="6" rx="3" fill="#8a6f52" opacity="0.7"/>
    <rect x="160" y="420" width="50" height="6" rx="3" fill="#8a6f52" opacity="0.7"/>
  </g>
  <!-- shoe cabinet legs -->
  <rect x="82" y="442" width="14" height="16" rx="3" fill="#a5876a"/>
  <rect x="274" y="442" width="14" height="16" rx="3" fill="#8a6f52"/>

  <!-- ================= SLIM OAK CABINET ================= -->
  <ellipse cx="360" cy="452" rx="70" ry="13" fill="rgba(31,27,22,0.12)"/>
  <rect x="320" y="196" width="80" height="246" rx="8" fill="url(#oakEdge)" stroke="#8a6f52" stroke-width="2"/>
  <rect x="328" y="204" width="64" height="230" rx="5" fill="url(#oakPanel)"/>
  <g stroke="#bda175" stroke-width="1" opacity="0.4" fill="none">
    <path d="M334 226 q30 -4 58 2"/>
    <path d="M334 270 q30 6 58 -2"/>
    <path d="M334 320 q30 -5 58 3"/>
    <path d="M334 372 q30 5 58 -2"/>
    <path d="M334 410 q30 -3 58 2"/>
  </g>
  <rect x="330" y="206" width="60" height="3" rx="1.5" fill="#efe0c2" opacity="0.8"/>
  <!-- slim vertical handle -->
  <rect x="378" y="250" width="5" height="130" rx="2.5" fill="url(#chromeBar)"/>
  <line x1="334" y1="318" x2="386" y2="318" stroke="#8a6f52" stroke-width="1.4" opacity="0.6"/>
  <rect x="326" y="442" width="12" height="15" rx="3" fill="#8a6f52"/>
  <rect x="382" y="442" width="12" height="15" rx="3" fill="#8a6f52"/>

  <!-- ================= FULL-HEIGHT LIGHT-OAK MIRROR ================= -->
  <ellipse cx="475" cy="452" rx="60" ry="12" fill="rgba(31,27,22,0.12)"/>
  <rect x="424" y="120" width="102" height="322" rx="10" fill="url(#oakEdge)" stroke="#8a6f52" stroke-width="2"/>
  <rect x="432" y="128" width="86" height="306" rx="6" fill="url(#mirrorGlass)"/>
  <!-- mirror reflection streaks -->
  <g opacity="0.55">
    <path d="M448 138 L470 138 L436 430 L432 430 Z" fill="#f2f6f7" opacity="0.6"/>
    <path d="M490 138 L505 138 L468 430 L458 430 Z" fill="#ffffff" opacity="0.35"/>
  </g>
  <rect x="432" y="128" width="86" height="306" rx="6" fill="none" stroke="#e3e1dc" stroke-width="1" opacity="0.5"/>
  <!-- top frame highlight -->
  <rect x="428" y="123" width="94" height="4" rx="2" fill="#efe0c2" opacity="0.85"/>

  <!-- ================= BLACK DISPLAY CABINET with LED + handbags ================= -->
  <ellipse cx="600" cy="452" rx="88" ry="14" fill="rgba(31,27,22,0.12)"/>
  <rect x="530" y="150" width="140" height="292" rx="8" fill="url(#blackCab)" stroke="#15130f" stroke-width="2"/>
  <!-- glass door -->
  <rect x="542" y="162" width="116" height="268" rx="5" fill="url(#glassPane)" stroke="#3d3a36" stroke-width="1.5"/>
  <!-- warm LED strip at top -->
  <rect x="546" y="166" width="108" height="5" rx="2.5" fill="#cf9f5c"/>
  <rect x="546" y="171" width="108" height="46" fill="url(#ledGlow)"/>
  <!-- interior shelves -->
  <line x1="542" y1="252" x2="658" y2="252" stroke="#3d3a36" stroke-width="2"/>
  <line x1="542" y1="342" x2="658" y2="342" stroke="#3d3a36" stroke-width="2"/>
  <!-- handbag 1 (olive) -->
  <g>
    <rect x="560" y="200" width="48" height="40" rx="7" fill="url(#bagOlive)" stroke="#4a3624" stroke-width="1"/>
    <path d="M568 200 q16 -22 32 0" fill="none" stroke="#63654a" stroke-width="3.5"/>
    <rect x="560" y="204" width="48" height="4" fill="#9a9c72" opacity="0.6"/>
  </g>
  <!-- handbag 2 (oak/tan) -->
  <g>
    <rect x="570" y="292" width="52" height="42" rx="6" fill="url(#bagOak)" stroke="#8a6f52" stroke-width="1"/>
    <path d="M580 292 q16 -20 32 0" fill="none" stroke="#a5876a" stroke-width="3.5"/>
    <rect x="592" y="304" width="8" height="10" rx="2" fill="#cf9f5c"/>
    <rect x="570" y="296" width="52" height="4" fill="#dcc59c" opacity="0.6"/>
  </g>
  <!-- handbag 3 (walnut) -->
  <g>
    <rect x="562" y="382" width="46" height="38" rx="8" fill="url(#bagWal)" stroke="#4a3624" stroke-width="1"/>
    <path d="M570 382 q13 -18 30 0" fill="none" stroke="#5c4632" stroke-width="3.5"/>
    <rect x="562" y="386" width="46" height="4" fill="#7a5c40" opacity="0.6"/>
  </g>
  <!-- glass reflection -->
  <path d="M548 166 L590 166 L556 428 L544 428 Z" fill="#ffffff" opacity="0.12"/>
  <!-- chrome feet -->
  <rect x="540" y="442" width="12" height="14" rx="3" fill="url(#chromeBar)"/>
  <rect x="648" y="442" width="12" height="14" rx="3" fill="url(#chromeBar)"/>

  <!-- ================= PINE BENCH with storage drawer + cushion ================= -->
  <ellipse cx="180" cy="530" rx="150" ry="18" fill="rgba(31,27,22,0.12)"/>
  <!-- bench body -->
  <rect x="66" y="474" width="228" height="58" rx="8" fill="url(#pine)" stroke="#a5876a" stroke-width="2"/>
  <g stroke="#bda175" stroke-width="1" opacity="0.4" fill="none">
    <path d="M80 490 q80 -5 150 0 t50 3"/>
    <path d="M80 516 q90 6 160 -2 t40 2"/>
  </g>
  <!-- storage drawer -->
  <rect x="80" y="490" width="200" height="34" rx="5" fill="url(#oakPanel2)" stroke="#a5876a" stroke-width="1.5"/>
  <rect x="82" y="492" width="196" height="3" rx="1.5" fill="#efe0c2" opacity="0.8"/>
  <rect x="160" y="503" width="42" height="7" rx="3.5" fill="#8a6f52" opacity="0.8"/>
  <!-- cushion (beige) -->
  <rect x="70" y="452" width="220" height="26" rx="13" fill="url(#cushion)" stroke="#c0a377" stroke-width="1"/>
  <line x1="140" y1="454" x2="140" y2="476" stroke="#c0a377" stroke-width="1.4" opacity="0.6"/>
  <line x1="220" y1="454" x2="220" y2="476" stroke="#c0a377" stroke-width="1.4" opacity="0.6"/>
  <rect x="74" y="454" width="212" height="4" rx="2" fill="#f2ead9" opacity="0.7"/>
  <!-- bench legs -->
  <rect x="78" y="532" width="14" height="20" rx="3" fill="#a5876a"/>
  <rect x="268" y="532" width="14" height="20" rx="3" fill="#8a6f52"/>

  <!-- ================= FOUR BAMBOO HOOKS with tote ================= -->
  <rect x="330" y="150" width="86" height="10" rx="5" fill="url(#bamboo)" stroke="#a5876a" stroke-width="1"/>
  <g fill="url(#bamboo)" stroke="#8a6f52" stroke-width="1">
    <path d="M344 160 q-6 12 4 16 q6 3 6 -3" fill="none" stroke-width="4"/>
    <path d="M366 160 q-6 12 4 16 q6 3 6 -3" fill="none" stroke-width="4"/>
    <path d="M388 160 q-6 12 4 16 q6 3 6 -3" fill="none" stroke-width="4"/>
    <path d="M410 160 q-6 12 4 16 q6 3 6 -3" fill="none" stroke-width="4"/>
  </g>
  <!-- tote hanging on a hook -->
  <g>
    <path d="M370 174 q-4 30 0 46 q20 8 40 0 q4 -16 0 -46" fill="url(#toteLinen)" stroke="#c0a377" stroke-width="1.5"/>
    <path d="M376 176 q6 -14 28 0" fill="none" stroke="#cbb287" stroke-width="3"/>
    <line x1="382" y1="188" x2="382" y2="216" stroke="#d0bd9c" stroke-width="1" opacity="0.6"/>
    <line x1="398" y1="188" x2="398" y2="216" stroke="#d0bd9c" stroke-width="1" opacity="0.6"/>
    <rect x="372" y="178" width="36" height="4" fill="#f2ead9" opacity="0.6"/>
  </g>

  <!-- ================= JUTE DOORMAT ================= -->
  <g>
    <ellipse cx="410" cy="560" rx="130" ry="30" fill="rgba(31,27,22,0.1)"/>
    <path d="M300 545 L520 545 L540 578 L280 578 Z" fill="url(#jute)" stroke="#a5876a" stroke-width="2"/>
    <g stroke="#b89b6e" stroke-width="1.2" opacity="0.5">
      <line x1="296" y1="556" x2="524" y2="556"/>
      <line x1="290" y1="567" x2="530" y2="567"/>
    </g>
    <g stroke="#a5876a" stroke-width="1" opacity="0.4">
      <line x1="340" y1="546" x2="333" y2="577"/>
      <line x1="390" y1="546" x2="386" y2="577"/>
      <line x1="440" y1="546" x2="447" y2="577"/>
      <line x1="490" y1="546" x2="500" y2="577"/>
    </g>
    <path d="M300 545 L520 545 L522 549 L298 549 Z" fill="#e6d3ac" opacity="0.6"/>
  </g>

  <!-- raking-light warm cast across the wall/floor -->
  <path d="M0 402 L800 402 L800 420 L0 420 Z" fill="#fdf3df" opacity="0.18"/>
  <rect x="0" y="0" width="220" height="600" fill="#fdf3df" opacity="0.06"/>
</svg>