  <rect x="616" y="286" width="12" height="14" rx="2" fill="#93744f"/>
  <rect x="606" y="300" width="32" height="6" rx="3" fill="#a5876a"/>
  <path d="M600 286 q22 -46 44 0 z" fill="url(#lampGlow)"/>
  <path d="M600 286 q22 -46 44 0 z" fill="#f7e6bd" opacity="0.5"/>
