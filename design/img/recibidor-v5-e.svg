    <line x1="282" y1="454" x2="282" y2="472"/>
    <line x1="294" y1="454" x2="294" y2="472"/>
    <line x1="306" y1="454" x2="306" y2="472"/>
    <line x1="318" y1="454" x2="318" y2="472"/>
    <line x1="330" y1="454" x2="330" y2="472"/>
    <line x1="342" y1="454" x2="342" y2="472"/>
    <line x1="354" y1="454" x2="354" y2="472"/>
    <line x1="366" y1="454" x2="366" y2="472"/>
    <line x1="378" y1="454" x2="378" y2="472"/>
    <line x1="390" y1="454" x2="390" y2="472"/>
    <line x1="402" y1="454" x2="402" y2="472"/>
    <line x1="414" y1="454" x2="414" y2="472"/>
