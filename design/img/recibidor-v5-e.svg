    <path d="M614 150 q-8 -40 30 -46 q40 -6 44 24 q4 24 -22 30 q-26 6 -18 30 q8 22 40 16 q28 -6 30 -30" stroke="#8a8c62" stroke-width="2.5" opacity="0.8"/>
