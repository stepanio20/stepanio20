    <rect x="60" y="216" width="64" height="40" rx="4"/>
    <rect x="60" y="264" width="64" height="40" rx="4"/>
    <rect x="60" y="312" width="64" height="40" rx="4"/>
    <rect x="60" y="360" width="64" height="34" rx="4"/>
