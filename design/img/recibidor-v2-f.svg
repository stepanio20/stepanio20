  <circle cx="278" cy="332" r="7" fill="none" stroke="#8a5a20" stroke-width="1.5"/>
  <circle cx="296" cy="334" r="5" fill="#9a968f"/>
  <rect x="316" y="326" width="40" height="10" rx="3" fill="#5c4632"/>
  <rect x="316" y="326" width="40" height="4" rx="2" fill="#6d5138"/>

