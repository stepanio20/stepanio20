    <path d="M432 278 Q414 250 402 236 Q420 244 432 268 Z"/>
    <path d="M432 278 Q452 244 466 232 Q450 246 436 272 Z"/>
    <path d="M431 276 Q430 240 431 220 Q436 244 435 274 Z"/>
    <path d="M430 276 Q416 262 406 258 Q420 266 430 272 Z"/>
    <path d="M434 276 Q450 264 460 262 Q446 268 435 274 Z"/>
