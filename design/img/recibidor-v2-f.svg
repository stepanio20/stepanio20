    <ellipse cx="99" cy="464" rx="34" ry="6" fill="rgba(31,27,22,0.10)"/>
    <path d="M72 420 h54 a6 6 0 0 1 6 6 v28 a7 7 0 0 1 -7 7 h-52 a7 7 0 0 1 -7 -7 v-28 a6 6 0 0 1 6 -6 z" fill="url(#bagWhite)"/>
    <path d="M80 420 q19 -20 38 0" fill="none" stroke="#9a968f" stroke-width="3.5"/>
    <rect x="94" y="434" width="10" height="7" rx="2" fill="#cf9f5c"/>
  </g>
  <!-- vertical glass highlight -->
  <rect x="46" y="112" width="10" height="384" rx="5" fill="#ffffff" opacity="0.25"/>

  <!-- ============ RIGHT: solid oak shoe cabinet ============ -->
  <ellipse cx="700" cy="512" rx="96" ry="20" fill="rgba(31,27,22,0.12)"/>
  <rect x="612" y="316" width="176" height="196" rx="8" fill="url(#oakV)"/>
  <rect x="612" y="316" width="176" height="196" rx="8" fill="none" stroke="#a5876a" stroke-width="2"/>
  <rect x="612" y="316" width="176" height="10" rx="5" fill="#e8dcc6" opacity="0.6"/>
  <!-- doors -->
  <rect x="622" y="332" width="76" height="168" rx="5" fill="url(#oakDark)"/>
  <rect x="702" y="332" width="76" height="168" rx="5" fill="url(#oakDark)"/>
  <g stroke="#a5876a" stroke-width="1" opacity="0.4">
    <line x1="640" y1="336" x2="640" y2="496"/>
    <line x1="660" y1="336" x2="660" y2="496"/>
    <line x1="722" y1="336" x2="722" y2="496"/>
    <line x1="742" y1="336" x2="742" y2="496"/>
  </g>
  <rect x="686" y="404" width="6" height="26" rx="3" fill="#3d3a36"/>
  <rect x="708" y="404" width="6" height="26" rx="3" fill="#3d3a36"/>
  <!-- feet -->
  <rect x="628" y="512" width="14" height="12" rx="3" fill="#5c4632"/>
  <rect x="758" y="512" width="14" height="12" rx="3" fill="#5c4632"/>
  <!-- decor on shoe cabinet top: small plant + object -->
  <ellipse cx="662" cy="316" rx="18" ry="4" fill="rgba(31,27,22,0.10)"/>
  <path d="M650 316 Q648 300 658 294 Q670 300 668 316 Z" fill="#7a7c5c"/>
  <g fill="url(#plantLeaf)">
    <path d="M659 294 Q646 272 638 262 Q652 272 660 288 Z"/>
    <path d="M659 294 Q672 272 680 262 Q666 274 660 288 Z"/>
    <path d="M659 294 Q659 268 659 254 Q663 272 660 290 Z"/>
  </g>
  <rect x="726" y="300" width="40" height="16" rx="3" fill="#5c4632"/>
  <rect x="726" y="300" width="40" height="5" rx="2" fill="#6d5138"/>
  <rect x="732" y="288" width="34" height="14" rx="3" fill="#b98a4a"/>

  <!-- ============ black wall coat rack ============ -->
