    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="552" x2="800" y2="552"/>
    <line x1="140" y1="412" x2="140" y2="452"/>
    <line x1="380" y1="452" x2="380" y2="500"/>
    <line x1="600" y1="412" x2="600" y2="452"/>
    <line x1="250" y1="500" x2="250" y2="552"/>
    <line x1="520" y1="500" x2="520" y2="552"/>
    <line x1="90" y1="552" x2="90" y2="600"/>
    <line x1="430" y1="552" x2="430" y2="600"/>
    <line x1="680" y1="552" x2="680" y2="600"/>
