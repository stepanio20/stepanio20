  <rect x="618" y="150" width="164" height="4" rx="2" fill="#3d3a36"/>
  <g fill="#15130f">
    <circle cx="648" cy="176" r="6"/>
    <rect x="645" y="162" width="6" height="16" rx="3"/>
    <circle cx="700" cy="176" r="6"/>
    <rect x="697" y="162" width="6" height="16" rx="3"/>
    <circle cx="752" cy="176" r="6"/>
    <rect x="749" y="162" width="6" height="16" rx="3"/>
  </g>

  <!-- ============ jute doormat ============ -->
  <ellipse cx="330" cy="566" rx="130" ry="26" fill="rgba(31,27,22,0.10)"/>
  <rect x="206" y="548" width="248" height="40" rx="8" fill="url(#jute)"/>
  <rect x="206" y="548" width="248" height="40" rx="8" fill="none" stroke="#a5876a" stroke-width="2"/>
  <g stroke="#a5876a" stroke-width="1" opacity="0.4">
    <line x1="206" y1="560" x2="454" y2="560"/>
    <line x1="206" y1="572" x2="454" y2="572"/>
    <line x1="246" y1="548" x2="246" y2="588"/>
    <line x1="290" y1="548" x2="290" y2="588"/>
    <line x1="334" y1="548" x2="334" y2="588"/>
    <line x1="378" y1="548" x2="378" y2="588"/>
    <line x1="414" y1="548" x2="414" y2="588"/>
