  <path d="M232 352 Q230 338 240 332 Q250 338 248 352 Z" fill="#b8cdd6"/>
  <path d="M232 352 Q231 344 236 338" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

