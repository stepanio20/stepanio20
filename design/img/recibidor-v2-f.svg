    <path d="M76 300 q23 -22 46 0" fill="none" stroke="#4a3624" stroke-width="4"/>
    <circle cx="99" cy="318" r="5" fill="#cf9f5c"/>
    <path d="M68 320 h68" stroke="#4a3624" stroke-width="1.5" opacity="0.4"/>
  </g>
