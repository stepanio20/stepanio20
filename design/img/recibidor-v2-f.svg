  <circle cx="400" cy="176" r="118" fill="none" stroke="url(#oakDark)" stroke-width="16"/>
  <circle cx="400" cy="176" r="106" fill="url(#mirrorGlass)"/>
  <path d="M330 120 Q380 108 452 130 L410 250 Q350 240 316 210 Z" fill="#ffffff" opacity="0.28"/>
  <path d="M360 250 Q430 262 470 226" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.22"/>
  <circle cx="400" cy="176" r="112" fill="none" stroke="#c8a87c" stroke-width="2" opacity="0.6"/>

  <!-- console table top -->
  <rect x="205" y="352" width="390" height="20" rx="6" fill="url(#oakConsole)"/>
  <rect x="205" y="352" width="390" height="6" rx="3" fill="#e8dcc6" opacity="0.7"/>
  <rect x="205" y="366" width="390" height="6" rx="3" fill="#a5876a" opacity="0.5"/>

  <!-- slim thin drawer band -->
  <rect x="222" y="372" width="356" height="26" rx="4" fill="url(#oakDark)"/>
  <line x1="222" y1="385" x2="578" y2="385" stroke="#a5876a" stroke-width="1" opacity="0.5"/>
  <circle cx="340" cy="385" r="4" fill="#3d3a36"/>
  <circle cx="460" cy="385" r="4" fill="#3d3a36"/>

