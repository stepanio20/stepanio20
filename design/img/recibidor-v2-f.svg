  <!-- three luxury handbags -->
  <!-- bag 1 amber -->
  <g>
    <ellipse cx="99" cy="222" rx="34" ry="6" fill="rgba(31,27,22,0.10)"/>
    <path d="M72 176 h54 a6 6 0 0 1 6 6 v30 a8 8 0 0 1 -8 8 h-50 a8 8 0 0 1 -8 -8 v-30 a6 6 0 0 1 6 -6 z" fill="url(#bagAmber)"/>
    <path d="M78 176 q21 -26 42 0" fill="none" stroke="#8a5a20" stroke-width="4"/>
    <rect x="94" y="192" width="10" height="8" rx="2" fill="#e3e1dc"/>
    <path d="M72 182 h60" stroke="#8a5a20" stroke-width="1.5" opacity="0.5"/>
