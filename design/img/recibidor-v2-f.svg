  <rect x="237" y="470" width="326" height="8" rx="3" fill="url(#steelBlack)"/>
  <rect x="232" y="398" width="4" height="118" fill="#5c4632" opacity="0.3"/>

  <!-- leather tray on console -->
  <rect x="250" y="336" width="120" height="20" rx="6" fill="url(#leatherTray)"/>
  <rect x="250" y="336" width="120" height="7" rx="4" fill="#6d5138"/>
  <rect x="256" y="340" width="108" height="9" rx="4" fill="#4a3624"/>
  <rect x="256" y="341" width="108" height="3" rx="2" fill="#2a2724" opacity="0.5"/>
