<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f7f3ec"/>
    </linearGradient>
    <linearGradient id="oakFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="cabGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d3a36"/>
      <stop offset="0.5" stop-color="#2a2724"/>
      <stop offset="1" stop-color="#15130f"/>
    </linearGradient>
    <linearGradient id="cabGlassLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4640"/>
      <stop offset="1" stop-color="#2a2724"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d3a36"/>
      <stop offset="0.5" stop-color="#2a2724"/>
      <stop offset="1" stop-color="#15130f"/>
    </linearGradient>
    <linearGradient id="steelH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4640"/>
      <stop offset="1" stop-color="#2a2724"/>
    </linearGradient>
    <linearGradient id="shelfGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8cdd6" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#e3e1dc" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#b8cdd6" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="shelfLight" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#cf9f5c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#cf9f5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="helmShell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#e3e1dc"/>
    </linearGradient>
    <linearGradient id="helmOlive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8c62"/>
      <stop offset="1" stop-color="#7a7c5c"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3a36"/>
      <stop offset="0.5" stop-color="#2a2724"/>
      <stop offset="1" stop-color="#15130f"/>
    </linearGradient>
    <linearGradient id="chromeStand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9c5be"/>
      <stop offset="0.5" stop-color="#e3e1dc"/>
      <stop offset="1" stop-color="#c9c5be"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#cf9f5c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#cf9f5c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background wall -->
  <rect x="0" y="0" width="800" height="470" fill="url(#wall)"/>
  <!-- oak floor -->
  <rect x="0" y="440" width="800" height="160" fill="url(#oakFloor)"/>
  <rect x="0" y="440" width="800" height="6" fill="#a5876a" opacity="0.5"/>
  <!-- floor plank lines -->
  <line x1="120" y1="446" x2="70" y2="600" stroke="#a5876a" stroke-width="2" opacity="0.35"/>
  <line x1="340" y1="446" x2="330" y2="600" stroke="#a5876a" stroke-width="2" opacity="0.35"/>
  <line x1="560" y1="446" x2="600" y2="600" stroke="#a5876a" stroke-width="2" opacity="0.35"/>
  <line x1="720" y1="446" x2="770" y2="600" stroke="#a5876a" stroke-width="2" opacity="0.35"/>

  <!-- warm ambient glow behind cabinet -->
  <ellipse cx="400" cy="250" rx="320" ry="240" fill="url(#glow)"/>

  <!-- cabinet floor shadow -->
  <ellipse cx="400" cy="470" rx="290" ry="30" fill="#1f1b16" opacity="0.12"/>

  <!-- =========== DISPLAY CABINET =========== -->
  <!-- outer dark steel frame -->
  <rect x="150" y="70" width="500" height="400" rx="10" fill="url(#steel)"/>
  <!-- inner glass box -->
  <rect x="168" y="88" width="464" height="364" rx="6" fill="url(#cabGlass)"/>
  <!-- lit inner back panel -->
  <rect x="184" y="104" width="432" height="332" rx="5" fill="url(#cabGlassLit)"/>

  <!-- vertical center steel mullion -->
  <rect x="393" y="88" width="14" height="364" fill="url(#steel)" opacity="0.9"/>
  <!-- horizontal steel shelf rails -->
  <rect x="168" y="250" width="464" height="12" rx="3" fill="url(#steelH)"/>
  <rect x="168" y="340" width="464" height="12" rx="3" fill="url(#steelH)"/>

  <!-- top lighting strip -->
  <rect x="184" y="104" width="432" height="14" rx="4" fill="#cf9f5c" opacity="0.35"/>
  <rect x="184" y="104" width="432" height="6" rx="3" fill="#e3e1dc" opacity="0.4"/>

  <!-- glass reflection streaks on cabinet -->
  <polygon points="210,104 260,104 200,436 168,436 168,300" fill="#b8cdd6" opacity="0.06"/>
  <polygon points="470,104 500,104 440,436 420,436" fill="#e3e1dc" opacity="0.05"/>

  <!-- lower empty lit shelves subtle glow -->
  <ellipse cx="288" cy="300" rx="90" ry="30" fill="url(#shelfLight)"/>
  <ellipse cx="512" cy="300" rx="90" ry="30" fill="url(#shelfLight)"/>
  <ellipse cx="400" cy="392" rx="150" ry="30" fill="url(#shelfLight)" opacity="0.6"/>

  <!-- small chrome trophy hint on lower left shelf -->
  <rect x="255" y="278" width="8" height="46" rx="2" fill="url(#chromeStand)"/>
  <ellipse cx="259" cy="272" rx="20" ry="9" fill="#c9c5be"/>
  <path d="M240 272 Q259 300 278 272 Z" fill="#e3e1dc"/>
  <rect x="243" y="324" width="32" height="8" rx="2" fill="#a5876a"/>

  <!-- small amber decanter hint on lower right shelf -->
  <rect x="500" y="292" width="24" height="32" rx="4" fill="#cf9f5c" opacity="0.85"/>
  <rect x="505" y="282" width="14" height="14" rx="3" fill="#b98a4a"/>
  <rect x="503" y="300" width="18" height="18" rx="3" fill="#8a5a20" opacity="0.6"/>

  <!-- =========== LIT GLASS SHELF (top) with HELMET =========== -->
  <!-- glass shelf slab -->
  <rect x="200" y="238" width="400" height="12" rx="3" fill="url(#shelfGlass)"/>
  <rect x="200" y="238" width="400" height="4" rx="2" fill="#e3e1dc" opacity="0.6"/>
  <!-- shelf underglow -->
  <ellipse cx="400" cy="250" rx="180" ry="14" fill="#cf9f5c" opacity="0.3"/>

  <!-- helmet shadow on shelf -->
  <ellipse cx="400" cy="236" rx="105" ry="16" fill="#1f1b16" opacity="0.18"/>

  <!-- chrome display stand under helmet -->
  <rect x="386" y="218" width="28" height="16" rx="3" fill="url(#chromeStand)"/>
  <ellipse cx="400" cy="234" rx="30" ry="7" fill="#c9c5be"/>

  <!-- ===== RACING HELMET (white & olive) ===== -->
  <!-- main shell -->
  <path d="M300 150
           Q300 92 400 90
           Q500 92 500 158
           L500 190
           Q500 214 470 220
           L330 220
           Q300 214 300 188
           Z" fill="url(#helmShell)"/>
  <!-- shell tone step (lower shade) -->
  <path d="M300 178 Q300 214 330 220 L470 220 Q500 214 500 190 L500 178 Z" fill="#e3e1dc" opacity="0.7"/>
  <!-- top highlight -->
  <path d="M330 108 Q400 96 470 112 Q420 104 400 104 Q360 104 330 118 Z" fill="#ffffff" opacity="0.9"/>

  <!-- olive livery stripe -->
  <path d="M300 150 Q300 118 340 102 L372 102 Q332 122 332 156 L332 220 L308 220 Q300 210 300 190 Z" fill="url(#helmOlive)"/>
  <path d="M470 106 Q500 124 500 158 L500 190 Q500 210 490 220 L466 220 L466 128 Q450 112 434 104 Z" fill="url(#helmOlive)"/>
  <!-- olive accent band across brow -->
  <path d="M332 156 L466 156 L466 176 L332 176 Z" fill="#7a7c5c"/>
  <path d="M332 156 L466 156 L466 162 L332 162 Z" fill="#8a8c62"/>

  <!-- top vent -->
  <path d="M378 96 Q400 90 422 96 L418 106 L382 106 Z" fill="#3d3a36"/>

  <!-- visor opening -->
  <path d="M328 178
           Q328 170 342 168
           L462 168
           Q472 170 472 180
           L472 200
           Q472 210 458 212
           L344 212
           Q328 210 328 200
           Z" fill="url(#visor)"/>
  <!-- visor glass reflection -->
  <path d="M344 176 L438 176 Q446 176 444 182 L360 200 Q346 200 344 192 Z" fill="#b8cdd6" opacity="0.22"/>
  <path d="M350 178 L392 178 L372 196 L352 196 Z" fill="#e3e1dc" opacity="0.14"/>

  <!-- visor chrome trim -->
  <path d="M328 166 Q328 160 344 158 L462 158 Q474 160 474 168 L470 172 Q470 166 458 165 L344 165 Q334 166 332 172 Z" fill="url(#chromeStand)"/>

  <!-- chin bar -->
  <path d="M330 212 Q330 224 346 226 L458 226 Q472 224 472 212 L466 212 Q470 218 456 220 L346 220 Q332 218 336 212 Z" fill="#cbb287" opacity="0.35"/>

  <!-- chin vent slats -->
  <rect x="378" y="216" width="44" height="4" rx="2" fill="#3d3a36" opacity="0.6"/>

  <!-- amber label chip on shell (no text, geometric badge) -->
  <circle cx="356" cy="192" r="9" fill="#cf9f5c"/>
  <circle cx="356" cy="192" r="4" fill="#b98a4a"/>

  <!-- side chrome pivot -->
  <circle cx="332" cy="188" r="7" fill="url(#chromeStand)"/>
  <circle cx="332" cy="188" r="3" fill="#c9c5be"/>

  <!-- =========== cabinet base plinth =========== -->
  <rect x="150" y="452" width="500" height="26" rx="6" fill="url(#steel)"/>
  <rect x="150" y="452" width="500" height="6" rx="3" fill="#4a4640" opacity="0.7"/>
  <!-- feet -->
  <rect x="176" y="478" width="20" height="14" rx="3" fill="#15130f"/>
  <rect x="604" y="478" width="20" height="14" rx="3" fill="#15130f"/>

  <!-- soft wall shadow of cabinet -->
  <rect x="650" y="80" width="40" height="380" rx="8" fill="#1f1b16" opacity="0.05"/>

  <!-- subtle floor reflection of cabinet base -->
  <ellipse cx="400" cy="492" rx="240" ry="10" fill="#a5876a" opacity="0.2"/>
</svg>