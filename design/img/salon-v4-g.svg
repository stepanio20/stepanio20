<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f7f3ec"/>
    </linearGradient>
    <linearGradient id="oakSlat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8dcc6"/>
      <stop offset="0.35" stop-color="#d8c19a"/>
      <stop offset="0.7" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="oakSlatLit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7f3ec"/>
      <stop offset="0.4" stop-color="#e8dcc6"/>
      <stop offset="1" stop-color="#d8c19a"/>
    </linearGradient>
    <linearGradient id="oakRecess" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d5138"/>
      <stop offset="0.5" stop-color="#5c4632"/>
      <stop offset="1" stop-color="#4a3624"/>
    </linearGradient>
    <linearGradient id="boardTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ead9"/>
      <stop offset="0.5" stop-color="#e0cba4"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="boardFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3bc93"/>
      <stop offset="0.55" stop-color="#c8a87c"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="walnut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d5138"/>
      <stop offset="1" stop-color="#4a3624"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a968f"/>
      <stop offset="0.22" stop-color="#e3e1dc"/>
      <stop offset="0.45" stop-color="#c9c5be"/>
      <stop offset="0.62" stop-color="#f7f3ec"/>
      <stop offset="0.8" stop-color="#9a968f"/>
      <stop offset="1" stop-color="#c9c5be"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e1dc"/>
      <stop offset="0.5" stop-color="#c9c5be"/>
      <stop offset="1" stop-color="#9a968f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#b8cdd6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9ab6c1" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="boucle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f2ead9"/>
      <stop offset="1" stop-color="#e3e1dc"/>
    </linearGradient>
    <linearGradient id="linen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ead9"/>
      <stop offset="0.5" stop-color="#e8dcc6"/>
      <stop offset="1" stop-color="#d8c19a"/>
    </linearGradient>
    <linearGradient id="jute" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0cba4"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#b89a72"/>
    </linearGradient>
    <radialGradient id="softShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1f1b16" stop-opacity="0.14"/>
      <stop offset="0.7" stop-color="#1f1b16" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#1f1b16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightWash" cx="0.18" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#cf9f5c" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#cf9f5c" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#cf9f5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="olive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8c62"/>
      <stop offset="1" stop-color="#63654a"/>
    </linearGradient>
    <linearGradient id="oliveLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9c70"/>
      <stop offset="1" stop-color="#7a7c5c"/>
    </linearGradient>
