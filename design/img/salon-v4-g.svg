  <!-- base wall -->
  <rect x="0" y="0" width="800" height="600" fill="url(#wall)"/>

  <!-- oak vertical slat wall (macro backdrop) -->
  <rect x="0" y="30" width="800" height="470" fill="url(#oakRecess)"/>
  <g>
    <rect x="4" y="30" width="46" height="470" rx="4" fill="url(#oakSlatLit)"/>
    <rect x="61" y="30" width="46" height="470" rx="4" fill="url(#oakSlatLit)"/>
    <rect x="118" y="30" width="46" height="470" rx="4" fill="url(#oakSlat)"/>
    <rect x="175" y="30" width="46" height="470" rx="4" fill="url(#oakSlat)"/>
    <rect x="232" y="30" width="46" height="470" rx="4" fill="url(#oakSlat)"/>
    <rect x="289" y="30" width="46" height="470" rx="4" fill="url(#oakSlat)"/>
    <rect x="346" y="30" width="46" height="470" rx="4" fill="url(#oakSlat)"/>
    <rect x="403" y="30" width="46" height="470" rx="4" fill="url(#oakSlat)"/>
    <rect x="460" y="30" width="46" height="470" rx="4" fill="url(#oakSlat)"/>
    <rect x="517" y="30" width="46" height="470" rx="4" fill="url(#oakSlat)"/>
    <rect x="574" y="30" width="46" height="470" rx="4" fill="url(#oakSlat)"/>
    <rect x="631" y="30" width="46" height="470" rx="4" fill="url(#oakSlat)"/>
    <rect x="688" y="30" width="46" height="470" rx="4" fill="url(#oakSlat)"/>
    <rect x="745" y="30" width="46" height="470" rx="4" fill="url(#oakSlat)"/>
  </g>
  <!-- slat left-edge highlights (raking light) -->
  <g opacity="0.5">
    <rect x="4" y="30" width="6" height="470" fill="#faf7f2"/>
    <rect x="61" y="30" width="6" height="470" fill="#faf7f2"/>
    <rect x="118" y="30" width="6" height="470" fill="#f2ead9"/>
    <rect x="175" y="30" width="5" height="470" fill="#f2ead9"/>
    <rect x="232" y="30" width="5" height="470" fill="#f2ead9"/>
    <rect x="289" y="30" width="5" height="470" fill="#e8dcc6"/>
    <rect x="346" y="30" width="5" height="470" fill="#e8dcc6"/>
    <rect x="403" y="30" width="5" height="470" fill="#e8dcc6"/>
    <rect x="460" y="30" width="5" height="470" fill="#e0cba4"/>
    <rect x="517" y="30" width="5" height="470" fill="#e0cba4"/>
    <rect x="574" y="30" width="5" height="470" fill="#e0cba4"/>
    <rect x="631" y="30" width="5" height="470" fill="#e0cba4"/>
    <rect x="688" y="30" width="5" height="470" fill="#e0cba4"/>
    <rect x="745" y="30" width="5" height="470" fill="#e0cba4"/>
  </g>
  <!-- slat right-edge soft shade -->
  <g opacity="0.35">
    <rect x="44" y="30" width="6" height="470" fill="#a5876a"/>
    <rect x="101" y="30" width="6" height="470" fill="#a5876a"/>
    <rect x="158" y="30" width="6" height="470" fill="#a5876a"/>
    <rect x="215" y="30" width="6" height="470" fill="#a5876a"/>
    <rect x="272" y="30" width="6" height="470" fill="#a5876a"/>
    <rect x="329" y="30" width="6" height="470" fill="#a5876a"/>
    <rect x="386" y="30" width="6" height="470" fill="#a5876a"/>
    <rect x="443" y="30" width="6" height="470" fill="#a5876a"/>
    <rect x="500" y="30" width="6" height="470" fill="#a5876a"/>
    <rect x="557" y="30" width="6" height="470" fill="#a5876a"/>
    <rect x="614" y="30" width="6" height="470" fill="#a5876a"/>
    <rect x="671" y="30" width="6" height="470" fill="#a5876a"/>
    <rect x="728" y="30" width="6" height="470" fill="#a5876a"/>
    <rect x="785" y="30" width="6" height="470" fill="#a5876a"/>
  </g>
  <!-- wood grain on slats -->
  <g stroke="#a5876a" stroke-width="0.8" fill="none" opacity="0.35">
    <path d="M25 30 C21 140 30 260 24 380 C21 440 27 470 25 500"/>
    <path d="M82 30 C88 150 80 250 86 360 C90 430 82 470 84 500"/>
    <path d="M139 30 C135 130 143 270 137 390 C133 450 141 480 139 500"/>
    <path d="M253 30 C258 140 250 260 256 380 C260 440 252 480 254 500"/>
    <path d="M310 30 C305 150 313 250 307 370 C303 440 311 470 309 500"/>
    <path d="M367 30 C372 140 364 260 370 380 C374 440 366 480 368 500"/>
    <path d="M481 30 C476 140 484 260 478 380 C474 440 482 480 480 500"/>
    <path d="M538 30 C543 150 535 250 541 360 C545 430 537 470 539 500"/>
    <path d="M652 30 C647 140 655 260 649 380 C645 440 653 480 651 500"/>
    <path d="M709 30 C714 150 706 250 712 360 C716 430 708 470 710 500"/>
  </g>

  <!-- warm raking light wash across the wall -->
  <rect x="0" y="0" width="800" height="600" fill="url(#lightWash)"/>
  <polygon points="0,30 250,30 90,500 0,500" fill="#f7f3ec" opacity="0.16"/>

  <!-- skirting line where slat wall meets floor -->
  <rect x="0" y="494" width="800" height="8" fill="#4a3624" opacity="0.5"/>
  <rect x="0" y="490" width="800" height="6" fill="#e8dcc6" opacity="0.7"/>

  <!-- oak floor lower third with plank lines -->
  <rect x="0" y="500" width="800" height="100" fill="url(#floor)"/>
  <g stroke="#a5876a" stroke-width="1.4" opacity="0.4">
    <line x1="0" y1="528" x2="800" y2="528"/>
    <line x1="0" y1="556" x2="800" y2="556"/>
    <line x1="0" y1="584" x2="800" y2="584"/>
  </g>
  <g stroke="#6d5138" stroke-width="1" opacity="0.28">
    <line x1="150" y1="500" x2="150" y2="528"/>
    <line x1="430" y1="500" x2="430" y2="528"/>
    <line x1="680" y1="500" x2="680" y2="528"/>
    <line x1="90" y1="528" x2="90" y2="556"/>
    <line x1="340" y1="528" x2="340" y2="556"/>
    <line x1="600" y1="528" x2="600" y2="556"/>
    <line x1="220" y1="556" x2="220" y2="584"/>
    <line x1="520" y1="556" x2="520" y2="584"/>
  </g>
  <rect x="0" y="500" width="800" height="18" fill="#f2ead9" opacity="0.18"/>

  <!-- soft contact shadow of the sideboard on the floor -->
  <ellipse cx="400" cy="512" rx="380" ry="26" fill="url(#softShadow)"/>

  <!-- very long light-oak sideboard (foreground macro) -->
  <!-- body face -->
  <rect x="20" y="352" width="760" height="150" rx="10" fill="url(#boardFace)"/>
  <!-- top surface with warm sheen -->
  <path d="M14 352 L786 352 L760 322 L40 322 Z" fill="url(#boardTop)"/>
  <rect x="20" y="348" width="760" height="8" fill="#f2ead9" opacity="0.6"/>
  <!-- top-surface reflected light streak -->
  <path d="M40 340 L760 340 L748 330 L52 330 Z" fill="#faf7f2" opacity="0.4"/>
  <!-- door panels -->
  <rect x="40" y="372" width="220" height="112" rx="6" fill="url(#boardFace)"/>
  <rect x="272" y="372" width="220" height="112" rx="6" fill="url(#boardFace)"/>
  <rect x="504" y="372" width="256" height="112" rx="6" fill="url(#boardFace)"/>
  <!-- panel inner shade + light -->
  <g opacity="0.5">
    <rect x="40" y="372" width="220" height="10" fill="#f2ead9"/>
    <rect x="272" y="372" width="220" height="10" fill="#f2ead9"/>
    <rect x="504" y="372" width="256" height="10" fill="#f2ead9"/>
  </g>
  <g opacity="0.3">
    <rect x="40" y="474" width="220" height="10" fill="#6d5138"/>
    <rect x="272" y="474" width="220" height="10" fill="#6d5138"/>
    <rect x="504" y="474" width="256" height="10" fill="#6d5138"/>
  </g>
  <!-- horizontal wood grain on sideboard face -->
  <g stroke="#a5876a" stroke-width="0.8" fill="none" opacity="0.32">
    <path d="M40 392 C200 388 400 396 620 390 C700 388 740 393 758 391"/>
    <path d="M40 410 C220 414 420 406 640 412 C710 414 745 409 758 411"/>
    <path d="M40 430 C180 426 380 434 600 428 C690 425 740 431 758 429"/>
    <path d="M40 452 C240 456 440 448 660 454 C720 456 748 451 758 453"/>
    <path d="M40 468 C200 464 400 472 620 466 C700 464 745 469 758 467"/>
  </g>
  <!-- panel seams -->
  <rect x="264" y="372" width="4" height="112" fill="#6d5138" opacity="0.5"/>
  <rect x="496" y="372" width="4" height="112" fill="#6d5138" opacity="0.5"/>
  <!-- chrome recessed handles -->
  <rect x="235" y="418" width="18" height="6" rx="3" fill="url(#chromeV)"/>
  <rect x="279" y="418" width="18" height="6" rx="3" fill="url(#chromeV)"/>
  <rect x="740" y="418" width="14" height="6" rx="3" fill="url(#chromeV)"/>
  <!-- legs -->
  <rect x="52" y="484" width="16" height="24" rx="3" fill="url(#walnut)"/>
  <rect x="732" y="484" width="16" height="24" rx="3" fill="url(#walnut)"/>
  <rect x="392" y="484" width="16" height="24" rx="3" fill="url(#walnut)"/>

  <!-- === objects on the sideboard, celebrating materials === -->

  <!-- object shadows on the top surface -->
  <ellipse cx="150" cy="330" rx="70" ry="12" fill="url(#softShadow)"/>
  <ellipse cx="360" cy="332" rx="46" ry="9" fill="url(#softShadow)"/>
  <ellipse cx="560" cy="330" rx="60" ry="11" fill="url(#softShadow)"/>

  <!-- glass vase (glass material) with soft glass-blue -->
  <path d="M330 330 C324 300 330 268 344 250 C358 268 364 300 358 330 Z" fill="url(#glass)"/>
  <path d="M336 322 C332 300 336 276 344 262 C348 276 350 300 348 322 Z" fill="#faf7f2" opacity="0.5"/>
  <rect x="338" y="246" width="12" height="8" rx="3" fill="#9ab6c1" opacity="0.8"/>
  <ellipse cx="344" cy="330" rx="17" ry="4" fill="#9ab6c1" opacity="0.6"/>
  <!-- specular glint on glass -->
  <path d="M338 268 C336 288 338 308 340 322" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>

  <!-- single large plant emerging from vase -->
  <g>
    <path d="M344 250 C338 210 322 186 300 168" stroke="url(#olive)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M344 250 C350 214 366 190 392 176" stroke="url(#olive)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M344 250 C344 208 348 176 350 150" stroke="url(#oliveLit)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M300 168 C282 158 270 168 268 186 C288 188 302 182 300 168 Z" fill="url(#oliveLit)"/>
    <path d="M392 176 C412 166 426 176 428 196 C406 198 392 190 392 176 Z" fill="url(#olive)"/>
    <path d="M350 150 C338 128 344 108 362 98 C372 120 366 142 350 150 Z" fill="url(#oliveLit)"/>
    <path d="M350 150 C362 130 384 124 402 132 C392 154 368 160 350 150 Z" fill="url(#olive)"/>
    <path d="M300 168 C288 148 294 128 312 118 C322 140 316 162 300 168 Z" fill="url(#olive)"/>
    <path d="M344 240 C328 236 316 224 314 208 C332 210 344 222 344 240 Z" fill="url(#oliveLit)"/>
    <path d="M344 240 C360 236 372 226 376 210 C358 208 346 220 344 240 Z" fill="url(#olive)"/>
  </g>

  <!-- chrome cylinder object (metal material) -->
  <rect x="126" y="288" width="48" height="42" rx="4" fill="url(#chrome)"/>
  <ellipse cx="150" cy="288" rx="24" ry="6" fill="#e3e1dc"/>
  <ellipse cx="150" cy="288" rx="16" ry="4" fill="#9a968f"/>
  <rect x="132" y="290" width="5" height="38" fill="#faf7f2" opacity="0.8"/>
  <rect x="160" y="290" width="4" height="38" fill="#f7f3ec" opacity="0.6"/>
  <ellipse cx="150" cy="330" rx="24" ry="5" fill="#9a968f" opacity="0.5"/>

  <!-- bouclé cushion / textile block (textile material) -->
  <rect x="512" y="286" width="96" height="44" rx="16" fill="url(#boucle)"/>
  <g fill="#e3e1dc" opacity="0.7">
    <circle cx="524" cy="300" r="3"/>
    <circle cx="536" cy="308" r="3"/>
    <circle cx="548" cy="298" r="3"/>
    <circle cx="560" cy="310" r="3"/>
    <circle cx="572" cy="300" r="3"/>
    <circle cx="584" cy="308" r="3"/>
    <circle cx="596" cy="300" r="3"/>
    <circle cx="530" cy="318" r="3"/>
    <circle cx="554" cy="320" r="3"/>
    <circle cx="578" cy="318" r="3"/>
    <circle cx="600" cy="316" r="3"/>
    <circle cx="518" cy="312" r="3"/>
  </g>
  <g fill="#ffffff" opacity="0.8">
    <circle cx="527" cy="296" r="2"/>
    <circle cx="551" cy="294" r="2"/>
    <circle cx="575" cy="296" r="2"/>
    <circle cx="599" cy="296" r="2"/>
    <circle cx="539" cy="304" r="2"/>
    <circle cx="563" cy="306" r="2"/>
  </g>
  <rect x="512" y="288" width="96" height="8" rx="4" fill="#ffffff" opacity="0.6"/>

  <!-- jute weave sample panel leaning at right (textile) -->
  <rect x="648" y="256" width="70" height="74" rx="6" fill="url(#jute)"/>
  <g stroke="#a5876a" stroke-width="1.4" opacity="0.4">
    <line x1="648" y1="268" x2="718" y2="268"/>
    <line x1="648" y1="282" x2="718" y2="282"/>
    <line x1="648" y1="296" x2="718" y2="296"/>
    <line x1="648" y1="310" x2="718" y2="310"/>
    <line x1="648" y1="324" x2="718" y2="324"/>
  </g>
  <g stroke="#b89a72" stroke-width="1.2" opacity="0.45">
    <line x1="660" y1="256" x2="660" y2="330"/>
    <line x1="674" y1="256" x2="674" y2="330"/>
    <line x1="688" y1="256" x2="688" y2="330"/>
    <line x1="702" y1="256" x2="702" y2="330"/>
  </g>
  <rect x="648" y="256" width="8" height="74" fill="#f2ead9" opacity="0.5"/>

  <!-- linen curtain edge draping in at far left (textile) -->
  <path d="M0 30 C36 60 20 160 34 260 C22 360 40 440 24 502 L0 502 Z" fill="url(#linen)"/>
  <g stroke="#cbb287" stroke-width="1.6" fill="none" opacity="0.4">
    <path d="M12 40 C30 140 18 260 28 380 C22 440 30 480 20 500"/>
    <path d="M24 40 C40 140 30 260 38 380 C32 440 40 480 32 500"/>
  </g>
  <path d="M0 30 C20 60 12 160 20 260 C14 360 24 440 14 502 L0 502 Z" fill="#f2ead9" opacity="0.45"/>

  <!-- final warm raking glow, top-left, over everything subtly -->
  <polygon points="0,30 180,30 60,340 0,340" fill="#cf9f5c" opacity="0.08"/>
  <ellipse cx="120" cy="120" rx="160" ry="120" fill="#f7f3ec" opacity="0.12"/>
</svg>