<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="lightPool" cx="38%" cy="26%" r="78%">
      <stop offset="0%" stop-color="#fff9ef"/>
      <stop offset="34%" stop-color="#faf3e6"/>
      <stop offset="68%" stop-color="#efe4d0"/>
      <stop offset="100%" stop-color="#e3d5bd"/>
    </radialGradient>
    <linearGradient id="wallShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9f3e8"/>
      <stop offset="55%" stop-color="#f4ecdd"/>
      <stop offset="100%" stop-color="#eadfca"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7e6" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#fff3d8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fff3d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cabTop" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#e0cba3"/>
      <stop offset="42%" stop-color="#d3b98d"/>
      <stop offset="78%" stop-color="#c6a97b"/>
      <stop offset="100%" stop-color="#b7986a"/>
    </linearGradient>
    <linearGradient id="cabTopSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff6e6" stop-opacity="0.7"/>
      <stop offset="30%" stop-color="#fff6e6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cabFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbb287"/>
      <stop offset="45%" stop-color="#bfa274"/>
      <stop offset="100%" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="cabFaceDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b49a70"/>
      <stop offset="100%" stop-color="#8f7454"/>
    </linearGradient>
    <linearGradient id="edgeHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2e2c2"/>
      <stop offset="100%" stop-color="#d3b98d"/>
    </linearGradient>
    <linearGradient id="leatherTray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a5c3e"/>
      <stop offset="45%" stop-color="#6d5138"/>
      <stop offset="100%" stop-color="#4a3624"/>
    </linearGradient>
    <linearGradient id="leatherWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6644"/>
      <stop offset="100%" stop-color="#5c4632"/>
    </linearGradient>
    <radialGradient id="leatherInner" cx="42%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#6a4f36"/>
      <stop offset="100%" stop-color="#43301f"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f0ec"/>
      <stop offset="30%" stop-color="#c9c5be"/>
      <stop offset="55%" stop-color="#9a968f"/>
      <stop offset="72%" stop-color="#e3e1dc"/>
      <stop offset="100%" stop-color="#8f8b83"/>
    </linearGradient>
    <linearGradient id="brassKey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6c07e"/>
      <stop offset="45%" stop-color="#cf9f5c"/>
      <stop offset="100%" stop-color="#8a5a20"/>
    </linearGradient>
    <linearGradient id="vaseBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbf6ec"/>
      <stop offset="30%" stop-color="#f0e7d5"/>
      <stop offset="62%" stop-color="#e2d3b8"/>
      <stop offset="100%" stop-color="#c9b48f"/>
    </linearGradient>
    <radialGradient id="vaseGlow" cx="34%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffaf0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fffaf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6e6ec"/>
      <stop offset="50%" stop-color="#b8cdd6"/>
      <stop offset="100%" stop-color="#8fa9b2"/>
    </linearGradient>
    <linearGradient id="olive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a8c62"/>
      <stop offset="100%" stop-color="#63654a"/>
    </linearGradient>
    <radialGradient id="softShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d3a36" stop-opacity="0.34"/>
      <stop offset="70%" stop-color="#3d3a36" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3d3a36" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="42%" cy="34%" r="85%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="72%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#241d12" stop-opacity="0.30"/>
    </radialGradient>
    <linearGradient id="grainA" x1="0" y1="0" x2="1" y2="0.12">
      <stop offset="0%" stop-color="#c8a87c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a5876a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c8a87c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="600" height="750" fill="url(#wallShade)"/>
  <rect width="600" height="750" fill="url(#lightPool)" opacity="0.9"/>

  <!-- soft cast on wall -->
  <ellipse cx="230" cy="250" rx="300" ry="330" fill="#fff8ea" opacity="0.35"/>
  <ellipse cx="470" cy="560" rx="220" ry="260" fill="#c9b48f" opacity="0.18"/>

  <!-- light beam from upper-left -->
  <polygon points="0,0 250,0 120,470 0,300" fill="url(#beam)"/>
  <polygon points="60,0 150,0 90,360 30,300" fill="#fff8e6" opacity="0.25"/>

  <!-- baseboard / wall break line -->
  <rect x="0" y="512" width="600" height="4" fill="#e6d8be" opacity="0.6"/>
  <rect x="0" y="516" width="600" height="2" fill="#fffaf0" opacity="0.5"/>

  <!-- ================= CABINET ================= -->
  <!-- ambient contact shadow under cabinet -->
  <ellipse cx="300" cy="690" rx="270" ry="42" fill="url(#softShadow)"/>

  <!-- cabinet face (front) -->
  <rect x="70" y="520" width="460" height="220" fill="url(#cabFace)"/>
  <!-- face wood grain -->
  <g opacity="0.4">
    <rect x="70" y="536" width="460" height="3" fill="url(#grainA)"/>
    <rect x="70" y="568" width="460" height="2" fill="url(#grainA)"/>
    <rect x="70" y="602" width="460" height="3" fill="url(#grainA)"/>
    <rect x="70" y="642" width="460" height="2" fill="url(#grainA)"/>
    <rect x="70" y="684" width="460" height="3" fill="url(#grainA)"/>
    <path d="M150 522 q40 90 8 216" stroke="#9c7f5e" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M300 522 q28 100 -4 216" stroke="#9c7f5e" stroke-width="1.2" fill="none" opacity="0.4"/>
    <path d="M440 522 q34 96 6 216" stroke="#9c7f5e" stroke-width="1.2" fill="none" opacity="0.45"/>
  </g>
  <!-- two slim drawer seams -->
  <rect x="70" y="606" width="460" height="2" fill="#8f7454" opacity="0.6"/>
  <rect x="70" y="608" width="460" height="1.5" fill="#e2cba0" opacity="0.5"/>
  <!-- door split -->
  <rect x="298" y="520" width="2" height="220" fill="#8f7454" opacity="0.5"/>
  <!-- slim brass pulls -->
  <rect x="250" y="560" width="4" height="30" rx="2" fill="url(#brassKey)"/>
  <rect x="346" y="560" width="4" height="30" rx="2" fill="url(#brassKey)"/>
  <rect x="250" y="640" width="4" height="26" rx="2" fill="url(#brassKey)"/>
  <rect x="346" y="640" width="4" height="26" rx="2" fill="url(#brassKey)"/>
  <!-- angled leg feet -->
  <rect x="92" y="740" width="14" height="10" fill="#8f7454"/>
  <rect x="494" y="740" width="14" height="10" fill="#8f7454"/>

  <!-- cabinet top thickness (front edge) -->
  <rect x="56" y="500" width="488" height="24" rx="4" fill="url(#cabFaceDark)"/>
  <rect x="56" y="500" width="488" height="5" fill="url(#edgeHi)"/>

  <!-- cabinet top surface (perspective slab) -->
  <polygon points="56,500 544,500 512,432 88,432" fill="url(#cabTop)"/>
  <polygon points="56,500 544,500 512,432 88,432" fill="url(#cabTopSheen)"/>
  <!-- top grain -->
  <g opacity="0.35">
    <polygon points="88,448 512,448 512,451 88,451" fill="#a5876a"/>
    <polygon points="88,466 512,466 512,469 88,469" fill="#a5876a"/>
    <polygon points="88,484 512,484 512,487 88,487" fill="#a5876a"/>
    <path d="M180 434 q30 30 6 64" stroke="#9c7f5e" stroke-width="1" fill="none"/>
    <path d="M330 434 q22 32 -2 64" stroke="#9c7f5e" stroke-width="1" fill="none"/>
    <path d="M430 434 q26 30 4 64" stroke="#9c7f5e" stroke-width="1" fill="none"/>
  </g>
  <!-- warm light wash across the top surface -->
  <polygon points="88,432 320,432 300,500 130,500" fill="#fff6e2" opacity="0.4"/>

  <!-- object contact shadows on top -->
  <ellipse cx="250" cy="474" rx="120" ry="20" fill="#5c4632" opacity="0.18"/>
  <ellipse cx="405" cy="466" rx="46" ry="16" fill="#5c4632" opacity="0.2"/>
  <ellipse cx="150" cy="470" rx="40" ry="13" fill="#5c4632" opacity="0.18"/>

  <!-- ================= LEATHER TRAY (hero prop) ================= -->
  <g>
    <!-- tray outer -->
    <polygon points="168,452 356,452 336,494 148,494" fill="url(#leatherTray)"/>
    <!-- tray raised wall back -->
    <polygon points="168,452 356,452 352,444 172,444" fill="url(#leatherWall)"/>
    <!-- tray raised wall left/right -->
    <polygon points="168,452 172,444 152,486 148,494" fill="#5c4632"/>
    <polygon points="356,452 352,444 332,486 336,494" fill="#43301f"/>
    <!-- tray inner well -->
    <polygon points="180,455 344,455 326,489 160,489" fill="url(#leatherInner)"/>
    <!-- stitch line -->
    <polygon points="176,453 348,453 348,455 176,455" fill="#3a2a1a" opacity="0.6"/>
    <g stroke="#c8a87c" stroke-width="0.8" opacity="0.5" stroke-dasharray="3 3">
      <line x1="182" y1="458" x2="342" y2="458"/>
      <line x1="164" y1="486" x2="324" y2="486"/>
    </g>
    <!-- leather sheen -->
    <polygon points="190,456 260,456 250,478 172,478" fill="#8a6644" opacity="0.35"/>
  </g>

  <!-- keys resting in tray -->
  <g transform="rotate(-14 250 474)">
    <rect x="228" y="468" width="46" height="7" rx="3.5" fill="url(#brassKey)"/>
    <circle cx="228" cy="471.5" r="9" fill="none" stroke="url(#brassKey)" stroke-width="4"/>
    <rect x="270" y="466" width="6" height="4" fill="#8a5a20"/>
    <rect x="270" y="474" width="8" height="3" fill="#8a5a20"/>
  </g>
  <g transform="rotate(6 262 480)">
    <rect x="248" y="479" width="42" height="6" rx="3" fill="url(#chrome)"/>
    <circle cx="248" cy="482" r="8" fill="none" stroke="url(#chrome)" stroke-width="3.4"/>
    <rect x="286" y="477" width="5" height="4" fill="#9a968f"/>
    <rect x="286" y="484" width="7" height="2.5" fill="#9a968f"/>
  </g>
  <!-- small key fob ring highlight -->
  <circle cx="226" cy="470" r="2" fill="#fff4d6" opacity="0.8"/>

  <!-- ================= FOLDED SUNGLASSES ================= -->
  <g transform="rotate(-8 300 480)">
    <!-- temple arms folded -->
    <rect x="300" y="470" width="70" height="5" rx="2.5" fill="#2a2724"/>
    <rect x="300" y="476" width="66" height="4" rx="2" fill="#3d3a36"/>
    <!-- front frame (two lenses folded together) -->
    <g>
      <rect x="286" y="462" width="34" height="24" rx="11" fill="#2a2724"/>
      <rect x="289" y="465" width="28" height="18" rx="9" fill="url(#glass)" opacity="0.85"/>
      <rect x="291" y="467" width="12" height="7" rx="3" fill="#dff0f5" opacity="0.7"/>
    </g>
    <!-- hinge dot -->
    <circle cx="300" cy="474" r="2.4" fill="url(#brassKey)"/>
    <!-- arm tip -->
    <circle cx="370" cy="472.5" r="3" fill="#15130f"/>
  </g>

  <!-- ================= CERAMIC VASE with dried stem ================= -->
  <g>
    <!-- vase cast shadow -->
    <ellipse cx="412" cy="466" rx="34" ry="11" fill="#5c4632" opacity="0.22"/>
    <!-- vase body -->
    <path d="M396 466
             C384 456 386 420 398 402
             C404 393 420 393 426 402
             C438 420 440 456 428 466
             C420 471 404 471 396 466 Z" fill="url(#vaseBody)"/>
    <!-- inner glow -->
    <path d="M396 466 C384 456 386 420 398 402 C404 393 420 393 426 402 C438 420 440 456 428 466 C420 471 404 471 396 466 Z" fill="url(#vaseGlow)"/>
    <!-- neck rim -->
    <ellipse cx="412" cy="400" rx="15" ry="5" fill="#e2d3b8"/>
    <ellipse cx="412" cy="399" rx="12" ry="3.4" fill="#8a7355"/>
    <ellipse cx="412" cy="398.5" rx="12" ry="3" fill="#6d5138"/>
    <!-- ceramic sheen streak -->
    <path d="M401 462 C393 452 395 424 404 408" stroke="#fffaf0" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round"/>
    <!-- subtle throwing rings -->
    <path d="M394 448 q18 8 36 0" stroke="#c9b48f" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M392 432 q20 8 40 0" stroke="#c9b48f" stroke-width="1" fill="none" opacity="0.4"/>

    <!-- dried stems -->
    <g stroke="#8a5a20" fill="none" stroke-linecap="round">
      <path d="M412 398 C410 360 402 330 388 306" stroke-width="2.4"/>
      <path d="M412 398 C416 366 424 340 440 316" stroke-width="2"/>
      <path d="M412 398 C412 372 414 350 410 330" stroke-width="1.8"/>
    </g>
    <!-- dried seed heads / leaves -->
    <g fill="#b98a4a" opacity="0.92">
      <ellipse cx="388" cy="304" rx="4" ry="10" transform="rotate(-24 388 304)"/>
      <ellipse cx="441" cy="314" rx="3.6" ry="9" transform="rotate(26 441 314)"/>
      <ellipse cx="409" cy="328" rx="3" ry="8" transform="rotate(-6 409 328)"/>
    </g>
    <g fill="#cf9f5c" opacity="0.75">
      <ellipse cx="386" cy="300" rx="2.4" ry="6" transform="rotate(-24 386 300)"/>
      <ellipse cx="443" cy="310" rx="2.2" ry="5.4" transform="rotate(26 443 310)"/>
    </g>
    <!-- tiny florets -->
    <g fill="#8a5a20">
      <circle cx="384" cy="296" r="1.6"/>
      <circle cx="390" cy="292" r="1.4"/>
      <circle cx="446" cy="306" r="1.5"/>
      <circle cx="438" cy="300" r="1.3"/>
    </g>
  </g>

  <!-- ================= SMALL STACKED BOOK / prop left ================= -->
  <g>
    <ellipse cx="150" cy="470" rx="40" ry="10" fill="#5c4632" opacity="0.12"/>
    <polygon points="118,458 190,458 182,474 110,474" fill="#7a7c5c"/>
    <polygon points="118,458 190,458 190,462 118,462" fill="#8a8c62"/>
    <polygon points="110,474 182,474 182,470 110,470" fill="#63654a"/>
    <!-- pages edge -->
    <polygon points="112,466 184,466 184,469 112,469" fill="#e8dcc6"/>
    <polygon points="114,462 186,462 186,464 114,464" fill="#faf7f2"/>
  </g>

  <!-- ================= TRAILING PLANT LEAF (foreground depth) ================= -->
  <g>
    <path d="M556 470 C520 480 486 512 470 560 C462 584 466 612 480 632
             C486 600 500 566 526 536 C540 520 552 496 556 470 Z"
          fill="url(#olive)" opacity="0.95"/>
    <path d="M552 476 C524 496 502 526 490 566" stroke="#4a4c36" stroke-width="1.6" fill="none" opacity="0.6"/>
    <g stroke="#4a4c36" stroke-width="0.9" opacity="0.5" fill="none">
      <path d="M540 500 l-16 10"/>
      <path d="M528 522 l-16 12"/>
      <path d="M516 548 l-14 12"/>
    </g>
    <!-- leaf sheen -->
    <path d="M548 480 C530 496 514 520 504 548" stroke="#a9ab7e" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- a small second leaf peeking upper-right -->
  <g opacity="0.9">
    <path d="M582 300 C560 306 542 330 536 358 C548 344 566 328 582 316 C586 310 585 304 582 300 Z" fill="#8a8c62"/>
    <path d="M578 306 C562 318 550 336 542 354" stroke="#63654a" stroke-width="1" fill="none" opacity="0.6"/>
  </g>

  <!-- floating dust motes in the light -->
  <g fill="#fff6e0">
    <circle cx="180" cy="180" r="2.2" opacity="0.55"/>
    <circle cx="240" cy="140" r="1.6" opacity="0.45"/>
    <circle cx="120" cy="260" r="1.8" opacity="0.4"/>
    <circle cx="300" cy="220" r="1.3" opacity="0.4"/>
    <circle cx="90" cy="150" r="1.4" opacity="0.5"/>
    <circle cx="360" cy="300" r="1.5" opacity="0.35"/>
    <circle cx="210" cy="330" r="1.2" opacity="0.35"/>
  </g>

  <!-- crisp highlight rim on cabinet front edge catching light -->
  <rect x="88" y="432" width="230" height="2.4" fill="#fff4d6" opacity="0.55"/>

  <!-- overall vignette for mood -->
  <rect width="600" height="750" fill="url(#vignette)"/>
</svg>