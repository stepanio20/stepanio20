  <!-- WALL -->
  <rect x="0" y="0" width="800" height="410" fill="url(#wall)"/>
  <rect x="0" y="0" width="800" height="410" fill="url(#wallGlow)"/>

  <!-- FLOOR band lower third -->
  <rect x="0" y="410" width="800" height="190" fill="url(#floor)"/>
  <!-- skirting line -->
  <rect x="0" y="402" width="800" height="10" fill="#e2cfa8"/>
  <rect x="0" y="410" width="800" height="3" fill="#a5876a" opacity="0.5"/>
  <!-- plank lines -->
  <g stroke="#b8975f" stroke-width="1.4" opacity="0.4">
    <line x1="0" y1="452" x2="800" y2="452"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="552" x2="800" y2="552"/>
  </g>
  <g stroke="#bd9c6e" stroke-width="1" opacity="0.35">
    <line x1="150" y1="413" x2="150" y2="452"/>
    <line x1="420" y1="452" x2="420" y2="500"/>
    <line x1="640" y1="413" x2="640" y2="452"/>
    <line x1="300" y1="500" x2="300" y2="552"/>
    <line x1="560" y1="500" x2="560" y2="552"/>
    <line x1="230" y1="552" x2="230" y2="600"/>
    <line x1="520" y1="552" x2="520" y2="600"/>
  </g>

  <!-- warm raking light wash -->
  <rect x="0" y="0" width="800" height="600" fill="url(#rake)"/>

  <!-- ===== GLOWING RICE-PAPER GLOBE PENDANT (upper left) ===== -->
  <circle cx="150" cy="120" r="120" fill="url(#globeHalo)"/>
  <line x1="150" y1="0" x2="150" y2="52" stroke="#6d5138" stroke-width="3"/>
  <ellipse cx="150" cy="120" rx="76" ry="74" fill="url(#globe)"/>
  <g stroke="#e6cf9e" stroke-width="1" opacity="0.55" fill="none">
    <path d="M92 88 q58 -22 116 0"/>
    <path d="M82 110 q68 -14 136 0"/>
    <path d="M82 132 q68 14 136 0"/>
    <path d="M92 154 q58 22 116 0"/>
  </g>
  <g stroke="#d8bd88" stroke-width="0.8" opacity="0.4">
    <line x1="112" y1="52" x2="98" y2="188"/>
    <line x1="150" y1="46" x2="150" y2="194"/>
    <line x1="188" y1="52" x2="202" y2="188"/>
  </g>
  <ellipse cx="126" cy="98" rx="24" ry="18" fill="#fef9ec" opacity="0.7"/>

  <!-- ===== FRAMED SAND-TONE POSTER (upper right on wall) ===== -->
  <rect x="556" y="70" width="150" height="196" rx="4" fill="#6d5138"/>
  <rect x="562" y="76" width="138" height="184" rx="2" fill="#4a3624"/>
  <rect x="570" y="84" width="122" height="168" rx="2" fill="url(#poster)"/>
  <circle cx="631" cy="150" r="40" fill="#cf9f5c" opacity="0.55"/>
  <path d="M570 210 q40 -30 80 -6 q22 12 42 2 v46 h-122 z" fill="#c8a87c" opacity="0.6"/>
  <path d="M570 230 q34 -18 66 0 q28 14 56 2 v20 h-122 z" fill="#a5876a" opacity="0.5"/>

  <!-- ===== FLOOR-TO-CEILING LINEN CURTAINS (right edge) ===== -->
  <rect x="742" y="0" width="58" height="600" fill="url(#linen)"/>
  <g>
    <path d="M742 0 q6 300 0 600 h14 q-4 -300 4 -600 z" fill="url(#linenFold)" opacity="0.8"/>
    <path d="M760 0 q8 300 0 600 h14 q-4 -300 2 -600 z" fill="url(#linenFold)" opacity="0.7"/>
    <path d="M778 0 q6 300 -2 600 h20 v-600 z" fill="#efe7d6" opacity="0.8"/>
  </g>
  <g stroke="#d3c4a8" stroke-width="1.2" opacity="0.5">
    <line x1="750" y1="0" x2="748" y2="600"/>
    <line x1="768" y1="0" x2="764" y2="600"/>
    <line x1="786" y1="0" x2="782" y2="600"/>
  </g>

