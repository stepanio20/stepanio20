  <!-- top surface -->
  <path d="M150 300 l16 -14 h404 l16 14 z" fill="url(#oakTop)"/>
  <rect x="150" y="300" width="420" height="6" fill="#e2cfa8" opacity="0.7"/>
  <!-- wood grain streaks on carcass -->
  <g stroke="#b8975f" stroke-width="1" opacity="0.32" fill="none">
    <path d="M158 320 q210 -6 404 2"/>
    <path d="M158 342 q210 8 404 -2"/>
    <path d="M158 366 q210 -8 404 4"/>
    <path d="M158 390 q210 8 404 -4"/>
    <path d="M158 412 q210 -4 404 3"/>
  </g>
  <g stroke="#a5876a" stroke-width="0.8" opacity="0.25" fill="none">
    <path d="M158 331 q210 6 404 0"/>
    <path d="M158 378 q210 -6 404 2"/>
    <path d="M158 401 q210 6 404 -2"/>
  </g>
  <!-- three doors -->
  <g>
    <rect x="162" y="312" width="128" height="106" rx="4" fill="url(#oakGrain2)"/>
    <rect x="298" y="312" width="128" height="106" rx="4" fill="url(#oakGrain)"/>
    <rect x="434" y="312" width="124" height="106" rx="4" fill="url(#oakGrain2)"/>
  </g>
  <!-- door seams + grain -->
  <g stroke="#a5876a" stroke-width="1.4" opacity="0.55">
    <line x1="294" y1="316" x2="294" y2="414"/>
    <line x1="430" y1="316" x2="430" y2="414"/>
  </g>
  <g stroke="#b8975f" stroke-width="0.8" opacity="0.3" fill="none">
    <path d="M170 340 q56 -4 112 2"/>
    <path d="M170 372 q56 4 112 -2"/>
    <path d="M306 340 q56 4 112 -2"/>
    <path d="M306 378 q56 -4 112 2"/>
    <path d="M442 344 q52 -4 104 2"/>
    <path d="M442 380 q52 4 104 -2"/>
  </g>
  <!-- chrome handles -->
  <g>
    <rect x="270" y="356" width="8" height="20" rx="4" fill="url(#chromeV)"/>
    <rect x="406" y="356" width="8" height="20" rx="4" fill="url(#chromeV)"/>
    <rect x="540" y="356" width="8" height="20" rx="4" fill="url(#chromeV)"/>
  </g>
  <!-- chrome legs -->
  <g>
    <rect x="176" y="424" width="10" height="26" rx="3" fill="url(#chrome)"/>
    <rect x="360" y="424" width="10" height="26" rx="3" fill="url(#chrome)"/>
    <rect x="536" y="424" width="10" height="26" rx="3" fill="url(#chrome)"/>
    <ellipse cx="181" cy="450" rx="8" ry="3" fill="#1f1b16" opacity="0.18"/>
    <ellipse cx="365" cy="450" rx="8" ry="3" fill="#1f1b16" opacity="0.18"/>
    <ellipse cx="541" cy="450" rx="8" ry="3" fill="#1f1b16" opacity="0.18"/>
  </g>

  <!-- ===== WALL-MOUNTED TV (above sideboard) ===== -->
  <rect x="236" y="150" width="248" height="132" rx="6" fill="#2a2724"/>
  <rect x="244" y="158" width="232" height="116" rx="3" fill="#15130f"/>
  <rect x="244" y="158" width="232" height="116" rx="3" fill="url(#glass)" opacity="0.16"/>
  <path d="M244 158 l120 116 h-120 z" fill="#3d3a36" opacity="0.3"/>
  <rect x="352" y="282" width="16" height="16" fill="#3d3a36"/>

