  <path d="M596 430 q-10 -26 -6 -50 h30 q6 26 -2 50 z" fill="#a5876a"/>
  <path d="M596 388 q-16 -10 -20 6 q22 6 20 -6 z" fill="url(#leaf)"/>
  <g>
    <path d="M611 380 q-40 -30 -34 -86 q34 22 40 86 z" fill="url(#leaf)"/>
    <path d="M611 378 q4 -50 40 -80 q10 44 -30 82 z" fill="url(#leaf2)"/>
    <path d="M611 380 q-52 -8 -66 -52 q46 6 68 48 z" fill="url(#leaf2)"/>
    <path d="M611 378 q52 -14 74 8 q-40 26 -74 -6 z" fill="url(#leaf)"/>
    <path d="M611 376 q6 -64 22 -96 q22 48 -8 96 z" fill="#8a8c62"/>
    <path d="M611 378 q-18 -60 -6 -100 q30 42 12 100 z" fill="#7a7c5c"/>
  </g>
  <g stroke="#4e503a" stroke-width="1" opacity="0.5" fill="none">
    <path d="M611 378 q0 -46 20 -78"/>
    <path d="M611 378 q-6 -40 0 -74"/>
    <path d="M611 378 q40 -12 60 4"/>
    <path d="M611 378 q-44 -18 -56 -40"/>
  </g>

  <!-- ===== WHITE BOUCLE SOFA (macro, front-left, textile hero) ===== -->
  <ellipse cx="180" cy="560" rx="200" ry="28" fill="#1f1b16" opacity="0.12"/>
  <!-- back cushion -->
  <path d="M20 470 q0 -50 60 -50 h150 q60 0 60 50 v40 h-270 z" fill="url(#boucle)"/>
  <!-- seat cushion -->
  <rect x="10" y="500" width="300" height="90" rx="28" fill="url(#boucle)"/>
  <!-- arm -->
  <rect x="-10" y="478" width="70" height="118" rx="30" fill="url(#boucle)"/>
  <path d="M-10 478 q0 -20 30 -18 v130 h-30 z" fill="#f4efe6"/>
  <!-- seam shadows -->
  <path d="M60 500 q100 -12 200 0" stroke="#dcd4c8" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M60 596 v-96" stroke="#dcd4c8" stroke-width="2" opacity="0.5"/>
  <!-- boucle nub texture -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="70" cy="452" r="6"/><circle cx="92" cy="446" r="7"/><circle cx="116" cy="450" r="6"/>
    <circle cx="140" cy="444" r="7"/><circle cx="164" cy="450" r="6"/><circle cx="188" cy="446" r="7"/>
    <circle cx="212" cy="450" r="6"/><circle cx="236" cy="446" r="7"/><circle cx="260" cy="452" r="6"/>
    <circle cx="82" cy="470" r="6"/><circle cx="106" cy="466" r="7"/><circle cx="130" cy="470" r="6"/>
    <circle cx="154" cy="464" r="7"/><circle cx="178" cy="470" r="6"/><circle cx="202" cy="466" r="7"/>
    <circle cx="226" cy="470" r="6"/><circle cx="250" cy="466" r="6"/>
    <circle cx="40" cy="516" r="7"/><circle cx="64" cy="524" r="6"/><circle cx="90" cy="518" r="7"/>
    <circle cx="116" cy="526" r="6"/><circle cx="142" cy="518" r="7"/><circle cx="168" cy="526" r="6"/>
    <circle cx="194" cy="520" r="7"/><circle cx="220" cy="526" r="6"/><circle cx="246" cy="520" r="7"/>
    <circle cx="272" cy="524" r="6"/>
    <circle cx="52" cy="548" r="6"/><circle cx="80" cy="554" r="7"/><circle cx="108" cy="548" r="6"/>
    <circle cx="136" cy="556" r="7"/><circle cx="164" cy="548" r="6"/><circle cx="192" cy="556" r="7"/>
    <circle cx="220" cy="548" r="6"/><circle cx="248" cy="556" r="7"/>
    <circle cx="14" cy="504" r="7"/><circle cx="16" cy="532" r="6"/><circle cx="18" cy="560" r="7"/>
  </g>
  <g fill="#e4ddd0" opacity="0.55">
    <circle cx="81" cy="459" r="4"/><circle cx="129" cy="457" r="4"/><circle cx="177" cy="459" r="4"/>
    <circle cx="225" cy="457" r="4"/><circle cx="103" cy="533" r="4"/><circle cx="155" cy="531" r="4"/>
    <circle cx="207" cy="533" r="4"/><circle cx="67" cy="561" r="4"/><circle cx="150" cy="565" r="4"/>
    <circle cx="234" cy="561" r="4"/>
  </g>

  <!-- ===== JUTE RUG (foreground floor, textile) ===== -->
  <path d="M300 560 l420 -12 l70 52 h-560 z" fill="url(#jute)" opacity="0.95"/>
  <g stroke="#c2ab7e" stroke-width="1" opacity="0.4">
    <line x1="320" y1="566" x2="740" y2="556"/>
    <line x1="330" y1="578" x2="756" y2="568"/>
    <line x1="342" y1="592" x2="772" y2="582"/>
  </g>
  <g stroke="#d3c19a" stroke-width="1" opacity="0.5">
    <line x1="400" y1="552" x2="420" y2="600"/>
    <line x1="520" y1="549" x2="548" y2="600"/>
    <line x1="640" y1="547" x2="676" y2="600"/>
  </g>
  <path d="M300 560 l420 -12" stroke="#a5876a" stroke-width="1.5" opacity="0.35" fill="none"/>

  <!-- second small plant leaf accent on sideboard (glass vase) -->
  <path d="M470 300 q-4 -20 4 -34 h18 q6 14 2 34 z" fill="url(#glass)" opacity="0.85"/>
  <ellipse cx="481" cy="266" rx="11" ry="5" fill="#9fb8c1" opacity="0.7"/>
  <path d="M481 268 q-20 -30 -8 -58 q22 24 8 58 z" fill="url(#leaf2)"/>
  <path d="M481 268 q22 -26 40 -18 q-12 30 -40 18 z" fill="url(#leaf)"/>
  <path d="M481 268 q2 -40 16 -56 q14 34 -16 56 z" fill="#8a8c62"/>

  <!-- amber accent object on sideboard top -->
  <ellipse cx="200" cy="296" rx="16" ry="6" fill="#8a5a20" opacity="0.5"/>
  <path d="M186 296 q-2 -22 14 -26 q16 4 14 26 z" fill="#cf9f5c"/>
  <path d="M186 296 q-2 -18 14 -22 q4 2 4 22 z" fill="#b98a4a"/>
  <ellipse cx="195" cy="278" rx="9" ry="3" fill="#e0b877" opacity="0.8"/>

  <!-- soft glass-blue book / object -->
  <rect x="230" y="284" width="42" height="16" rx="2" fill="#b8cdd6"/>
  <rect x="230" y="284" width="42" height="5" rx="2" fill="#d4e2e7"/>
  <line x1="230" y1="292" x2="272" y2="292" stroke="#9fb8c1" stroke-width="1" opacity="0.6"/>

  <!-- final raking highlight streak -->
  <path d="M150 300 l16 -14 h120 l-90 144 h-46 z" fill="#fff5df" opacity="0.08"/>
