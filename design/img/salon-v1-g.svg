<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f2ece2"/>
    </linearGradient>
    <radialGradient id="wallGlow" cx="0.68" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#fbf6ec"/>
      <stop offset="1" stop-color="#f2ece2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="oakGrain" x1="0" y1="0" x2="1" y2="0.12">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="0.45" stop-color="#cbb287"/>
      <stop offset="0.75" stop-color="#c8a87c"/>
      <stop offset="1" stop-color="#bd9c6e"/>
    </linearGradient>
    <linearGradient id="oakGrain2" x1="0" y1="0" x2="1" y2="0.1">
      <stop offset="0" stop-color="#cbb287"/>
      <stop offset="0.5" stop-color="#c8a87c"/>
      <stop offset="1" stop-color="#b8975f"/>
    </linearGradient>
    <linearGradient id="oakTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2cfa8"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e1dc"/>
      <stop offset="0.45" stop-color="#c9c5be"/>
      <stop offset="0.55" stop-color="#e3e1dc"/>
      <stop offset="1" stop-color="#9a968f"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a968f"/>
      <stop offset="0.3" stop-color="#e3e1dc"/>
      <stop offset="0.55" stop-color="#c9c5be"/>
      <stop offset="1" stop-color="#9a968f"/>
    </linearGradient>
    <radialGradient id="globe" cx="0.4" cy="0.36" r="0.68">
      <stop offset="0" stop-color="#fdf6e4"/>
      <stop offset="0.6" stop-color="#f4e6c6"/>
      <stop offset="1" stop-color="#e6cf9e"/>
    </radialGradient>
    <radialGradient id="globeHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbedcb" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbedcb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="linen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4eee2"/>
      <stop offset="1" stop-color="#e2d7c2"/>
    </linearGradient>
    <linearGradient id="linenFold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8dcc6"/>
      <stop offset="0.5" stop-color="#f6f1e7"/>
      <stop offset="1" stop-color="#dccbb0"/>
    </linearGradient>
    <linearGradient id="boucle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece6dc"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4e2e7"/>
      <stop offset="0.5" stop-color="#b8cdd6"/>
      <stop offset="1" stop-color="#9fb8c1"/>
    </linearGradient>
    <linearGradient id="poster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe4cf"/>
      <stop offset="1" stop-color="#e0d0b2"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8c62"/>
      <stop offset="1" stop-color="#63654a"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a7c5c"/>
      <stop offset="1" stop-color="#5b5d44"/>
    </linearGradient>
    <linearGradient id="jute" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8dcc6"/>
      <stop offset="1" stop-color="#d3c19a"/>
