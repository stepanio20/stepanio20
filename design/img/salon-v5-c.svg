<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3a36"/>
      <stop offset="1" stop-color="#2a2724"/>
    </linearGradient>
    <linearGradient id="oakTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="0.5" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="oakFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5876a"/>
      <stop offset="1" stop-color="#6d5138"/>
    </linearGradient>
    <radialGradient id="riceGlow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="0.55" stop-color="#f0e4c8"/>
      <stop offset="0.85" stop-color="#e2cfa0"/>
      <stop offset="1" stop-color="#cbb287"/>
    </radialGradient>
    <radialGradient id="riceHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cf9f5c" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#cf9f5c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#cf9f5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="domeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3a36"/>
      <stop offset="0.55" stop-color="#2a2724"/>
      <stop offset="1" stop-color="#15130f"/>
    </linearGradient>
    <radialGradient id="domeInner" cx="0.5" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#cf9f5c"/>
      <stop offset="0.45" stop-color="#b98a4a"/>
      <stop offset="1" stop-color="#8a5a20"/>
    </radialGradient>
    <radialGradient id="domeHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cf9f5c" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#b98a4a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#b98a4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chromeRod" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9c5be"/>
      <stop offset="0.5" stop-color="#e3e1dc"/>
      <stop offset="1" stop-color="#c9c5be"/>
    </linearGradient>
    <linearGradient id="glassVase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8cdd6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#b8cdd6" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="poolLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2cfa0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#cf9f5c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- wall -->
  <rect x="0" y="0" width="800" height="430" fill="url(#wall)"/>
  <rect x="0" y="0" width="800" height="430" fill="#2a2724" opacity="0.15"/>

  <!-- ambient light pools on wall -->
  <ellipse cx="250" cy="150" rx="180" ry="150" fill="url(#riceHalo)"/>
  <ellipse cx="565" cy="120" rx="120" ry="110" fill="url(#domeHalo)"/>

  <!-- oak surface -->
  <rect x="0" y="418" width="800" height="182" fill="url(#oakFront)"/>
  <rect x="0" y="410" width="800" height="26" fill="url(#oakTop)"/>
  <rect x="0" y="410" width="800" height="6" fill="#d8c19a" opacity="0.7"/>
  <!-- oak grain lines -->
  <rect x="0" y="470" width="800" height="2" fill="#5c4632" opacity="0.35"/>
  <rect x="0" y="520" width="800" height="2" fill="#5c4632" opacity="0.3"/>
  <rect x="0" y="560" width="800" height="2" fill="#5c4632" opacity="0.25"/>
  <!-- warm light pool on oak from lamps -->
  <ellipse cx="255" cy="440" rx="230" ry="40" fill="url(#poolLight)" opacity="0.7"/>
  <ellipse cx="560" cy="438" rx="140" ry="28" fill="url(#poolLight)" opacity="0.6"/>

  <!-- ===== RICE-PAPER GLOBE PENDANT ===== -->
  <!-- cord -->
  <rect x="247" y="0" width="4" height="120" fill="#3d3a36"/>
  <rect x="247" y="0" width="2" height="120" fill="#c9c5be" opacity="0.4"/>
  <!-- top cap -->
  <ellipse cx="249" cy="122" rx="18" ry="7" fill="#15130f"/>
  <ellipse cx="249" cy="120" rx="18" ry="7" fill="#3d3a36"/>
  <!-- halo behind globe -->
  <ellipse cx="249" cy="205" rx="150" ry="150" fill="url(#riceHalo)"/>
  <!-- globe body -->
  <circle cx="249" cy="205" r="92" fill="url(#riceGlow)"/>
  <!-- paper ribs -->
  <ellipse cx="249" cy="205" rx="30" ry="92" fill="none" stroke="#cbb287" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="249" cy="205" rx="62" ry="92" fill="none" stroke="#cbb287" stroke-width="1.5" opacity="0.4"/>
  <line x1="157" y1="205" x2="341" y2="205" stroke="#cbb287" stroke-width="1.5" opacity="0.35"/>
  <line x1="163" y1="160" x2="335" y2="160" stroke="#cbb287" stroke-width="1.2" opacity="0.3"/>
  <line x1="163" y1="250" x2="335" y2="250" stroke="#cbb287" stroke-width="1.2" opacity="0.3"/>
  <!-- soft highlight -->
  <ellipse cx="222" cy="175" rx="34" ry="42" fill="#ffffff" opacity="0.35"/>
  <!-- bottom cap -->
  <ellipse cx="249" cy="296" rx="16" ry="6" fill="#a5876a"/>
  <ellipse cx="249" cy="294" rx="16" ry="6" fill="#cbb287"/>

  <!-- ===== BLACK DOME PENDANT ===== -->
  <!-- rod -->
  <rect x="561" y="0" width="6" height="96" fill="url(#chromeRod)"/>
  <!-- ceiling mount -->
  <ellipse cx="564" cy="6" rx="14" ry="5" fill="#3d3a36"/>
  <!-- halo behind dome light -->
  <ellipse cx="564" cy="150" rx="95" ry="90" fill="url(#domeHalo)"/>
  <!-- dome outer shell -->
  <path d="M 484 152 A 80 74 0 0 1 644 152 Z" fill="url(#domeBody)"/>
  <!-- dome subtle rim highlight -->
  <path d="M 484 152 A 80 74 0 0 1 644 152" fill="none" stroke="#c9c5be" stroke-width="1.5" opacity="0.3"/>
  <!-- dome side sheen -->
  <path d="M 500 145 A 66 60 0 0 1 545 92" fill="none" stroke="#3d3a36" stroke-width="6" opacity="0.6" stroke-linecap="round"/>
  <!-- inner glowing disc -->
  <ellipse cx="564" cy="152" rx="76" ry="12" fill="#15130f"/>
  <ellipse cx="564" cy="150" rx="70" ry="10" fill="url(#domeInner)"/>
  <ellipse cx="564" cy="149" rx="46" ry="6" fill="#cf9f5c" opacity="0.7"/>
  <ellipse cx="564" cy="148" rx="20" ry="3.5" fill="#faf7f2" opacity="0.6"/>

  <!-- ===== OAK SURFACE OBJECTS ===== -->
  <!-- shadows -->
  <ellipse cx="200" cy="452" rx="70" ry="14" fill="rgba(31,27,22,0.12)"/>
  <ellipse cx="360" cy="454" rx="48" ry="11" fill="rgba(31,27,22,0.12)"/>
  <ellipse cx="600" cy="450" rx="55" ry="12" fill="rgba(31,27,22,0.12)"/>

  <!-- stack of books (left) -->
  <rect x="150" y="420" width="120" height="14" rx="3" fill="#7a7c5c"/>
  <rect x="150" y="420" width="120" height="4" rx="2" fill="#8a8c62"/>
  <rect x="158" y="408" width="112" height="13" rx="3" fill="#6d5138"/>
  <rect x="158" y="408" width="112" height="4" rx="2" fill="#a5876a"/>
  <rect x="164" y="397" width="100" height="12" rx="3" fill="#8a5a20"/>
  <rect x="164" y="397" width="100" height="4" rx="2" fill="#b98a4a"/>
  <!-- page edges -->
  <rect x="152" y="425" width="116" height="5" fill="#faf7f2" opacity="0.5"/>

  <!-- glass vase with stems (center) -->
  <ellipse cx="360" cy="452" rx="26" ry="7" fill="#a5876a" opacity="0.5"/>
  <path d="M 340 452 Q 336 410 348 402 L 372 402 Q 384 410 380 452 Z" fill="url(#glassVase)"/>
  <path d="M 344 448 Q 342 415 350 408" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <ellipse cx="360" cy="404" rx="16" ry="4" fill="#b8cdd6" opacity="0.6"/>
  <!-- stems -->
  <path d="M 356 404 Q 348 360 336 340" fill="none" stroke="#7a7c5c" stroke-width="3"/>
  <path d="M 362 404 Q 366 358 372 336" fill="none" stroke="#8a8c62" stroke-width="3"/>
  <path d="M 360 404 Q 360 366 358 344" fill="none" stroke="#7a7c5c" stroke-width="3"/>
  <!-- leaves -->
  <ellipse cx="334" cy="338" rx="10" ry="5" fill="#8a8c62" transform="rotate(-35 334 338)"/>
  <ellipse cx="374" cy="334" rx="10" ry="5" fill="#7a7c5c" transform="rotate(30 374 334)"/>
  <ellipse cx="357" cy="342" rx="8" ry="4" fill="#8a8c62" transform="rotate(-8 357 342)"/>

  <!-- chrome tray with amber tumbler (right) -->
  <ellipse cx="600" cy="450" rx="50" ry="11" fill="#c9c5be"/>
  <ellipse cx="600" cy="447" rx="50" ry="10" fill="#e3e1dc"/>
  <ellipse cx="600" cy="446" rx="42" ry="7" fill="#c9c5be" opacity="0.7"/>
  <!-- tumbler -->
  <path d="M 585 444 L 588 404 Q 600 400 612 404 L 615 444 Z" fill="url(#glassVase)"/>
  <path d="M 585 444 L 588 404 Q 600 400 612 404 L 615 444 Z" fill="#cf9f5c" opacity="0.28"/>
  <!-- amber liquid -->
  <path d="M 587 442 L 589 422 Q 600 419 611 422 L 613 442 Z" fill="#b98a4a" opacity="0.75"/>
  <ellipse cx="600" cy="422" rx="11" ry="3" fill="#cf9f5c"/>
  <path d="M 589 438 L 590 410" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>

  <!-- small dark bowl (foreground left of center) -->
  <ellipse cx="460" cy="448" rx="34" ry="9" fill="#2a2724"/>
  <ellipse cx="460" cy="445" rx="34" ry="8" fill="#3d3a36"/>
  <ellipse cx="460" cy="444" rx="26" ry="5" fill="#15130f"/>
  <ellipse cx="452" cy="442" rx="8" ry="2" fill="#cf9f5c" opacity="0.4"/>

  <!-- faint reflections of light on oak -->
  <ellipse cx="249" cy="428" rx="60" ry="7" fill="#e2cfa0" opacity="0.28"/>
  <ellipse cx="564" cy="426" rx="44" ry="6" fill="#cf9f5c" opacity="0.22"/>
</svg>