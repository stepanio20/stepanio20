      <rect x="684" y="244" width="40" height="50" rx="1" fill="#e8dcc6"/>
      <rect x="684" y="244" width="40" height="50" rx="1" fill="url(#velvet)" opacity="0.25"/>
      <ellipse cx="704" cy="270" rx="12" ry="16" fill="#8a8c62"/>
    </g>
    <g>
      <rect x="722" y="252" width="46" height="48" rx="3" fill="#2a2724"/>
      <rect x="727" y="257" width="36" height="38" rx="1" fill="#faf7f2"/>
      <rect x="734" y="264" width="22" height="24" rx="1" fill="#cf9f5c" opacity="0.7"/>
    </g>
