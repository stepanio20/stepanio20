  <!-- ============ WHITE BOUCLE SOFA (foreground, cropped macro) ============ -->
  <g>
    <ellipse cx="270" cy="560" rx="240" ry="30" fill="rgba(31,27,22,0.12)"/>
    <!-- back cushions -->
    <rect x="40" y="430" width="440" height="96" rx="30" fill="url(#boucle)"/>
    <!-- seat -->
    <rect x="30" y="500" width="470" height="90" rx="26" fill="url(#boucle)"/>
    <rect x="30" y="500" width="470" height="30" rx="20" fill="#ffffff" opacity="0.5"/>
    <!-- arm -->
    <rect x="20" y="460" width="80" height="130" rx="34" fill="url(#boucle)"/>
    <rect x="20" y="460" width="80" height="40" rx="30" fill="#ffffff" opacity="0.4"/>
    <!-- cushion seams -->
    <path d="M250 500 q0 44 0 88" stroke="#e4dccd" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M370 500 q0 44 0 88" stroke="#e4dccd" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M250 434 q0 44 0 88" stroke="#e4dccd" stroke-width="2.5" fill="none" opacity="0.6"/>
    <!-- boucle nub texture -->
    <g fill="#eae2d4" opacity="0.55">
      <circle cx="120" cy="470" r="3"/><circle cx="150" cy="482" r="2.6"/><circle cx="180" cy="466" r="3.2"/>
      <circle cx="210" cy="480" r="2.8"/><circle cx="300" cy="470" r="3"/><circle cx="340" cy="484" r="2.7"/>
      <circle cx="400" cy="468" r="3.1"/><circle cx="430" cy="482" r="2.6"/><circle cx="90" cy="500" r="3"/>
      <circle cx="130" cy="540" r="2.8"/><circle cx="200" cy="548" r="3"/><circle cx="290" cy="536" r="2.7"/>
      <circle cx="360" cy="548" r="3"/><circle cx="440" cy="536" r="2.8"/><circle cx="60" cy="520" r="2.8"/>
    </g>
    <g fill="#ffffff" opacity="0.6">
      <circle cx="128" cy="474" r="1.4"/><circle cx="186" cy="470" r="1.4"/><circle cx="306" cy="474" r="1.4"/>
      <circle cx="406" cy="472" r="1.4"/><circle cx="205" cy="544" r="1.4"/><circle cx="365" cy="544" r="1.4"/>
    </g>
    <!-- olive velvet throw pillow -->
    <g>
      <rect x="330" y="452" width="96" height="80" rx="16" fill="url(#velvet)"/>
      <rect x="330" y="452" width="96" height="26" rx="14" fill="#8a8c62" opacity="0.6"/>
      <path d="M348 460 q30 -6 60 0" stroke="#63654a" stroke-width="2" fill="none" opacity="0.5"/>
      <path d="M340 500 q40 8 80 0" stroke="#63654a" stroke-width="2" fill="none" opacity="0.5"/>
    </g>
  </g>

  <!-- warm raking light beam over the scene -->
  <path d="M0 40 L280 40 L120 600 L0 600 Z" fill="#fff4de" opacity="0.06"/>
  <ellipse cx="180" cy="200" rx="220" ry="160" fill="#fff2d0" opacity="0.05"/>
</svg>
