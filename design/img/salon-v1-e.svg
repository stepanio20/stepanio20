    <rect x="574" y="440" width="46" height="104" rx="20" fill="url(#boucle)"/>
    <!-- bouclé texture dots -->
    <g fill="#efe6d5" opacity="0.7">
      <circle cx="250" cy="446" r="4"/><circle cx="280" cy="458" r="4"/><circle cx="320" cy="444" r="4"/>
      <circle cx="352" cy="460" r="4"/><circle cx="300" cy="470" r="4"/><circle cx="452" cy="446" r="4"/>
      <circle cx="486" cy="458" r="4"/><circle cx="520" cy="446" r="4"/><circle cx="550" cy="462" r="4"/>
      <circle cx="500" cy="472" r="4"/><circle cx="230" cy="470" r="4"/><circle cx="565" cy="470" r="4"/>
