    <rect x="330" y="540" width="10" height="18" rx="3" fill="#a5876a"/>
    <rect x="460" y="540" width="10" height="18" rx="3" fill="#a5876a"/>
    <rect x="578" y="540" width="10" height="18" rx="3" fill="#a5876a"/>
