<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f7f3ec"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="oakStrip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbb287"/>
      <stop offset="0.5" stop-color="#c8a87c"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3a36"/>
      <stop offset="1" stop-color="#15130f"/>
    </linearGradient>
    <linearGradient id="baseTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2724"/>
      <stop offset="0.5" stop-color="#3d3a36"/>
      <stop offset="1" stop-color="#2a2724"/>
    </linearGradient>
    <linearGradient id="glassFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#b8cdd6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e3e1dc" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="glassSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8cdd6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e3e1dc" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="glassTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#b8cdd6" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="chromeFrame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9c5be"/>
      <stop offset="0.5" stop-color="#e3e1dc"/>
      <stop offset="1" stop-color="#c9c5be"/>
    </linearGradient>
    <linearGradient id="chromeVert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e1dc"/>
      <stop offset="0.5" stop-color="#c9c5be"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="helmetGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cf9f5c"/>
      <stop offset="0.55" stop-color="#b98a4a"/>
      <stop offset="1" stop-color="#8a5a20"/>
    </linearGradient>
    <linearGradient id="helmetOlive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8c62"/>
      <stop offset="1" stop-color="#7a7c5c"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#faf7f2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#faf7f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="innerGlow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#cf9f5c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#cf9f5c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Wall -->
  <rect x="0" y="0" width="800" height="600" fill="url(#wall)"/>
  <!-- Warm spotlight on wall -->
  <ellipse cx="400" cy="180" rx="360" ry="230" fill="url(#spot)"/>

  <!-- Floor -->
  <rect x="0" y="452" width="800" height="148" fill="url(#floor)"/>
  <!-- Oak floor plank seams -->
  <rect x="0" y="452" width="800" height="4" fill="#a5876a" opacity="0.5"/>
  <rect x="0" y="500" width="800" height="3" fill="#a5876a" opacity="0.35"/>
  <rect x="0" y="548" width="800" height="3" fill="#a5876a" opacity="0.35"/>
  <line x1="150" y1="452" x2="140" y2="600" stroke="#a5876a" stroke-width="2" opacity="0.3"/>
  <line x1="420" y1="452" x2="430" y2="600" stroke="#a5876a" stroke-width="2" opacity="0.3"/>
  <line x1="640" y1="452" x2="655" y2="600" stroke="#a5876a" stroke-width="2" opacity="0.3"/>

  <!-- Baseboard -->
  <rect x="0" y="440" width="800" height="14" fill="#faf7f2"/>
  <rect x="0" y="440" width="800" height="3" fill="#ffffff" opacity="0.7"/>

  <!-- Contact shadow under base -->
  <ellipse cx="400" cy="500" rx="215" ry="30" fill="#1f1b16" opacity="0.12"/>

  <!-- ===== Dark base plinth ===== -->
  <!-- base body -->
  <polygon points="255,470 545,470 560,506 240,506" fill="url(#baseGrad)"/>
  <rect x="255" y="428" width="290" height="42" rx="8" fill="url(#baseTop)"/>
  <!-- base top highlight -->
  <rect x="255" y="428" width="290" height="6" rx="3" fill="#3d3a36" opacity="0.9"/>
  <rect x="263" y="431" width="274" height="2" fill="#c9c5be" opacity="0.25"/>
  <!-- base recessed panel -->
  <rect x="285" y="446" width="230" height="18" rx="4" fill="#15130f" opacity="0.55"/>
  <!-- chrome accent line on base -->
  <rect x="255" y="425" width="290" height="4" rx="2" fill="url(#chromeFrame)"/>

  <!-- ===== Glass tower ===== -->
  <!-- tower dimensions: sits on base top ~y428, rises to ~y120 -->

  <!-- Side face (right, perspective) -->
  <polygon points="520,140 560,158 560,430 520,428" fill="url(#glassSide)"/>
  <!-- Front face -->
  <rect x="280" y="140" width="240" height="288" rx="6" fill="url(#glassFront)"/>
  <!-- Inner warm glow -->
  <rect x="292" y="152" width="216" height="264" rx="6" fill="url(#innerGlow)"/>

  <!-- ===== Helmet silhouette inside (gold + olive) ===== -->
  <g>
    <!-- pedestal disc inside -->
    <ellipse cx="400" cy="392" rx="70" ry="16" fill="#2a2724" opacity="0.5"/>
    <ellipse cx="400" cy="388" rx="60" ry="12" fill="#3d3a36"/>
    <!-- neck/support -->
    <rect x="388" y="352" width="24" height="40" rx="6" fill="#6d5138"/>

    <!-- helmet dome (gold) -->
    <path d="M330 300 Q330 214 400 214 Q470 214 470 300 Q470 320 456 330 L344 330 Q330 320 330 300 Z" fill="url(#helmetGold)"/>
    <!-- dome tone step / shadow side -->
    <path d="M400 214 Q470 214 470 300 Q470 320 456 330 L400 330 Z" fill="#8a5a20" opacity="0.32"/>
    <!-- dome highlight -->
    <path d="M352 244 Q368 224 396 222 Q372 232 360 258 Q354 252 352 244 Z" fill="#cf9f5c" opacity="0.85"/>

    <!-- crest / ridge (olive) -->
    <path d="M394 210 Q400 176 406 210 Q414 260 410 306 L390 306 Q386 260 394 210 Z" fill="url(#helmetOlive)"/>
    <path d="M400 210 Q406 176 406 210 Q414 260 410 306 L400 306 Z" fill="#7a7c5c" opacity="0.5"/>

    <!-- face guard / lower helmet (gold, darker step) -->
    <path d="M344 330 L456 330 L448 360 Q424 372 400 372 Q376 372 352 360 Z" fill="#b98a4a"/>
    <path d="M400 330 L456 330 L448 360 Q424 372 400 372 Z" fill="#8a5a20" opacity="0.4"/>
    <!-- eye slot -->
    <rect x="366" y="336" width="68" height="8" rx="4" fill="#15130f" opacity="0.7"/>
    <!-- nose guard -->
    <rect x="394" y="336" width="12" height="30" rx="4" fill="#8a5a20"/>

    <!-- rim highlight on dome -->
    <path d="M330 300 Q330 214 400 214" fill="none" stroke="#cf9f5c" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  </g>

  <!-- Glass reflection streaks (over helmet) -->
  <polygon points="300,150 340,150 300,418 280,418" fill="#ffffff" opacity="0.16"/>
  <polygon points="360,150 375,150 355,418 340,418" fill="#ffffff" opacity="0.1"/>
  <polygon points="490,150 505,150 500,418 485,418" fill="#b8cdd6" opacity="0.14"/>

  <!-- ===== Chrome frame edges ===== -->
  <!-- vertical posts -->
  <rect x="276" y="136" width="8" height="296" rx="3" fill="url(#chromeVert)"/>
  <rect x="516" y="136" width="8" height="296" rx="3" fill="url(#chromeVert)"/>
  <!-- back-right post -->
  <rect x="556" y="154" width="6" height="278" rx="3" fill="#a5876a"/>
  <!-- top rail front -->
  <rect x="276" y="132" width="248" height="10" rx="4" fill="url(#chromeFrame)"/>
  <!-- bottom rail front -->
  <rect x="276" y="424" width="248" height="8" rx="3" fill="url(#chromeFrame)"/>
  <!-- top rail side -->
  <polygon points="520,132 560,150 562,158 522,142" fill="#c9c5be"/>

  <!-- ===== Glass top (cap) ===== -->
  <polygon points="284,132 524,132 560,150 320,150" fill="url(#glassTop)"/>
  <polygon points="284,132 524,132 524,140 284,140" fill="#e3e1dc" opacity="0.5"/>
  <!-- top cap chrome edge -->
  <polygon points="284,128 524,128 560,146 320,146" fill="none" stroke="url(#chromeFrame)" stroke-width="3"/>

  <!-- small finial light on top -->
  <ellipse cx="404" cy="120" rx="26" ry="7" fill="#c9c5be" opacity="0.5"/>
  <rect x="392" y="112" width="24" height="10" rx="4" fill="url(#chromeFrame)"/>

  <!-- soft floor reflection of base -->
  <ellipse cx="400" cy="512" rx="150" ry="12" fill="#15130f" opacity="0.1"/>

  <!-- subtle wall trim shadow -->
  <rect x="0" y="600" width="800" height="0" fill="none"/>
</svg>