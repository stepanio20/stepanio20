  <rect x="286" y="476" width="14" height="30" rx="4" fill="url(#chrome)"/>
  <rect x="500" y="476" width="14" height="30" rx="4" fill="url(#chrome)"/>
  <ellipse cx="293" cy="507" rx="10" ry="4" fill="#1f1b16" opacity="0.14"/>
