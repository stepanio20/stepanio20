  <line x1="90" y1="508" x2="90" y2="562" stroke="#a5876a" stroke-width="1.2" opacity="0.3"/>
  <line x1="470" y1="508" x2="470" y2="562" stroke="#a5876a" stroke-width="1.2" opacity="0.3"/>

