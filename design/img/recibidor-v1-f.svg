    <ellipse cx="648" cy="500" rx="66" ry="14" fill="url(#softShadow)"/>
    <rect x="596" y="470" width="104" height="20" rx="4" fill="url(#bookB)"/>
    <rect x="602" y="452" width="94" height="20" rx="4" fill="url(#bookA)"/>
    <rect x="608" y="436" width="82" height="18" rx="4" fill="url(#bookC)"/>
