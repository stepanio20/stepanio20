  <line x1="0" y1="508" x2="800" y2="508" stroke="#a5876a" stroke-width="1.5" opacity="0.4"/>
  <line x1="0" y1="562" x2="800" y2="562" stroke="#a5876a" stroke-width="1.5" opacity="0.4"/>
  <line x1="140" y1="400" x2="140" y2="452" stroke="#a5876a" stroke-width="1.2" opacity="0.3"/>
  <line x1="430" y1="400" x2="430" y2="452" stroke="#a5876a" stroke-width="1.2" opacity="0.3"/>
  <line x1="660" y1="400" x2="660" y2="452" stroke="#a5876a" stroke-width="1.2" opacity="0.3"/>
  <line x1="250" y1="452" x2="250" y2="508" stroke="#a5876a" stroke-width="1.2" opacity="0.3"/>
