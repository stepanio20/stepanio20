    <linearGradient id="oakFrameV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0cba6"/>
      <stop offset="0.5" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#b39871"/>
    </linearGradient>
    <linearGradient id="oakShelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3cfa9"/>
      <stop offset="0.5" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#a5876a"/>
