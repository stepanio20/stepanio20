<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f7f3ec"/>
    </linearGradient>
    <linearGradient id="oakTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="oakFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="frameG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d3a36"/>
      <stop offset="1" stop-color="#2a2724"/>
    </linearGradient>
    <linearGradient id="posterBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f7f3ec"/>
    </linearGradient>
    <linearGradient id="chromeLeg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9c5be"/>
      <stop offset="0.5" stop-color="#e3e1dc"/>
      <stop offset="1" stop-color="#c9c5be"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d5138"/>
      <stop offset="1" stop-color="#5c4632"/>
    </linearGradient>
    <linearGradient id="glassVase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8cdd6"/>
      <stop offset="0.5" stop-color="#e3e1dc"/>
      <stop offset="1" stop-color="#b8cdd6"/>
    </linearGradient>
    <radialGradient id="lightPool" cx="0.4" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- wall -->
  <rect x="0" y="0" width="800" height="470" fill="url(#wall)"/>
  <rect x="0" y="0" width="800" height="470" fill="url(#lightPool)"/>

  <!-- floor -->
  <rect x="0" y="470" width="800" height="130" fill="url(#floor)"/>
  <rect x="0" y="470" width="800" height="4" fill="#a5876a" opacity="0.35"/>
  <line x1="140" y1="474" x2="140" y2="600" stroke="#a5876a" stroke-width="1.5" opacity="0.3"/>
  <line x1="360" y1="474" x2="360" y2="600" stroke="#a5876a" stroke-width="1.5" opacity="0.3"/>
  <line x1="560" y1="474" x2="560" y2="600" stroke="#a5876a" stroke-width="1.5" opacity="0.3"/>
  <line x1="720" y1="474" x2="720" y2="600" stroke="#a5876a" stroke-width="1.5" opacity="0.3"/>

  <!-- ===== POSTER FRAME ===== -->
  <!-- frame shadow on wall -->
  <rect x="250" y="46" width="304" height="264" rx="10" fill="#1f1b16" opacity="0.10"/>
  <!-- outer black frame -->
  <rect x="244" y="40" width="304" height="264" rx="8" fill="url(#frameG)"/>
  <rect x="244" y="40" width="304" height="264" rx="8" fill="none" stroke="#15130f" stroke-width="2"/>
  <!-- inner bevel -->
  <rect x="258" y="54" width="276" height="236" rx="4" fill="#2a2724"/>
  <!-- mat / poster background -->
  <rect x="268" y="64" width="256" height="216" rx="3" fill="url(#posterBg)"/>

  <!-- ===== ABSTRACT F1 CIRCUIT ART ===== -->
  <!-- olive base blocks -->
  <rect x="268" y="64" width="256" height="216" rx="3" fill="#f7f3ec"/>
  <path d="M268 220 L360 64 L268 64 Z" fill="#8a8c62" opacity="0.22"/>
  <path d="M524 90 L524 280 L410 280 Z" fill="#7a7c5c" opacity="0.18"/>
  <circle cx="470" cy="110" r="42" fill="#cf9f5c" opacity="0.20"/>
  <rect x="290" y="150" width="70" height="70" rx="6" fill="#b98a4a" opacity="0.16"/>

  <!-- circuit ribbon: amber wide underlay -->
  <path d="M300 250
           C300 190 340 195 360 175
           C388 148 350 120 380 100
           C405 84 452 92 470 112
           C492 137 460 168 486 188
           C506 203 502 232 480 244
           C452 259 430 232 402 236
           C372 240 380 262 348 262
           C322 262 300 260 300 250 Z"
        fill="none" stroke="#cf9f5c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
  <!-- circuit ribbon: olive mid -->
  <path d="M300 250
           C300 190 340 195 360 175
           C388 148 350 120 380 100
           C405 84 452 92 470 112
           C492 137 460 168 486 188
           C506 203 502 232 480 244
           C452 259 430 232 402 236
           C372 240 380 262 348 262
           C322 262 300 260 300 250 Z"
        fill="none" stroke="#7a7c5c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- circuit ribbon: graphite thin racing line -->
  <path d="M300 250
           C300 190 340 195 360 175
           C388 148 350 120 380 100
           C405 84 452 92 470 112
           C492 137 460 168 486 188
           C506 203 502 232 480 244
           C452 259 430 232 402 236
           C372 240 380 262 348 262
           C322 262 300 260 300 250 Z"
        fill="none" stroke="#3d3a36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 7"/>

  <!-- start/finish marker -->
  <g>
    <rect x="292" y="238" width="18" height="18" rx="2" fill="#2a2724"/>
    <rect x="292" y="238" width="9" height="9" fill="#f7f3ec"/>
    <rect x="301" y="247" width="9" height="9" fill="#f7f3ec"/>
  </g>
  <!-- corner dots -->
  <circle cx="380" cy="100" r="5" fill="#8a5a20"/>
  <circle cx="486" cy="188" r="5" fill="#8a5a20"/>
  <circle cx="470" cy="112" r="4" fill="#b98a4a"/>
  <circle cx="348" cy="262" r="4" fill="#b98a4a"/>

  <!-- accent ochre bars (like sector markers) -->
  <rect x="300" y="90" width="30" height="5" rx="2" fill="#b98a4a"/>
  <rect x="300" y="100" width="20" height="5" rx="2" fill="#cf9f5c"/>
  <rect x="440" y="255" width="34" height="5" rx="2" fill="#8a8c62"/>
  <rect x="440" y="265" width="22" height="5" rx="2" fill="#7a7c5c"/>

  <!-- frame inner highlight -->
  <rect x="268" y="64" width="256" height="216" rx="3" fill="none" stroke="#15130f" stroke-width="1" opacity="0.5"/>

  <!-- ===== CONSOLE ===== -->
  <!-- floor shadow under console -->
  <ellipse cx="400" cy="556" rx="230" ry="20" fill="#1f1b16" opacity="0.12"/>

  <!-- chrome legs -->
  <rect x="252" y="405" width="7" height="140" rx="3" fill="url(#chromeLeg)"/>
  <rect x="541" y="405" width="7" height="140" rx="3" fill="url(#chromeLeg)"/>
  <rect x="252" y="405" width="2.5" height="140" fill="#ffffff" opacity="0.6"/>
  <rect x="541" y="405" width="2.5" height="140" fill="#ffffff" opacity="0.6"/>
  <!-- foot caps -->
  <rect x="249" y="543" width="13" height="6" rx="2" fill="#a5876a"/>
  <rect x="538" y="543" width="13" height="6" rx="2" fill="#a5876a"/>

  <!-- console front apron -->
  <rect x="240" y="418" width="320" height="26" rx="6" fill="url(#oakFront)"/>
  <rect x="240" y="418" width="320" height="4" rx="2" fill="#d8c19a" opacity="0.7"/>
  <!-- slim drawer line + pull -->
  <line x1="256" y1="431" x2="544" y2="431" stroke="#a5876a" stroke-width="1" opacity="0.5"/>
  <rect x="378" y="428" width="44" height="6" rx="3" fill="#c9c5be"/>
  <rect x="378" y="428" width="44" height="2.5" rx="1" fill="#e3e1dc"/>

  <!-- console top surface -->
  <rect x="234" y="402" width="332" height="20" rx="7" fill="url(#oakTop)"/>
  <rect x="234" y="402" width="332" height="6" rx="4" fill="#faf7f2" opacity="0.35"/>
  <rect x="234" y="416" width="332" height="6" rx="3" fill="#a5876a" opacity="0.4"/>

  <!-- ===== LEATHER TRAY ===== -->
  <ellipse cx="320" cy="405" rx="66" ry="12" fill="#1f1b16" opacity="0.12"/>
  <!-- tray body -->
  <rect x="256" y="378" width="128" height="26" rx="9" fill="url(#leather)"/>
  <rect x="256" y="378" width="128" height="26" rx="9" fill="none" stroke="#5c4632" stroke-width="2"/>
  <!-- tray inner well -->
  <rect x="266" y="382" width="108" height="14" rx="6" fill="#5c4632"/>
  <rect x="266" y="382" width="108" height="5" rx="3" fill="#6d5138" opacity="0.8"/>
  <!-- stitching -->
  <rect x="262" y="382" width="116" height="18" rx="7" fill="none" stroke="#a5876a" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
  <!-- keys on tray -->
  <rect x="284" y="384" width="8" height="12" rx="2" fill="#c9c5be"/>
  <circle cx="288" cy="384" r="4" fill="#c9c5be"/>
  <circle cx="288" cy="384" r="1.6" fill="#5c4632"/>
  <rect x="298" y="388" width="26" height="5" rx="2.5" fill="#8a8c62"/>
  <rect x="298" y="388" width="26" height="2" rx="1" fill="#8a8c62" opacity="0.6"/>

  <!-- ===== GLASS VASE with olive stems ===== -->
  <ellipse cx="472" cy="404" rx="30" ry="8" fill="#1f1b16" opacity="0.10"/>
  <!-- stems -->
  <path d="M472 390 C468 350 458 330 448 316" fill="none" stroke="#7a7c5c" stroke-width="3" stroke-linecap="round"/>
  <path d="M472 390 C474 348 484 332 496 322" fill="none" stroke="#8a8c62" stroke-width="3" stroke-linecap="round"/>
  <path d="M472 388 C472 356 472 340 472 320" fill="none" stroke="#7a7c5c" stroke-width="3" stroke-linecap="round"/>
  <!-- leaves -->
  <ellipse cx="446" cy="314" rx="10" ry="5" fill="#8a8c62" transform="rotate(-35 446 314)"/>
  <ellipse cx="498" cy="320" rx="10" ry="5" fill="#7a7c5c" transform="rotate(30 498 320)"/>
  <ellipse cx="472" cy="316" rx="9" ry="5" fill="#8a8c62" transform="rotate(-5 472 316)"/>
  <ellipse cx="460" cy="332" rx="8" ry="4" fill="#7a7c5c" transform="rotate(-25 460 332)"/>
  <ellipse cx="486" cy="336" rx="8" ry="4" fill="#8a8c62" transform="rotate(20 486 336)"/>
  <!-- vase glass -->
  <path d="M456 388 C452 398 456 400 472 400 C488 400 492 398 488 388 L484 360 C484 356 460 356 460 360 Z" fill="url(#glassVase)" opacity="0.75"/>
  <path d="M456 388 C452 398 456 400 472 400 C488 400 492 398 488 388 L484 360 C484 356 460 356 460 360 Z" fill="none" stroke="#b8cdd6" stroke-width="1"/>
  <rect x="463" y="364" width="4" height="30" rx="2" fill="#ffffff" opacity="0.6"/>

  <!-- small ochre catch-dish -->
  <ellipse cx="516" cy="404" rx="22" ry="6" fill="#1f1b16" opacity="0.10"/>
  <path d="M498 398 C498 392 534 392 534 398 C534 404 498 404 498 398 Z" fill="#cf9f5c"/>
  <path d="M498 398 C498 392 534 392 534 398 L530 398 C530 394 502 394 502 398 Z" fill="#b98a4a"/>
  <ellipse cx="516" cy="396" rx="15" ry="3.5" fill="#8a5a20" opacity="0.5"/>

  <!-- wall baseboard -->
  <rect x="0" y="462" width="800" height="10" fill="#e3e1dc" opacity="0.5"/>
  <rect x="0" y="462" width="800" height="2" fill="#ffffff" opacity="0.6"/>
</svg>
