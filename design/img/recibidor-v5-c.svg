<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f7f3ec"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="oakV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="0.5" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="oakLeg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="mirrorGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e1dc"/>
      <stop offset="0.45" stop-color="#c9c5be"/>
      <stop offset="0.55" stop-color="#b8cdd6"/>
      <stop offset="1" stop-color="#c9c5be"/>
    </linearGradient>
    <linearGradient id="frameOak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="0.5" stop-color="#c8a87c"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="ropeSeat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="chromeG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3e1dc"/>
      <stop offset="0.5" stop-color="#c9c5be"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="vaseG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cf9f5c"/>
      <stop offset="0.5" stop-color="#b98a4a"/>
      <stop offset="1" stop-color="#8a5a20"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="800" height="600" fill="url(#wall)"/>
  <rect x="0" y="452" width="800" height="148" fill="url(#floor)"/>
  <rect x="0" y="452" width="800" height="6" fill="#a5876a" opacity="0.5"/>
  <!-- floor plank hints -->
  <rect x="0" y="480" width="800" height="2" fill="#a5876a" opacity="0.25"/>
  <rect x="0" y="520" width="800" height="2" fill="#a5876a" opacity="0.25"/>
  <rect x="0" y="562" width="800" height="2" fill="#a5876a" opacity="0.25"/>

  <!-- warm light glow on wall -->
  <ellipse cx="300" cy="200" rx="260" ry="200" fill="#ffffff" opacity="0.35"/>

  <!-- ===== FULL-HEIGHT OAK MIRROR (right) ===== -->
  <ellipse cx="612" cy="470" rx="120" ry="18" fill="rgba(31,27,22,0.12)"/>
  <!-- outer oak frame -->
  <rect x="520" y="70" width="188" height="392" rx="12" fill="url(#frameOak)"/>
  <rect x="520" y="70" width="188" height="392" rx="12" fill="none" stroke="#a5876a" stroke-width="2" opacity="0.6"/>
  <!-- inner frame bevel -->
  <rect x="540" y="90" width="148" height="352" rx="8" fill="#a5876a"/>
  <rect x="546" y="96" width="136" height="340" rx="6" fill="url(#mirrorGlass)"/>
  <!-- glass reflection streaks -->
  <polygon points="560,110 600,110 570,426 546,426 546,300" fill="#ffffff" opacity="0.28"/>
  <polygon points="620,110 640,110 610,426 592,426" fill="#ffffff" opacity="0.18"/>
  <rect x="546" y="96" width="136" height="340" rx="6" fill="none" stroke="#e3e1dc" stroke-width="2" opacity="0.5"/>
  <!-- faint reflected bench in mirror -->
  <rect x="556" y="360" width="96" height="14" rx="4" fill="#cbb287" opacity="0.35"/>
  <rect x="562" y="374" width="8" height="52" fill="#a5876a" opacity="0.3"/>
  <rect x="640" y="374" width="8" height="52" fill="#a5876a" opacity="0.3"/>
  <!-- frame grain lines -->
  <rect x="528" y="80" width="2" height="372" fill="#a5876a" opacity="0.4"/>
  <rect x="700" y="80" width="2" height="372" fill="#8a5a20" opacity="0.3"/>

  <!-- ===== OAK BENCH with ROPE SEAT (left) ===== -->
  <ellipse cx="245" cy="470" rx="180" ry="20" fill="rgba(31,27,22,0.12)"/>

  <!-- back legs -->
  <rect x="120" y="352" width="16" height="112" rx="5" fill="url(#oakLeg)"/>
  <rect x="352" y="352" width="16" height="112" rx="5" fill="url(#oakLeg)"/>
  <!-- front legs -->
  <rect x="132" y="360" width="18" height="108" rx="5" fill="url(#oakV)"/>
  <rect x="360" y="360" width="18" height="108" rx="5" fill="url(#oakV)"/>
  <!-- leg shading -->
  <rect x="144" y="360" width="6" height="108" rx="3" fill="#a5876a" opacity="0.6"/>
  <rect x="372" y="360" width="6" height="108" rx="3" fill="#a5876a" opacity="0.6"/>

  <!-- lower stretcher rail -->
  <rect x="140" y="420" width="230" height="12" rx="5" fill="url(#oakLeg)"/>
  <rect x="140" y="428" width="230" height="4" rx="2" fill="#a5876a" opacity="0.5"/>

  <!-- bench seat frame (oak) -->
  <rect x="112" y="332" width="286" height="34" rx="10" fill="url(#oakV)"/>
  <rect x="112" y="352" width="286" height="14" rx="7" fill="#a5876a" opacity="0.55"/>
  <rect x="112" y="332" width="286" height="8" rx="4" fill="#d8c19a" opacity="0.7"/>

  <!-- rope seat inset -->
  <rect x="128" y="336" width="254" height="22" rx="6" fill="#6d5138"/>
  <!-- woven rope strands -->
  <rect x="132" y="338" width="246" height="6" rx="3" fill="url(#ropeSeat)"/>
  <rect x="132" y="345" width="246" height="6" rx="3" fill="#c8a87c"/>
  <rect x="132" y="352" width="246" height="5" rx="2" fill="url(#ropeSeat)"/>
  <!-- vertical rope weave ticks -->
  <rect x="150" y="337" width="4" height="20" fill="#a5876a" opacity="0.55"/>
  <rect x="182" y="337" width="4" height="20" fill="#a5876a" opacity="0.55"/>
  <rect x="214" y="337" width="4" height="20" fill="#a5876a" opacity="0.55"/>
  <rect x="246" y="337" width="4" height="20" fill="#a5876a" opacity="0.55"/>
  <rect x="278" y="337" width="4" height="20" fill="#a5876a" opacity="0.55"/>
  <rect x="310" y="337" width="4" height="20" fill="#a5876a" opacity="0.55"/>
  <rect x="342" y="337" width="4" height="20" fill="#a5876a" opacity="0.55"/>
  <rect x="166" y="337" width="3" height="20" fill="#faf7f2" opacity="0.4"/>
  <rect x="230" y="337" width="3" height="20" fill="#faf7f2" opacity="0.4"/>
  <rect x="294" y="337" width="3" height="20" fill="#faf7f2" opacity="0.4"/>

  <!-- folded throw on bench end -->
  <rect x="300" y="316" width="86" height="30" rx="8" fill="#8a8c62"/>
  <rect x="300" y="316" width="86" height="12" rx="6" fill="#7a7c5c"/>
  <rect x="300" y="338" width="86" height="8" rx="4" fill="#5c4632" opacity="0.4"/>
  <rect x="308" y="322" width="70" height="3" fill="#faf7f2" opacity="0.4"/>

  <!-- ===== small styling props ===== -->
  <!-- amber vase with stems on floor between pieces -->
  <ellipse cx="452" cy="466" rx="34" ry="9" fill="rgba(31,27,22,0.12)"/>
  <path d="M436 400 Q432 440 444 460 L460 460 Q472 440 468 400 Z" fill="url(#vaseG)"/>
  <path d="M436 400 Q440 396 452 396 Q464 396 468 400 Z" fill="#cf9f5c"/>
  <rect x="440" y="404" width="4" height="52" rx="2" fill="#8a5a20" opacity="0.5"/>
  <!-- olive stems -->
  <path d="M452 400 Q446 350 438 320" fill="none" stroke="#7a7c5c" stroke-width="4" stroke-linecap="round"/>
  <path d="M452 400 Q458 356 470 330" fill="none" stroke="#8a8c62" stroke-width="4" stroke-linecap="round"/>
  <path d="M452 400 Q452 360 452 336" fill="none" stroke="#7a7c5c" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="436" cy="322" rx="9" ry="5" fill="#8a8c62" transform="rotate(-30 436 322)"/>
  <ellipse cx="472" cy="332" rx="9" ry="5" fill="#7a7c5c" transform="rotate(30 472 332)"/>
  <ellipse cx="452" cy="336" rx="9" ry="5" fill="#8a8c62"/>
  <ellipse cx="448" cy="356" rx="8" ry="4" fill="#7a7c5c" transform="rotate(-15 448 356)"/>
  <ellipse cx="460" cy="360" rx="8" ry="4" fill="#8a8c62" transform="rotate(20 460 360)"/>

  <!-- chrome coat hook rail on wall (left of mirror) -->
  <rect x="150" y="150" width="200" height="14" rx="6" fill="url(#chromeG)"/>
  <rect x="150" y="150" width="200" height="5" rx="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="185" cy="157" r="4" fill="#3d3a36"/>
  <circle cx="315" cy="157" r="4" fill="#3d3a36"/>
  <!-- hooks -->
  <path d="M210 164 Q210 190 226 190" fill="none" stroke="url(#chromeG)" stroke-width="7" stroke-linecap="round"/>
  <path d="M258 164 Q258 190 274 190" fill="none" stroke="url(#chromeG)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="226" cy="190" r="4.5" fill="#e3e1dc"/>
  <circle cx="274" cy="190" r="4.5" fill="#e3e1dc"/>

  <!-- hanging tote/bag on hook -->
  <path d="M244 190 Q236 250 244 300 L300 300 Q308 250 300 190 Z" fill="#7a7c5c"/>
  <path d="M244 190 Q252 188 272 188 Q292 188 300 190 L296 210 L248 210 Z" fill="#8a8c62"/>
  <path d="M252 192 Q262 150 272 192" fill="none" stroke="#5c4632" stroke-width="5"/>
  <rect x="256" y="240" width="32" height="3" fill="#faf7f2" opacity="0.4"/>

  <!-- baseboard -->
  <rect x="0" y="446" width="800" height="10" fill="#e3e1dc" opacity="0.7"/>
  <rect x="0" y="446" width="800" height="3" fill="#ffffff" opacity="0.6"/>
</svg>