<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f2ece1"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="oakframe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="0.5" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="oakframe2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5876a"/>
      <stop offset="0.5" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#d8c19a"/>
    </linearGradient>
    <linearGradient id="mirror" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe8ea"/>
      <stop offset="0.45" stop-color="#c6d5dc"/>
      <stop offset="0.55" stop-color="#b8cdd6"/>
      <stop offset="1" stop-color="#cdd9dd"/>
    </linearGradient>
    <linearGradient id="mirrorSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <radialGradient id="hook" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="0.6" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#a5876a"/>
    </radialGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="0.5" stop-color="#e3ddd0"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="coatShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="600" fill="url(#wall)"/>
  <rect x="0" y="470" width="800" height="130" fill="url(#floor)"/>
  <rect x="0" y="470" width="800" height="6" fill="#a5876a" opacity="0.5"/>

  <!-- soft warm light glow -->
  <ellipse cx="300" cy="180" rx="260" ry="200" fill="#ffffff" opacity="0.25"/>

  <!-- baseboard -->
  <rect x="0" y="458" width="800" height="16" fill="#e3e1dc"/>
  <rect x="0" y="458" width="800" height="4" fill="#ffffff" opacity="0.6"/>

  <!-- ================= MIRROR ================= -->
  <!-- floor shadow under mirror -->
  <ellipse cx="230" cy="482" rx="150" ry="18" fill="#1f1b16" opacity="0.12"/>

  <!-- outer oak frame -->
  <rect x="120" y="70" width="220" height="400" rx="12" fill="url(#oakframe)"/>
  <rect x="120" y="70" width="220" height="400" rx="12" fill="none" stroke="#a5876a" stroke-width="2" opacity="0.5"/>
  <!-- inner frame bevel -->
  <rect x="138" y="88" width="184" height="364" rx="8" fill="url(#oakframe2)"/>
  <rect x="150" y="100" width="160" height="340" rx="6" fill="#a5876a"/>

  <!-- mirror glass -->
  <rect x="156" y="106" width="148" height="328" rx="5" fill="url(#mirror)"/>
  <rect x="156" y="106" width="148" height="328" rx="5" fill="url(#mirrorSheen)"/>
  <!-- diagonal reflection streaks -->
  <polygon points="156,300 210,106 250,106 156,340" fill="#ffffff" opacity="0.18"/>
  <polygon points="200,434 300,180 304,240 250,434" fill="#ffffff" opacity="0.10"/>
  <!-- faint reflected wall hint -->
  <rect x="156" y="106" width="148" height="120" rx="5" fill="#faf7f2" opacity="0.12"/>

  <!-- frame wood grain lines -->
  <path d="M120 160 Q126 165 120 172" fill="none" stroke="#a5876a" stroke-width="1.5" opacity="0.4"/>
  <path d="M120 300 Q127 306 120 314" fill="none" stroke="#a5876a" stroke-width="1.5" opacity="0.4"/>
  <path d="M330 220 Q324 228 330 236" fill="none" stroke="#8a6a4a" stroke-width="1.5" opacity="0.35"/>
  <path d="M330 360 Q324 368 330 376" fill="none" stroke="#8a6a4a" stroke-width="1.5" opacity="0.35"/>

  <!-- frame highlight edge -->
  <rect x="124" y="74" width="6" height="392" rx="3" fill="#faf7f2" opacity="0.5"/>
  <rect x="124" y="74" width="212" height="6" rx="3" fill="#faf7f2" opacity="0.5"/>

  <!-- ================= WALL HOOK RAIL ================= -->
  <!-- mounting board -->
  <rect x="470" y="150" width="260" height="46" rx="8" fill="url(#rail)"/>
  <rect x="470" y="150" width="260" height="10" rx="6" fill="#faf7f2" opacity="0.45"/>
  <rect x="470" y="150" width="260" height="46" rx="8" fill="none" stroke="#a5876a" stroke-width="1.5" opacity="0.5"/>
  <!-- board grain -->
  <line x1="500" y1="176" x2="700" y2="176" stroke="#a5876a" stroke-width="1.5" opacity="0.35"/>
  <line x1="520" y1="184" x2="680" y2="184" stroke="#8a6a4a" stroke-width="1" opacity="0.3"/>

  <!-- round bamboo hooks -->
  <!-- hook 1 -->
  <g>
    <ellipse cx="512" cy="212" rx="16" ry="16" fill="#1f1b16" opacity="0.10"/>
    <circle cx="510" cy="208" r="17" fill="url(#hook)"/>
    <circle cx="510" cy="208" r="17" fill="none" stroke="#a5876a" stroke-width="2"/>
    <circle cx="510" cy="208" r="7" fill="#a5876a"/>
    <circle cx="510" cy="208" r="7" fill="none" stroke="#8a6a4a" stroke-width="1.5"/>
    <circle cx="505" cy="203" r="4" fill="#faf7f2" opacity="0.5"/>
  </g>
  <!-- hook 2 -->
  <g>
    <ellipse cx="574" cy="212" rx="16" ry="16" fill="#1f1b16" opacity="0.10"/>
    <circle cx="572" cy="208" r="17" fill="url(#hook)"/>
    <circle cx="572" cy="208" r="17" fill="none" stroke="#a5876a" stroke-width="2"/>
    <circle cx="572" cy="208" r="7" fill="#a5876a"/>
    <circle cx="572" cy="208" r="7" fill="none" stroke="#8a6a4a" stroke-width="1.5"/>
    <circle cx="567" cy="203" r="4" fill="#faf7f2" opacity="0.5"/>
  </g>
  <!-- hook 3 -->
  <g>
    <ellipse cx="636" cy="212" rx="16" ry="16" fill="#1f1b16" opacity="0.10"/>
    <circle cx="634" cy="208" r="17" fill="url(#hook)"/>
    <circle cx="634" cy="208" r="17" fill="none" stroke="#a5876a" stroke-width="2"/>
    <circle cx="634" cy="208" r="7" fill="#a5876a"/>
    <circle cx="634" cy="208" r="7" fill="none" stroke="#8a6a4a" stroke-width="1.5"/>
    <circle cx="629" cy="203" r="4" fill="#faf7f2" opacity="0.5"/>
  </g>
  <!-- hook 4 -->
  <g>
    <ellipse cx="698" cy="212" rx="16" ry="16" fill="#1f1b16" opacity="0.10"/>
    <circle cx="696" cy="208" r="17" fill="url(#hook)"/>
    <circle cx="696" cy="208" r="17" fill="none" stroke="#a5876a" stroke-width="2"/>
    <circle cx="696" cy="208" r="7" fill="#a5876a"/>
    <circle cx="696" cy="208" r="7" fill="none" stroke="#8a6a4a" stroke-width="1.5"/>
    <circle cx="691" cy="203" r="4" fill="#faf7f2" opacity="0.5"/>
  </g>

  <!-- ================= BEIGE COAT on hook 3 ================= -->
  <g>
    <!-- coat soft shadow on wall -->
    <path d="M640 220 Q690 260 675 420 L735 420 Q752 300 700 224 Z" fill="#1f1b16" opacity="0.06"/>
    <!-- collar loop over hook -->
    <path d="M628 205 Q634 190 642 205" fill="none" stroke="#cbb287" stroke-width="6" stroke-linecap="round"/>
    <!-- coat body -->
    <path d="M634 214
             Q612 226 604 260
             Q598 288 600 300
             L616 300
             Q616 360 620 420
             Q652 432 686 420
             Q690 360 690 300
             L706 300
             Q708 286 700 258
             Q690 226 668 214
             Q651 224 634 214 Z" fill="url(#coat)"/>
    <!-- coat shading right side -->
    <path d="M668 214 Q690 226 700 258 Q708 286 706 300 L690 300 Q690 360 686 420 Q672 425 658 424 Q664 340 660 220 Z" fill="url(#coatShade)" opacity="0.55"/>
    <!-- lapel -->
    <path d="M651 218 Q640 250 636 300 L652 300 Q654 250 662 224 Z" fill="#faf7f2" opacity="0.7"/>
    <path d="M651 218 Q662 250 664 300 L678 300 Q674 250 668 226 Z" fill="#d8c19a" opacity="0.5"/>
    <!-- center seam -->
    <line x1="653" y1="230" x2="653" y2="418" stroke="#a5876a" stroke-width="1.5" opacity="0.4"/>
    <!-- shoulder folds -->
    <path d="M610 258 Q624 268 620 300" fill="none" stroke="#cbb287" stroke-width="2" opacity="0.5"/>
    <path d="M696 258 Q684 268 688 300" fill="none" stroke="#a5876a" stroke-width="2" opacity="0.5"/>
    <!-- hem folds -->
    <path d="M624 400 Q636 410 634 420" fill="none" stroke="#a5876a" stroke-width="1.5" opacity="0.4"/>
    <path d="M672 400 Q664 410 666 420" fill="none" stroke="#a5876a" stroke-width="1.5" opacity="0.4"/>
    <!-- buttons -->
    <circle cx="653" cy="270" r="3.5" fill="#8a5a20"/>
    <circle cx="653" cy="320" r="3.5" fill="#8a5a20"/>
    <circle cx="653" cy="370" r="3.5" fill="#8a5a20"/>
    <!-- coat highlight -->
    <path d="M624 230 Q612 260 610 296" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- small floor grain lines -->
  <line x1="60" y1="510" x2="360" y2="510" stroke="#a5876a" stroke-width="1.5" opacity="0.3"/>
  <line x1="120" y1="545" x2="480" y2="545" stroke="#a5876a" stroke-width="1.5" opacity="0.25"/>
  <line x1="420" y1="520" x2="760" y2="520" stroke="#a5876a" stroke-width="1.5" opacity="0.28"/>

  <!-- floating chrome key dish detail on floor near mirror -->
  <ellipse cx="360" cy="490" rx="46" ry="14" fill="#1f1b16" opacity="0.10"/>
  <ellipse cx="358" cy="486" rx="44" ry="13" fill="#e3e1dc"/>
  <ellipse cx="358" cy="484" rx="44" ry="11" fill="#c9c5be"/>
  <ellipse cx="358" cy="482" rx="34" ry="8" fill="#e3e1dc"/>
  <ellipse cx="350" cy="481" rx="12" ry="3" fill="#ffffff" opacity="0.7"/>
</svg>