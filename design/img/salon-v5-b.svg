<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f7f3ec"/>
    </linearGradient>
    <linearGradient id="oakFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="boucle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f7f3ec"/>
      <stop offset="1" stop-color="#e9e2d6"/>
    </linearGradient>
    <linearGradient id="boucleSeat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#e3dccf"/>
    </linearGradient>
    <linearGradient id="olive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8c62"/>
      <stop offset="1" stop-color="#7a7c5c"/>
    </linearGradient>
    <linearGradient id="oliveHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a9c70"/>
      <stop offset="1" stop-color="#7a7c5c"/>
    </linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3a36"/>
      <stop offset="1" stop-color="#2a2724"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="0.5" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="chromeLeg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9c5be"/>
      <stop offset="0.5" stop-color="#e3e1dc"/>
      <stop offset="1" stop-color="#c9c5be"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf9f5c"/>
      <stop offset="1" stop-color="#b98a4a"/>
    </linearGradient>
    <radialGradient id="warmLight" cx="0.7" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#cf9f5c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#cf9f5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassVase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8cdd6"/>
      <stop offset="1" stop-color="#c9c5be"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="800" height="600" fill="url(#wall)"/>
  <rect x="0" y="0" width="800" height="600" fill="url(#warmLight)"/>

  <!-- wainscot line hint -->
  <rect x="0" y="150" width="800" height="3" fill="#e3dccf"/>
  <rect x="0" y="155" width="800" height="1.5" fill="#faf7f2"/>

  <!-- floor -->
  <rect x="0" y="452" width="800" height="148" fill="url(#oakFloor)"/>
  <rect x="0" y="452" width="800" height="4" fill="#a5876a"/>
  <!-- floor plank seams -->
  <rect x="90" y="456" width="2" height="144" fill="#c8a87c" opacity="0.5"/>
  <rect x="300" y="456" width="2" height="144" fill="#c8a87c" opacity="0.5"/>
  <rect x="520" y="456" width="2" height="144" fill="#c8a87c" opacity="0.5"/>
  <rect x="710" y="456" width="2" height="144" fill="#c8a87c" opacity="0.5"/>

  <!-- soft floor shadow under sofa -->
  <ellipse cx="410" cy="520" rx="360" ry="34" fill="#1f1b16" opacity="0.12"/>

  <!-- ============ WHITE BOUCLE SOFA ============ -->
  <!-- back cushion mass -->
  <rect x="70" y="228" width="660" height="150" rx="30" fill="url(#boucle)"/>
  <!-- boucle texture dots on back -->
  <g fill="#e9e2d6" opacity="0.55">
    <circle cx="120" cy="270" r="4"/><circle cx="150" cy="300" r="4"/><circle cx="185" cy="262" r="4"/>
    <circle cx="220" cy="308" r="4"/><circle cx="260" cy="275" r="4"/><circle cx="300" cy="315" r="4"/>
    <circle cx="345" cy="268" r="4"/><circle cx="390" cy="312" r="4"/><circle cx="435" cy="278" r="4"/>
    <circle cx="480" cy="318" r="4"/><circle cx="525" cy="270" r="4"/><circle cx="570" cy="310" r="4"/>
    <circle cx="615" cy="276" r="4"/><circle cx="660" cy="312" r="4"/><circle cx="695" cy="282" r="4"/>
    <circle cx="135" cy="340" r="4"/><circle cx="205" cy="350" r="4"/><circle cx="280" cy="345" r="4"/>
    <circle cx="360" cy="352" r="4"/><circle cx="445" cy="346" r="4"/><circle cx="525" cy="350" r="4"/>
    <circle cx="605" cy="345" r="4"/><circle cx="675" cy="350" r="4"/>
  </g>

  <!-- left arm -->
  <rect x="60" y="300" width="120" height="180" rx="28" fill="url(#boucle)"/>
  <ellipse cx="100" cy="330" rx="30" ry="24" fill="#ffffff" opacity="0.7"/>
  <!-- right arm -->
  <rect x="620" y="300" width="120" height="180" rx="28" fill="url(#boucle)"/>
  <ellipse cx="700" cy="330" rx="30" ry="24" fill="#ffffff" opacity="0.7"/>

  <!-- seat base -->
  <rect x="120" y="378" width="560" height="110" rx="24" fill="url(#boucleSeat)"/>
  <!-- seat cushion split -->
  <rect x="398" y="384" width="3" height="96" fill="#e3dccf"/>
  <!-- seat boucle dots -->
  <g fill="#e9e2d6" opacity="0.5">
    <circle cx="180" cy="430" r="4"/><circle cx="230" cy="455" r="4"/><circle cx="290" cy="425" r="4"/>
    <circle cx="340" cy="458" r="4"/><circle cx="470" cy="428" r="4"/><circle cx="530" cy="455" r="4"/>
    <circle cx="590" cy="425" r="4"/><circle cx="640" cy="452" r="4"/>
  </g>
  <!-- seat front highlight -->
  <rect x="130" y="382" width="540" height="10" rx="5" fill="#ffffff" opacity="0.6"/>

  <!-- chrome legs -->
  <rect x="150" y="486" width="12" height="34" rx="3" fill="url(#chromeLeg)"/>
  <rect x="638" y="486" width="12" height="34" rx="3" fill="url(#chromeLeg)"/>
  <ellipse cx="156" cy="522" rx="12" ry="4" fill="#1f1b16" opacity="0.14"/>
  <ellipse cx="644" cy="522" rx="12" ry="4" fill="#1f1b16" opacity="0.14"/>

  <!-- ============ OLIVE VELVET CUSHION (left) ============ -->
  <g>
    <rect x="150" y="300" width="150" height="150" rx="14" fill="url(#olive)"/>
    <rect x="150" y="300" width="150" height="150" rx="14" fill="url(#oliveHi)" opacity="0.5"/>
    <!-- velvet sheen -->
    <path d="M162 312 Q225 300 288 312 L288 360 Q225 340 162 360 Z" fill="#9a9c70" opacity="0.4"/>
    <ellipse cx="225" cy="375" rx="70" ry="55" fill="#6d6f4e" opacity="0.28"/>
    <!-- corner pinch -->
    <path d="M150 300 L172 322 M300 300 L278 322" stroke="#6d6f4e" stroke-width="2.5" fill="none" opacity="0.5"/>
  </g>

  <!-- ============ GRAPHITE LINEN CUSHION (center) ============ -->
  <g>
    <rect x="330" y="292" width="150" height="150" rx="14" fill="url(#graphite)"/>
    <!-- linen weave lines -->
    <g stroke="#4a4640" stroke-width="1.4" opacity="0.6">
      <line x1="342" y1="308" x2="468" y2="308"/>
      <line x1="342" y1="328" x2="468" y2="328"/>
      <line x1="342" y1="348" x2="468" y2="348"/>
      <line x1="342" y1="368" x2="468" y2="368"/>
      <line x1="342" y1="388" x2="468" y2="388"/>
      <line x1="342" y1="408" x2="468" y2="408"/>
      <line x1="342" y1="428" x2="468" y2="428"/>
    </g>
    <path d="M342 304 Q405 292 468 304 L468 344 Q405 328 342 344 Z" fill="#4a4640" opacity="0.45"/>
    <path d="M330 292 L352 314 M480 292 L458 314" stroke="#2a2724" stroke-width="2.5" fill="none" opacity="0.7"/>
  </g>

  <!-- ============ SECOND GRAPHITE CUSHION (right, behind throw) ============ -->
  <g>
    <rect x="500" y="298" width="140" height="145" rx="14" fill="url(#graphite)"/>
    <g stroke="#4a4640" stroke-width="1.4" opacity="0.55">
      <line x1="512" y1="316" x2="628" y2="316"/>
      <line x1="512" y1="338" x2="628" y2="338"/>
      <line x1="512" y1="360" x2="628" y2="360"/>
      <line x1="512" y1="382" x2="628" y2="382"/>
      <line x1="512" y1="404" x2="628" y2="404"/>
    </g>
    <path d="M500 298 L522 320 M640 298 L618 320" stroke="#2a2724" stroke-width="2.5" fill="none" opacity="0.7"/>
  </g>

  <!-- ============ DRAPED SAND THROW ============ -->
  <g>
    <path d="M300 340
             C 330 320, 380 330, 420 342
             C 470 356, 520 348, 560 372
             C 590 390, 600 430, 585 470
             C 575 496, 545 508, 510 505
             C 470 502, 455 480, 445 452
             C 435 428, 415 420, 395 428
             C 375 436, 372 462, 360 480
             C 348 498, 322 502, 300 492
             C 278 482, 272 456, 282 428
             C 290 404, 288 372, 300 340 Z"
          fill="url(#sand)"/>
    <!-- throw fold highlights -->
    <path d="M320 360 C 360 350, 410 360, 450 378" stroke="#e3dccf" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M310 420 C 340 410, 380 418, 405 435" stroke="#d8c19a" stroke-width="3" fill="none" opacity="0.7"/>
    <!-- throw fold shadows -->
    <path d="M330 400 C 370 392, 420 402, 470 425" stroke="#a5876a" stroke-width="3.5" fill="none" opacity="0.45"/>
    <path d="M470 400 C 510 410, 545 430, 555 462" stroke="#a5876a" stroke-width="3.5" fill="none" opacity="0.4"/>
    <path d="M300 470 C 330 480, 360 478, 385 466" stroke="#a5876a" stroke-width="3" fill="none" opacity="0.4"/>
    <!-- fringe hint -->
    <g stroke="#c8a87c" stroke-width="2" opacity="0.7">
      <line x1="502" y1="503" x2="502" y2="514"/>
      <line x1="512" y1="504" x2="512" y2="515"/>
      <line x1="522" y1="503" x2="522" y2="514"/>
      <line x1="532" y1="501" x2="532" y2="512"/>
    </g>
  </g>

  <!-- ============ SIDE ACCENTS ============ -->
  <!-- small glass vase on left arm -->
  <g>
    <ellipse cx="105" cy="302" rx="26" ry="7" fill="#1f1b16" opacity="0.1"/>
    <path d="M90 260 Q88 292 105 298 Q122 292 120 260 Q118 250 105 250 Q92 250 90 260 Z" fill="url(#glassVase)" opacity="0.85"/>
    <ellipse cx="105" cy="258" rx="15" ry="5" fill="#b8cdd6"/>
    <path d="M96 262 Q100 285 105 292" stroke="#e3e1dc" stroke-width="2.5" fill="none" opacity="0.7"/>
    <!-- olive stems -->
    <path d="M100 250 Q94 220 88 200" stroke="#7a7c5c" stroke-width="2.5" fill="none"/>
    <path d="M108 250 Q114 224 122 206" stroke="#8a8c62" stroke-width="2.5" fill="none"/>
    <ellipse cx="86" cy="198" rx="7" ry="3.5" fill="#8a8c62" transform="rotate(-30 86 198)"/>
    <ellipse cx="124" cy="204" rx="7" ry="3.5" fill="#7a7c5c" transform="rotate(30 124 204)"/>
    <ellipse cx="94" cy="214" rx="6" ry="3" fill="#8a8c62" transform="rotate(-20 94 214)"/>
  </g>

  <!-- amber accent: brass tray edge on right arm -->
  <g>
    <ellipse cx="695" cy="300" rx="34" ry="9" fill="url(#amberGlow)"/>
    <ellipse cx="695" cy="298" rx="34" ry="9" fill="#cf9f5c"/>
    <ellipse cx="695" cy="297" rx="26" ry="6" fill="#b98a4a"/>
    <ellipse cx="695" cy="296" rx="26" ry="6" fill="#cf9f5c" opacity="0.5"/>
    <!-- little candle -->
    <rect x="686" y="276" width="18" height="22" rx="3" fill="#f7f3ec"/>
    <rect x="686" y="276" width="6" height="22" rx="3" fill="#ffffff" opacity="0.7"/>
    <ellipse cx="695" cy="276" rx="9" ry="3" fill="#e3dccf"/>
    <path d="M695 276 Q693 268 695 262 Q697 268 695 276" fill="#cf9f5c"/>
  </g>

  <!-- gentle wall vignette shadow behind sofa -->
  <rect x="70" y="228" width="660" height="30" rx="30" fill="#e3dccf" opacity="0.35"/>

  <!-- subtle top light streak on wall -->
  <path d="M480 60 L720 40 L720 120 L500 150 Z" fill="#cf9f5c" opacity="0.06"/>
</svg>