      <circle cx="188" cy="498" r="10" fill="url(#boucleNub)"/>
      <circle cx="222" cy="490" r="9" fill="url(#boucleNub)"/>
      <circle cx="256" cy="502" r="11" fill="url(#boucleNub)"/>
      <circle cx="292" cy="494" r="10" fill="url(#boucleNub)"/>
      <circle cx="328" cy="506" r="9" fill="url(#boucleNub)"/>
      <circle cx="364" cy="496" r="11" fill="url(#boucleNub)"/>
      <circle cx="400" cy="508" r="10" fill="url(#boucleNub)"/>
      <circle cx="438" cy="500" r="9" fill="url(#boucleNub)"/>
      <circle cx="474" cy="512" r="11" fill="url(#boucleNub)"/>
      <circle cx="508" cy="524" r="9" fill="url(#boucleNub)"/>

      <circle cx="182" cy="540" r="10" fill="url(#boucleNub)"/>
      <circle cx="218" cy="532" r="11" fill="url(#boucleNub)"/>
      <circle cx="254" cy="544" r="9" fill="url(#boucleNub)"/>
      <circle cx="290" cy="536" r="10" fill="url(#boucleNub)"/>
      <circle cx="328" cy="548" r="11" fill="url(#boucleNub)"/>
      <circle cx="364" cy="540" r="9" fill="url(#boucleNub)"/>
      <circle cx="402" cy="550" r="10" fill="url(#boucleNub)"/>
      <circle cx="440" cy="542" r="11" fill="url(#boucleNub)"/>
      <circle cx="478" cy="554" r="9" fill="url(#boucleNub)"/>
      <circle cx="512" cy="566" r="10" fill="url(#boucleNub)"/>

      <circle cx="190" cy="584" r="9" fill="url(#boucleNub)"/>
      <circle cx="226" cy="576" r="10" fill="url(#boucleNub)"/>
      <circle cx="262" cy="588" r="11" fill="url(#boucleNub)"/>
      <circle cx="300" cy="580" r="9" fill="url(#boucleNub)"/>
      <circle cx="336" cy="592" r="10" fill="url(#boucleNub)"/>
      <circle cx="374" cy="584" r="11" fill="url(#boucleNub)"/>
      <circle cx="412" cy="594" r="9" fill="url(#boucleNub)"/>
      <circle cx="450" cy="586" r="10" fill="url(#boucleNub)"/>
      <circle cx="486" cy="598" r="11" fill="url(#boucleNub)"/>

      <circle cx="206" cy="626" r="10" fill="url(#boucleNub)"/>
      <circle cx="244" cy="618" r="9" fill="url(#boucleNub)"/>
      <circle cx="282" cy="630" r="11" fill="url(#boucleNub)"/>
      <circle cx="320" cy="622" r="10" fill="url(#boucleNub)"/>
      <circle cx="358" cy="634" r="9" fill="url(#boucleNub)"/>
      <circle cx="396" cy="626" r="11" fill="url(#boucleNub)"/>
      <circle cx="434" cy="636" r="10" fill="url(#boucleNub)"/>
      <circle cx="470" cy="628" r="9" fill="url(#boucleNub)"/>

      <circle cx="240" cy="666" r="10" fill="url(#boucleNub)"/>
      <circle cx="280" cy="672" r="9" fill="url(#boucleNub)"/>
      <circle cx="320" cy="662" r="11" fill="url(#boucleNub)"/>
      <circle cx="360" cy="674" r="10" fill="url(#boucleNub)"/>
      <circle cx="400" cy="666" r="9" fill="url(#boucleNub)"/>
      <circle cx="440" cy="676" r="10" fill="url(#boucleNub)"/>
    </g>
    <!-- nub shadow crescents for depth (lower-right of each cluster) -->
    <g opacity="0.4">
      <path d="M210,468 a10,10 0 0 1 -12,-4" fill="none" stroke="#c8a87c" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M340,472 a10,10 0 0 1 -12,-4" fill="none" stroke="#c8a87c" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M410,514 a10,10 0 0 1 -12,-4" fill="none" stroke="#c8a87c" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M270,552 a10,10 0 0 1 -12,-4" fill="none" stroke="#c8a87c" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M350,600 a10,10 0 0 1 -12,-4" fill="none" stroke="#c8a87c" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M300,638 a10,10 0 0 1 -12,-4" fill="none" stroke="#c8a87c" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <!-- edge line -->
    <path d="M150,420 Q200,360 320,352 Q450,346 520,400" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" filter="url(#soft)"/>
  </g>

  <!-- ============ OLIVE VELVET CUSHION (front-right, overlapping bouclé) ============ -->
  <g>
    <ellipse cx="470" cy="640" rx="150" ry="70" fill="#2a2724" opacity="0.22" filter="url(#softer)"/>
    <path d="M370,480 Q420,440 510,440 Q590,442 610,490 L610,660 Q600,700 540,712 Q450,720 400,690 Q368,660 366,590 Q366,522 370,480 Z" fill="url(#velvet)"/>
    <path d="M370,480 Q420,440 510,440 Q590,442 610,490 L610,660 Q600,700 540,712 Q450,720 400,690 Q368,660 366,590 Q366,522 370,480 Z" fill="url(#velvetSheen)"/>
    <!-- velvet pile streaks (raking light directional) -->
    <g stroke="url(#velvetPile)" stroke-width="2.2" opacity="0.5" stroke-linecap="round">
      <line x1="395" y1="470" x2="388" y2="700"/>
      <line x1="418" y1="460" x2="412" y2="702"/>
      <line x1="442" y1="452" x2="438" y2="704"/>
      <line x1="468" y1="448" x2="466" y2="704"/>
      <line x1="494" y1="446" x2="494" y2="702"/>
      <line x1="520" y1="446" x2="522" y2="700"/>
      <line x1="548" y1="450" x2="552" y2="696"/>
      <line x1="576" y1="458" x2="582" y2="686"/>
    </g>
    <!-- bright sheen band -->
    <path d="M400,486 Q470,456 560,470 Q520,500 460,512 Q420,516 400,486 Z" fill="#aeb184" opacity="0.55" filter="url(#soft)"/>
    <!-- deep fold shadow -->
    <path d="M380,600 Q420,660 480,684 Q430,676 402,650 Q382,626 380,600 Z" fill="#3c3e2c" opacity="0.6" filter="url(#soft)"/>
    <path d="M560,500 Q600,540 606,620 Q588,556 560,520 Z" fill="#3c3e2c" opacity="0.45" filter="url(#soft)"/>
    <!-- brass tufting button -->
    <circle cx="482" cy="576" r="9" fill="url(#brass)"/>
    <circle cx="479" cy="573" r="3" fill="#f4e2b8" opacity="0.8"/>
    <path d="M470,568 Q482,562 494,568 M468,584 Q482,590 496,584 M474,562 Q482,558 490,562" stroke="#4c4e38" stroke-width="1.4" fill="none" opacity="0.55"/>
    <!-- top edge highlight -->
    <path d="M370,480 Q420,440 510,440 Q590,442 610,490" fill="none" stroke="#b5b888" stroke-width="2" opacity="0.5" filter="url(#soft)"/>
  </g>

  <!-- ============ draped sand throw tail over front edge ============ -->
  <g>
    <path d="M120,690 Q160,660 230,668 Q260,672 262,704 Q262,736 220,748 L120,748 Q100,720 120,690 Z" fill="url(#sandFold)"/>
    <g stroke="#bfa47a" stroke-width="0.8" opacity="0.4">
      <line x1="128" y1="700" x2="256" y2="700"/>
      <line x1="122" y1="716" x2="260" y2="716"/>
      <line x1="120" y1="732" x2="258" y2="732"/>
    </g>
    <g stroke="#f2ead6" stroke-width="0.7" opacity="0.4">
