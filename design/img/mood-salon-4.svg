  <rect width="600" height="750" fill="url(#vignetteR)"/>
  <rect width="600" height="750" fill="url(#vignetteB)"/>
  <ellipse cx="300" cy="375" rx="420" ry="500" fill="none"/>
  <rect width="600" height="750" fill="#4a3624" opacity="0.06"/>
</svg>
