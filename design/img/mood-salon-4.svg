      <line x1="100" y1="270" x2="94" y2="512"/>
      <line x1="130" y1="268" x2="128" y2="514"/>
      <line x1="160" y1="270" x2="164" y2="510"/>
      <line x1="190" y1="276" x2="198" y2="504"/>
      <line x1="220" y1="286" x2="230" y2="496"/>
    </g>
    <g stroke="#6a655d" stroke-width="0.5" opacity="0.4">
      <line x1="55" y1="325" x2="250" y2="320"/>
      <line x1="45" y1="405" x2="262" y2="406"/>
      <line x1="60" y1="465" x2="245" y2="470"/>
    </g>
    <!-- corner highlight -->
    <path d="M60,290 Q120,272 190,278 Q150,300 100,310 Q75,312 60,290 Z" fill="#6a655d" opacity="0.35" filter="url(#soft)"/>
    <!-- seam edge shadow -->
    <path d="M250,300 Q272,330 268,410 Q264,470 240,500 Q252,440 252,380 Q250,335 250,300 Z" fill="#15130f" opacity="0.3" filter="url(#soft)"/>
  </g>

  <!-- ============ HERO: WHITE BOUCLÉ (large, off-center front) ============ -->
  <g>
    <ellipse cx="330" cy="560" rx="250" ry="120" fill="#5c4632" opacity="0.18" filter="url(#softer)"/>
    <path d="M150,420 Q200,360 320,352 Q450,346 520,400 Q560,440 558,540 Q554,640 500,700 Q400,742 280,738 Q170,732 130,660 Q108,590 116,510 Q124,460 150,420 Z" fill="url(#boucle)"/>
    <!-- sheen top-left -->
    <path d="M160,430 Q220,375 330,368 Q420,364 470,392 Q380,388 290,400 Q210,412 172,470 Q158,450 160,430 Z" fill="#ffffff" opacity="0.55" filter="url(#soft)"/>
    <!-- lower shade -->
    <path d="M150,640 Q260,720 400,712 Q500,702 540,630 Q520,690 460,712 Q360,742 260,730 Q180,720 150,640 Z" fill="#cbb287" opacity="0.4" filter="url(#soft)"/>
    <!-- nubby texture: scattered loops -->
    <g opacity="0.9">
      <circle cx="200" cy="460" r="10" fill="url(#boucleNub)"/>
      <circle cx="230" cy="450" r="9" fill="url(#boucleNub)"/>
