<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="lightSource" cx="30%" cy="12%" r="95%">
      <stop offset="0%" stop-color="#fff9ef" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#f7f0e2" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#e6dcc8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2a2724" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#faf7f2"/>
      <stop offset="45%" stop-color="#efe7d7"/>
      <stop offset="100%" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="vignetteR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2724" stop-opacity="0"/>
      <stop offset="78%" stop-color="#2a2724" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4a3624" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="vignetteB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15130f" stop-opacity="0"/>
      <stop offset="70%" stop-color="#15130f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#15130f" stop-opacity="0.34"/>
    </linearGradient>

    <!-- Bouclé nubby white -->
    <radialGradient id="boucle" cx="35%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f7f3ec"/>
      <stop offset="80%" stop-color="#e8dcc6"/>
      <stop offset="100%" stop-color="#cbb287"/>
    </radialGradient>
    <radialGradient id="boucleNub" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f4eee2"/>
      <stop offset="100%" stop-color="#d8c19a"/>
    </radialGradient>
    <radialGradient id="boucleNubShade" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#e8dcc6"/>
      <stop offset="100%" stop-color="#c8a87c"/>
    </radialGradient>

    <!-- Olive velvet with sheen -->
    <linearGradient id="velvet" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#8a8c62"/>
      <stop offset="35%" stop-color="#7a7c5c"/>
      <stop offset="70%" stop-color="#63654a"/>
      <stop offset="100%" stop-color="#4c4e38"/>
    </linearGradient>
    <radialGradient id="velvetSheen" cx="38%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#a9ac7c" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#8a8c62" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4c4e38" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="velvetPile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a9c70" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4c4e38" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Graphite linen -->
    <linearGradient id="graphite" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#54504a"/>
      <stop offset="45%" stop-color="#3d3a36"/>
      <stop offset="100%" stop-color="#2a2724"/>
    </linearGradient>
    <radialGradient id="graphiteLight" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#6a655d" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#3d3a36" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2a2724" stop-opacity="0"/>
    </radialGradient>

    <!-- Sand throw with weave -->
    <linearGradient id="sand" x1="0.1" y1="0.1" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#f0e6d2"/>
      <stop offset="40%" stop-color="#e8dcc6"/>
      <stop offset="75%" stop-color="#d8c19a"/>
      <stop offset="100%" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="sandFold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4ecdd"/>
      <stop offset="100%" stop-color="#bfa47a"/>
    </linearGradient>
    <linearGradient id="sandShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a87c"/>
      <stop offset="100%" stop-color="#a5876a"/>
    </linearGradient>

    <!-- brass button -->
    <radialGradient id="brass" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#e8c98a"/>
      <stop offset="45%" stop-color="#cf9f5c"/>
      <stop offset="80%" stop-color="#b98a4a"/>
      <stop offset="100%" stop-color="#8a5a20"/>
    </radialGradient>

    <!-- leaf -->
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a8c62"/>
      <stop offset="55%" stop-color="#63654a"/>
      <stop offset="100%" stop-color="#4a3624"/>
    </linearGradient>

    <radialGradient id="beam" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#fff6e6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fff6e6" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- base -->
  <rect width="600" height="750" fill="url(#bg)"/>
  <rect width="600" height="750" fill="url(#lightSource)"/>

  <!-- soft wall behind, upper negative space -->
  <rect x="0" y="0" width="600" height="230" fill="#efe7d7" opacity="0.5"/>
  <ellipse cx="150" cy="70" rx="320" ry="200" fill="#fff9ef" opacity="0.4" filter="url(#softer)"/>

  <!-- light beam raking across -->
  <polygon points="0,60 260,0 420,120 120,300" fill="url(#beam)" opacity="0.7"/>

  <!-- ============ SAND THROW (background layer, draped upper-right) ============ -->
  <g>
    <path d="M300,90 C400,70 520,95 610,150 L610,340 C520,300 400,320 300,300 C240,288 200,260 210,210 C218,160 250,100 300,90 Z" fill="url(#sand)"/>
    <path d="M300,90 C400,70 520,95 610,150 L610,190 C510,150 400,168 320,168 C270,168 232,178 226,205 C240,150 258,100 300,90 Z" fill="url(#sandFold)" opacity="0.7"/>
    <path d="M300,300 C400,320 520,300 610,340 L610,300 C520,272 410,286 320,272 C270,264 232,250 224,224 C232,270 250,290 300,300 Z" fill="url(#sandShade)" opacity="0.6"/>
    <!-- visible weave: warp/weft crosshatch clipped roughly to throw -->
    <g stroke="#bfa47a" stroke-width="0.9" opacity="0.32">
      <line x1="230" y1="110" x2="600" y2="150"/>
      <line x1="225" y1="128" x2="600" y2="170"/>
      <line x1="222" y1="146" x2="600" y2="190"/>
      <line x1="220" y1="164" x2="600" y2="210"/>
      <line x1="220" y1="182" x2="600" y2="230"/>
      <line x1="222" y1="200" x2="600" y2="250"/>
      <line x1="226" y1="218" x2="600" y2="270"/>
      <line x1="232" y1="236" x2="600" y2="290"/>
      <line x1="240" y1="254" x2="600" y2="310"/>
    </g>
    <g stroke="#f2ead6" stroke-width="0.7" opacity="0.4">
      <line x1="290" y1="92" x2="250" y2="298"/>
      <line x1="330" y1="90" x2="300" y2="304"/>
      <line x1="380" y1="92" x2="360" y2="312"/>
      <line x1="430" y1="98" x2="420" y2="316"/>
      <line x1="480" y1="106" x2="478" y2="316"/>
      <line x1="530" y1="116" x2="536" y2="322"/>
      <line x1="580" y1="128" x2="592" y2="330"/>
    </g>
    <!-- fringe on lower edge of throw -->
    <g stroke="#cbb287" stroke-width="1.6" stroke-linecap="round" opacity="0.75">
      <line x1="258" y1="292" x2="256" y2="312"/>
      <line x1="278" y1="296" x2="277" y2="317"/>
      <line x1="298" y1="299" x2="298" y2="320"/>
      <line x1="318" y1="301" x2="320" y2="322"/>
      <line x1="338" y1="304" x2="341" y2="324"/>
      <line x1="358" y1="306" x2="362" y2="326"/>
    </g>
  </g>

  <!-- soft cast shadow of cushions on throw -->
  <ellipse cx="250" cy="360" rx="240" ry="90" fill="#5c4632" opacity="0.16" filter="url(#softer)"/>

  <!-- ============ GRAPHITE LINEN CUSHION (back-left) ============ -->
  <g>
    <path d="M40,300 Q60,270 130,268 Q210,266 250,300 Q272,330 268,410 Q264,470 240,500 Q170,520 90,510 Q46,504 34,470 Q22,410 26,360 Q30,322 40,300 Z" fill="url(#graphite)"/>
    <path d="M40,300 Q60,270 130,268 Q210,266 250,300 Q272,330 268,410 Q264,470 240,500 Q170,520 90,510 Q46,504 34,470 Q22,410 26,360 Q30,322 40,300 Z" fill="url(#graphiteLight)"/>
    <!-- linen weave lines -->
    <g stroke="#54504a" stroke-width="0.7" opacity="0.5">
      <line x1="45" y1="315" x2="255" y2="308"/>
      <line x1="40" y1="335" x2="262" y2="330"/>
      <line x1="36" y1="355" x2="266" y2="352"/>
      <line x1="34" y1="375" x2="267" y2="374"/>
      <line x1="34" y1="395" x2="266" y2="396"/>
