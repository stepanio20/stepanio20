    <path d="M0,120 Q70,90 140,140 Q80,150 40,178 Q10,160 0,120 Z" fill="url(#leaf)"/>
    <path d="M0,120 Q70,100 130,138" fill="none" stroke="#4a3624" stroke-width="1.4" opacity="0.6"/>
    <path d="M20,100 Q90,70 150,110 Q95,124 60,158 Q26,140 20,100 Z" fill="url(#leaf)" opacity="0.85"/>
    <path d="M22,102 Q92,80 146,110" fill="none" stroke="#4a3624" stroke-width="1.2" opacity="0.5"/>
