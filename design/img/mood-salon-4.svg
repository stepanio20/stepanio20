      <line x1="38" y1="435" x2="260" y2="440"/>
      <line x1="44" y1="455" x2="254" y2="462"/>
      <line x1="54" y1="475" x2="246" y2="482"/>
    </g>
    <g stroke="#2a2724" stroke-width="0.7" opacity="0.55">
