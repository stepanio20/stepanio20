<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f7f3ec"/>
    </linearGradient>
    <linearGradient id="ledgeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="ledgeFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="ledgeLip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8a87c"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="frameWalnut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5138"/>
      <stop offset="1" stop-color="#5c4632"/>
    </linearGradient>
    <linearGradient id="frameChrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3e1dc"/>
      <stop offset="0.5" stop-color="#c9c5be"/>
      <stop offset="1" stop-color="#e3e1dc"/>
    </linearGradient>
    <linearGradient id="posterA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8c62"/>
      <stop offset="1" stop-color="#7a7c5c"/>
    </linearGradient>
    <linearGradient id="posterB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#e3e1dc"/>
    </linearGradient>
    <linearGradient id="candleBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="0.5" stop-color="#f7f3ec"/>
      <stop offset="1" stop-color="#e3e1dc"/>
    </linearGradient>
    <radialGradient id="flameGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cf9f5c" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#cf9f5c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#cf9f5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf9f5c"/>
      <stop offset="1" stop-color="#b98a4a"/>
    </linearGradient>
    <radialGradient id="chromeVase" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#e3e1dc"/>
      <stop offset="1" stop-color="#c9c5be"/>
    </radialGradient>
  </defs>

  <!-- wall -->
  <rect x="0" y="0" width="800" height="600" fill="url(#wall)"/>
  <!-- warm light wash -->
  <ellipse cx="470" cy="230" rx="300" ry="240" fill="#cf9f5c" opacity="0.06"/>

  <!-- floor band -->
  <rect x="0" y="486" width="800" height="114" fill="url(#floor)"/>
  <rect x="0" y="486" width="800" height="5" fill="#a5876a" opacity="0.5"/>
  <!-- floor plank seams -->
  <rect x="120" y="491" width="3" height="109" fill="#a5876a" opacity="0.28"/>
  <rect x="360" y="491" width="3" height="109" fill="#a5876a" opacity="0.28"/>
  <rect x="600" y="491" width="3" height="109" fill="#a5876a" opacity="0.28"/>

  <!-- ambient shadow the ledge casts on wall -->
  <rect x="150" y="356" width="520" height="30" rx="10" fill="#1f1b16" opacity="0.06"/>

  <!-- =========== OAK PICTURE LEDGE =========== -->
  <!-- ledge shadow on wall under lip -->
  <rect x="152" y="400" width="516" height="18" rx="8" fill="#1f1b16" opacity="0.08"/>
  <!-- back board (thin) -->
  <rect x="150" y="352" width="520" height="14" rx="5" fill="url(#ledgeFace)"/>
  <!-- top surface -->
  <rect x="150" y="360" width="520" height="26" rx="6" fill="url(#ledgeTop)"/>
  <!-- front lip / face -->
  <rect x="150" y="382" width="520" height="34" rx="7" fill="url(#ledgeFace)"/>
  <!-- lip highlight -->
  <rect x="150" y="382" width="520" height="5" rx="3" fill="#d8c19a" opacity="0.7"/>
  <!-- raised front rail of the ledge (holds art) -->
  <rect x="158" y="372" width="504" height="14" rx="5" fill="url(#ledgeLip)"/>
  <rect x="158" y="372" width="504" height="4" rx="2" fill="#d8c19a" opacity="0.6"/>
  <!-- oak grain hints -->
  <rect x="180" y="367" width="180" height="2" rx="1" fill="#a5876a" opacity="0.3"/>
  <rect x="400" y="369" width="220" height="2" rx="1" fill="#a5876a" opacity="0.28"/>
  <rect x="220" y="396" width="160" height="2" rx="1" fill="#5c4632" opacity="0.18"/>
  <rect x="420" y="402" width="180" height="2" rx="1" fill="#5c4632" opacity="0.16"/>
  <!-- end caps -->
  <rect x="150" y="360" width="10" height="56" rx="4" fill="#a5876a" opacity="0.55"/>
  <rect x="660" y="360" width="10" height="56" rx="4" fill="#a5876a" opacity="0.35"/>

  <!-- =========== FRAMED POSTER A (walnut, leaning left, larger, behind) =========== -->
  <!-- shadow behind poster A on wall -->
  <polygon points="214,120 470,120 476,376 220,376" fill="#1f1b16" opacity="0.05"/>
  <!-- outer frame -->
  <rect x="212" y="112" width="252" height="262" rx="6" fill="url(#frameWalnut)"/>
  <!-- inner bevel -->
  <rect x="222" y="122" width="232" height="242" rx="4" fill="#5c4632"/>
  <rect x="222" y="122" width="232" height="6" rx="3" fill="#6d5138" opacity="0.8"/>
  <!-- mat -->
  <rect x="234" y="134" width="208" height="218" rx="3" fill="#faf7f2"/>
  <!-- artwork field -->
  <rect x="248" y="148" width="180" height="190" rx="2" fill="url(#posterA)"/>
  <!-- abstract flat composition inside poster A -->
  <circle cx="300" cy="205" r="34" fill="#cf9f5c"/>
  <circle cx="300" cy="205" r="34" fill="#b98a4a" opacity="0.25"/>
  <rect x="262" y="256" width="152" height="14" rx="7" fill="#3d3a36" opacity="0.85"/>
  <rect x="262" y="282" width="120" height="10" rx="5" fill="#5c4632" opacity="0.7"/>
  <rect x="262" y="304" width="90" height="10" rx="5" fill="#8a8c62"/>
  <polygon points="360,168 410,168 410,240 360,240" fill="#c8a87c" opacity="0.55"/>
  <!-- glass sheen -->
  <polygon points="248,148 300,148 220,338 248,338" fill="#ffffff" opacity="0.10"/>

  <!-- =========== FRAMED POSTER B (chrome, leaning right, smaller, in front) =========== -->
  <!-- shadow behind poster B -->
  <polygon points="432,178 596,178 602,376 438,376" fill="#1f1b16" opacity="0.06"/>
  <!-- outer chrome frame -->
  <rect x="430" y="170" width="170" height="206" rx="6" fill="url(#frameChrome)"/>
  <rect x="430" y="170" width="170" height="206" rx="6" fill="none" stroke="#c9c5be" stroke-width="2"/>
  <!-- inner slim edge -->
  <rect x="440" y="180" width="150" height="186" rx="4" fill="#e3e1dc"/>
  <!-- mat -->
  <rect x="449" y="189" width="132" height="168" rx="3" fill="#ffffff"/>
  <!-- artwork field -->
  <rect x="460" y="200" width="110" height="146" rx="2" fill="url(#posterB)"/>
  <!-- flat minimal composition inside poster B -->
  <rect x="474" y="216" width="82" height="60" rx="3" fill="#b8cdd6"/>
  <polygon points="474,276 512,232 556,276" fill="#7a7c5c"/>
  <polygon points="512,276 540,250 556,276" fill="#8a8c62"/>
  <circle cx="498" cy="230" r="9" fill="#cf9f5c"/>
  <rect x="474" y="292" width="82" height="8" rx="4" fill="#3d3a36" opacity="0.8"/>
  <rect x="474" y="308" width="60" height="7" rx="3.5" fill="#5c4632" opacity="0.6"/>
  <!-- glass sheen -->
  <polygon points="460,200 500,200 460,346 460,346" fill="#ffffff" opacity="0.14"/>

  <!-- =========== AMBER-LIT CANDLE (right side of ledge) =========== -->
  <!-- glow halo -->
  <circle cx="622" cy="322" r="70" fill="url(#flameGlow)"/>
  <!-- candle shadow on ledge -->
  <ellipse cx="622" cy="374" rx="30" ry="7" fill="#1f1b16" opacity="0.14"/>
  <!-- chrome holder base -->
  <path d="M600 374 Q600 362 622 362 Q644 362 644 374 Z" fill="url(#chromeVase)"/>
  <ellipse cx="622" cy="362" rx="22" ry="5" fill="#e3e1dc"/>
  <rect x="606" y="356" width="32" height="8" rx="3" fill="#c9c5be"/>
  <!-- candle body -->
  <rect x="606" y="300" width="32" height="60" rx="6" fill="url(#candleBody)"/>
  <rect x="609" y="302" width="6" height="56" rx="3" fill="#ffffff" opacity="0.7"/>
  <rect x="630" y="302" width="5" height="56" rx="2.5" fill="#cbb287" opacity="0.3"/>
  <!-- wax pool top -->
  <ellipse cx="622" cy="300" rx="16" ry="5" fill="#e3e1dc"/>
  <ellipse cx="622" cy="299" rx="10" ry="3" fill="#cf9f5c" opacity="0.5"/>
  <!-- wick -->
  <rect x="620" y="288" width="3" height="12" rx="1.5" fill="#3d3a36"/>
  <!-- flame -->
  <path d="M621.5 262 Q613 280 621.5 296 Q630 280 621.5 262 Z" fill="url(#flame)"/>
  <path d="M621.5 272 Q617 282 621.5 294 Q626 282 621.5 272 Z" fill="#faf7f2" opacity="0.85"/>

  <!-- =========== small chrome vase with sprig (left, on ledge) =========== -->
  <ellipse cx="196" cy="374" rx="20" ry="6" fill="#1f1b16" opacity="0.12"/>
  <path d="M180 372 Q178 344 196 340 Q214 344 212 372 Z" fill="url(#chromeVase)"/>
  <path d="M184 366 Q183 348 196 345 L196 372 Z" fill="#ffffff" opacity="0.35"/>
  <ellipse cx="196" cy="341" rx="16" ry="4" fill="#c9c5be"/>
  <!-- sprig -->
  <path d="M196 341 Q192 312 200 292" fill="none" stroke="#7a7c5c" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="188" cy="316" rx="9" ry="4" fill="#8a8c62" transform="rotate(-32 188 316)"/>
  <ellipse cx="207" cy="306" rx="9" ry="4" fill="#7a7c5c" transform="rotate(28 207 306)"/>
  <ellipse cx="201" cy="292" rx="7" ry="3.5" fill="#8a8c62" transform="rotate(10 201 292)"/>

  <!-- soft floor reflection glow -->
  <ellipse cx="420" cy="500" rx="360" ry="20" fill="#faf7f2" opacity="0.18"/>
</svg>