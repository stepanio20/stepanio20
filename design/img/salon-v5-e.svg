    <radialGradient id="rug" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#e8dcc6"/>
      <stop offset="0.7" stop-color="#dfceb2"/>
      <stop offset="1" stop-color="#cbb287"/>
