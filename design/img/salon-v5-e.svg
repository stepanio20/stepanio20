  <rect x="670" y="344" width="40" height="8" rx="2" fill="#5c4632"/>
  <rect x="674" y="336" width="34" height="8" rx="2" fill="#8a8c62"/>

  <!-- ============ WOOL RUG ============ -->
  <ellipse cx="400" cy="540" rx="330" ry="60" fill="url(#rug)"/>
  <ellipse cx="400" cy="540" rx="330" ry="60" fill="#8a5a20" opacity="0.04"/>
  <ellipse cx="400" cy="540" rx="300" ry="50" fill="none" stroke="#cbb287" stroke-width="2" opacity="0.6"/>
  <ellipse cx="400" cy="540" rx="270" ry="42" fill="none" stroke="#e8dcc6" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="520" cy="520" rx="140" ry="26" fill="#f6e4c2" opacity="0.18"/>

  <!-- ============ WHITE BOUCLÉ SOFA (right, slightly angled) ============ -->
  <ellipse cx="470" cy="560" rx="230" ry="30" fill="#1f1b16" opacity="0.12"/>
  <!-- back cushions -->
  <path d="M270 470 q0 -70 40 -74 h280 q40 4 40 74 v20 h-360 z" fill="url(#boucle)"/>
  <path d="M300 402 q140 -18 300 4 v10 q-150 -16 -300 -2 z" fill="#e8dcc6" opacity="0.5"/>
  <!-- bouclé texture dots on back -->
  <circle cx="330" cy="430" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="360" cy="446" r="3" fill="#e8dcc6" opacity="0.7"/>
  <circle cx="400" cy="428" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="440" cy="444" r="3" fill="#e8dcc6" opacity="0.6"/>
  <circle cx="490" cy="430" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="540" cy="448" r="3" fill="#e8dcc6" opacity="0.6"/>
  <circle cx="575" cy="432" r="3" fill="#ffffff" opacity="0.5"/>
  <!-- arms -->
  <rect x="256" y="452" width="52" height="96" rx="24" fill="url(#boucle)"/>
  <rect x="592" y="452" width="52" height="96" rx="24" fill="url(#boucle)"/>
  <ellipse cx="282" cy="470" rx="20" ry="10" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="618" cy="470" rx="20" ry="10" fill="#f6e4c2" opacity="0.5"/>
  <!-- seat -->
  <path d="M300 496 h300 q22 0 22 24 v22 q0 14 -18 14 h-308 q-18 0 -18 -14 v-22 q0 -24 22 -24 z" fill="url(#boucle)"/>
  <line x1="450" y1="500" x2="450" y2="552" stroke="#e8dcc6" stroke-width="2" opacity="0.5"/>
  <!-- seat bouclé dots -->
  <circle cx="360" cy="520" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="410" cy="530" r="2.5" fill="#e8dcc6" opacity="0.6"/>
  <circle cx="500" cy="522" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="555" cy="532" r="2.5" fill="#e8dcc6" opacity="0.6"/>
  <!-- feet -->
  <rect x="292" y="548" width="10" height="16" rx="3" fill="#5c4632"/>
  <rect x="600" y="548" width="10" height="16" rx="3" fill="#5c4632"/>

  <!-- olive velvet cushion -->
  <path d="M318 452 q34 -30 68 0 q10 34 -34 44 q-44 -10 -34 -44 z" fill="url(#velvet)"/>
  <path d="M330 458 q22 -18 44 0" stroke="#8a8c62" stroke-width="2" fill="none" opacity="0.7"/>
  <ellipse cx="352" cy="464" rx="12" ry="8" fill="#8a8c62" opacity="0.5"/>
  <ellipse cx="366" cy="452" rx="6" ry="4" fill="#f6e4c2" opacity="0.4"/>

  <!-- graphite linen cushion -->
  <path d="M414 456 q34 -30 68 0 q10 34 -34 44 q-44 -10 -34 -44 z" fill="url(#linen)"/>
  <path d="M426 462 q22 -18 44 0" stroke="#3d3a36" stroke-width="2" fill="none" opacity="0.8"/>
  <line x1="430" y1="472 " x2="466" y2="472" stroke="#2a2724" stroke-width="1" opacity="0.6"/>
  <line x1="428" y1="482" x2="468" y2="482" stroke="#2a2724" stroke-width="1" opacity="0.5"/>
  <ellipse cx="458" cy="460" rx="6" ry="4" fill="#9a968f" opacity="0.3"/>

