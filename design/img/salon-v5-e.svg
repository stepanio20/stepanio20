  <!-- glass door handles -->
  <rect x="142" y="180" width="4" height="30" rx="2" fill="url(#chrome)"/>
  <rect x="154" y="180" width="4" height="30" rx="2" fill="url(#chrome)"/>

  <!-- HELMET 1 (olive, lit) on shelf -->
  <ellipse cx="109" cy="182" rx="30" ry="8" fill="#1f1b16" opacity="0.18"/>
  <path d="M84 158 a25 24 0 0 1 50 0 v6 a10 8 0 0 1 -10 8 h-30 a10 8 0 0 1 -10 -8 z" fill="url(#helmetOlive)"/>
  <path d="M92 150 a18 17 0 0 1 34 3 l-2 8 h-30 z" fill="#c9c5be" opacity="0.9"/>
  <path d="M92 150 a18 17 0 0 1 34 3" fill="none" stroke="#3d3a36" stroke-width="2"/>
  <ellipse cx="102" cy="150" rx="6" ry="7" fill="#f6e4c2" opacity="0.7"/>
  <path d="M84 162 h50" stroke="#4a3624" stroke-width="2" opacity="0.5"/>
  <ellipse cx="98" cy="140" rx="7" ry="4" fill="#ffffff" opacity="0.4"/>

