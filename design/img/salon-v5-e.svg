  <path d="M88 312 q4 80 0 160" stroke="#a5876a" stroke-width="1.4" fill="none" opacity="0.4"/>
  <path d="M112 312 q-4 80 2 160" stroke="#a5876a" stroke-width="1.4" fill="none" opacity="0.35"/>
  <path d="M172 312 q5 80 0 160" stroke="#a5876a" stroke-width="1.4" fill="none" opacity="0.4"/>
  <path d="M200 312 q-3 80 2 160" stroke="#a5876a" stroke-width="1.4" fill="none" opacity="0.35"/>
  <rect x="142" y="380" width="4" height="34" rx="2" fill="#2a2724"/>
  <rect x="154" y="380" width="4" height="34" rx="2" fill="#2a2724"/>
