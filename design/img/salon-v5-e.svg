  <!-- steel frame legs -->
  <rect x="432" y="360" width="10" height="108" rx="3" fill="url(#steel)"/>
  <rect x="718" y="360" width="10" height="108" rx="3" fill="url(#steel)"/>
  <rect x="432" y="360" width="296" height="10" rx="3" fill="url(#steel)"/>
  <!-- oak body -->
  <rect x="440" y="368" width="280" height="72" rx="6" fill="url(#oakV)"/>
  <rect x="440" y="368" width="280" height="72" rx="6" fill="#8a5a20" opacity="0.05"/>
  <!-- console doors -->
  <rect x="450" y="376" width="128" height="56" rx="4" fill="url(#oakDark)" opacity="0.6"/>
  <rect x="584" y="376" width="128" height="56" rx="4" fill="url(#oakDark)" opacity="0.6"/>
  <line x1="514" y1="382" x2="514" y2="426" stroke="#4a3624" stroke-width="2" opacity="0.4"/>
  <line x1="648" y1="382" x2="648" y2="426" stroke="#4a3624" stroke-width="2" opacity="0.4"/>
  <rect x="504" y="398" width="20" height="4" rx="2" fill="#2a2724"/>
  <rect x="638" y="398" width="20" height="4" rx="2" fill="#2a2724"/>
  <!-- grain -->
  <path d="M470 378 q4 30 0 58" stroke="#a5876a" stroke-width="1.2" fill="none" opacity="0.35"/>
  <path d="M620 378 q-3 30 2 58" stroke="#a5876a" stroke-width="1.2" fill="none" opacity="0.35"/>
  <!-- steel feet -->
  <rect x="430" y="466" width="14" height="8" rx="2" fill="#15130f"/>
  <rect x="716" y="466" width="14" height="8" rx="2" fill="#15130f"/>

  <!-- TV / black screen on console -->
  <rect x="500" y="212" width="196" height="112" rx="6" fill="url(#steel)"/>
  <rect x="508" y="220" width="180" height="96" rx="3" fill="#15130f"/>
  <rect x="508" y="220" width="180" height="96" rx="3" fill="url(#glass)" opacity="0.25"/>
  <path d="M520 228 l40 80" stroke="#b8cdd6" stroke-width="3" opacity="0.18" stroke-linecap="round"/>
  <path d="M540 228 l40 80" stroke="#b8cdd6" stroke-width="2" opacity="0.14" stroke-linecap="round"/>
  <rect x="586" y="324" width="24" height="46" fill="url(#steel)"/>
  <rect x="560" y="368" width="76" height="8" rx="3" fill="#2a2724"/>

  <!-- decor object on console: small amber vase -->
  <ellipse cx="470" cy="366" rx="16" ry="4" fill="#1f1b16" opacity="0.15"/>
  <path d="M458 366 q-3 -30 12 -34 q15 4 12 34 z" fill="url(#helmetAmber)"/>
  <ellipse cx="470" cy="334" rx="9" ry="3" fill="#8a5a20"/>
  <ellipse cx="466" cy="348" rx="3" ry="10" fill="#f6e4c2" opacity="0.4"/>
