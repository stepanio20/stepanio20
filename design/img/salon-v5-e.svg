    <linearGradient id="floorGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a20" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#cf9f5c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#cf9f5c" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="oakV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5876a"/>
      <stop offset="0.5" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#d8c19a"/>
    </linearGradient>
    <linearGradient id="oakDark" x1="0" y1="0" x2="1" y2="0">
