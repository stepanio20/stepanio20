  <path d="M588 470 q40 -8 62 6 q10 40 -6 78 q-20 6 -30 -4 q6 -34 -4 -58 q-14 -8 -22 -22 z" fill="url(#throw)"/>
  <path d="M600 486 q26 -2 44 8" stroke="#e8dcc6" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M604 508 q24 0 40 8" stroke="#cbb287" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M612 530 q18 2 30 8" stroke="#cbb287" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M646 490 l-4 60" stroke="#e8dcc6" stroke-width="1.5" opacity="0.5"/>

  <!-- ============ SIDE ACCENT: small amber floor lamp glow near sofa ============ -->
  <ellipse cx="250" cy="520" rx="40" ry="12" fill="#1f1b16" opacity="0.1"/>
  <rect x="246" y="360" width="6" height="150" rx="3" fill="url(#chrome)"/>
  <ellipse cx="249" cy="480" rx="60" ry="60" fill="url(#halo)" opacity="0.35"/>
  <path d="M228 350 h42 l-6 26 h-30 z" fill="url(#throw)"/>
  <ellipse cx="249" cy="376" rx="15" ry="4" fill="#f6e0b0" opacity="0.85"/>
  <ellipse cx="249" cy="350" rx="21" ry="4" fill="#e8dcc6"/>
  <rect x="234" y="506" width="30" height="8" rx="3" fill="#2a2724"/>

