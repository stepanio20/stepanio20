  <rect x="66" y="296" width="168" height="192" rx="5" fill="url(#oakDark)"/>
  <rect x="72" y="302" width="74" height="180" rx="4" fill="url(#oakV)"/>
  <rect x="154" y="302" width="74" height="180" rx="4" fill="url(#oakV)"/>
  <rect x="72" y="302" width="74" height="180" rx="4" fill="#6d5138" opacity="0.1"/>
