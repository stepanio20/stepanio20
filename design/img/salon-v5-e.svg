    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="0.55" stop-color="#f7f3ec"/>
      <stop offset="1" stop-color="#efe6d6"/>
    </linearGradient>
    <radialGradient id="glowWall" cx="0.72" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#f6e4c2" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#f2ddb8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f2ddb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="0.5" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#c8a87c"/>
