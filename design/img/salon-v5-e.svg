  <rect x="0" y="405" width="800" height="4" fill="#a5876a" opacity="0.5"/>
  <!-- plank lines (angled slightly for perspective) -->
  <line x1="0" y1="452" x2="800" y2="448" stroke="#a5876a" stroke-width="1.4" opacity="0.4"/>
  <line x1="0" y1="500" x2="800" y2="494" stroke="#a5876a" stroke-width="1.4" opacity="0.4"/>
  <line x1="0" y1="552" x2="800" y2="546" stroke="#a5876a" stroke-width="1.4" opacity="0.4"/>
  <line x1="130" y1="410" x2="120" y2="452" stroke="#a5876a" stroke-width="1" opacity="0.3"/>
  <line x1="360" y1="452" x2="345" y2="500" stroke="#a5876a" stroke-width="1" opacity="0.3"/>
  <line x1="600" y1="410" x2="595" y2="452" stroke="#a5876a" stroke-width="1" opacity="0.3"/>
  <line x1="520" y1="500" x2="505" y2="552" stroke="#a5876a" stroke-width="1" opacity="0.3"/>
  <line x1="230" y1="552" x2="210" y2="600" stroke="#a5876a" stroke-width="1" opacity="0.3"/>

  <!-- ============ TALL OAK CABINET (left) ============ -->
  <ellipse cx="150" cy="500" rx="120" ry="20" fill="#1f1b16" opacity="0.12"/>
  <!-- carcass -->
  <rect x="52" y="92" width="196" height="405" rx="8" fill="url(#oakV)"/>
  <rect x="52" y="92" width="196" height="405" rx="8" fill="#8a5a20" opacity="0.06"/>
  <rect x="60" y="100" width="180" height="389" rx="6" fill="url(#oakDark)" opacity="0.55"/>
  <!-- upper glass doors frame -->
  <rect x="66" y="106" width="168" height="180" rx="5" fill="#6d5138"/>
  <rect x="72" y="112" width="74" height="168" rx="4" fill="url(#glass)"/>
  <rect x="154" y="112" width="74" height="168" rx="4" fill="url(#glass)"/>
  <!-- glass reflection streaks -->
