  <line x1="470" y1="0" x2="470" y2="405" stroke="#e8dcc6" stroke-width="2" opacity="0.5"/>
  <line x1="660" y1="0" x2="660" y2="405" stroke="#e8dcc6" stroke-width="2" opacity="0.5"/>

  <!-- FLOOR -->
