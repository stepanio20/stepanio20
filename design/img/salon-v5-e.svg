  <circle cx="330" cy="118" r="46" fill="url(#globeGlow)"/>
  <circle cx="330" cy="118" r="46" fill="#fdf3d8" opacity="0.25"/>
  <path d="M290 100 q40 -14 80 0" stroke="#e8dcc6" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M286 118 h88" stroke="#e8dcc6" stroke-width="1.2" opacity="0.5"/>
  <path d="M290 136 q40 14 80 0" stroke="#e8dcc6" stroke-width="1.2" fill="none" opacity="0.6"/>
  <ellipse cx="316" cy="104" rx="12" ry="8" fill="#ffffff" opacity="0.5"/>

