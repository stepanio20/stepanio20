  <path d="M512 456 q30 -26 60 0 q9 30 -30 40 q-39 -10 -30 -40 z" fill="url(#velvet)"/>
  <path d="M522 462 q20 -16 40 0" stroke="#8a8c62" stroke-width="2" fill="none" opacity="0.6"/>
  <ellipse cx="552" cy="460" rx="5" ry="4" fill="#f6e4c2" opacity="0.35"/>

