  <path d="M166 158 a25 24 0 0 1 50 0 v6 a10 8 0 0 1 -10 8 h-30 a10 8 0 0 1 -10 -8 z" fill="url(#helmetAmber)"/>
  <path d="M174 150 a18 17 0 0 1 34 3 l-2 8 h-30 z" fill="#c9c5be" opacity="0.9"/>
  <path d="M174 150 a18 17 0 0 1 34 3" fill="none" stroke="#3d3a36" stroke-width="2"/>
  <ellipse cx="184" cy="150" rx="6" ry="7" fill="#f6e4c2" opacity="0.75"/>
  <path d="M166 162 h50" stroke="#8a5a20" stroke-width="2" opacity="0.5"/>
  <ellipse cx="180" cy="140" rx="7" ry="4" fill="#ffffff" opacity="0.4"/>
