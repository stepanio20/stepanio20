  <line x1="98" y1="118" x2="134" y2="196" stroke="#ffffff" stroke-width="2" opacity="0.25" stroke-linecap="round"/>
  <line x1="164" y1="118" x2="202" y2="200" stroke="#ffffff" stroke-width="4" opacity="0.3" stroke-linecap="round"/>
