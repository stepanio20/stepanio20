<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f7f3ec"/>
    </linearGradient>
    <linearGradient id="oakFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="cabBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2724"/>
      <stop offset="0.5" stop-color="#3d3a36"/>
      <stop offset="1" stop-color="#2a2724"/>
    </linearGradient>
    <linearGradient id="cabInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3a36"/>
      <stop offset="1" stop-color="#15130f"/>
    </linearGradient>
    <linearGradient id="ledGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf9f5c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#cf9f5c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8cdd6" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#e3e1dc" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#b8cdd6" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="bagA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf9f5c"/>
      <stop offset="1" stop-color="#b98a4a"/>
    </linearGradient>
    <linearGradient id="bagB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e1dc"/>
      <stop offset="1" stop-color="#c9c5be"/>
    </linearGradient>
    <linearGradient id="bagC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8c62"/>
      <stop offset="1" stop-color="#7a7c5c"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e1dc"/>
      <stop offset="0.5" stop-color="#c9c5be"/>
      <stop offset="1" stop-color="#e3e1dc"/>
    </linearGradient>
    <linearGradient id="bamboo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="0.5" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="tote" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8a87c"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
  </defs>

  <!-- background wall -->
  <rect x="0" y="0" width="800" height="600" fill="url(#wall)"/>
  <rect x="0" y="452" width="800" height="148" fill="url(#oakFloor)"/>
  <!-- floor plank seams -->
  <rect x="0" y="452" width="800" height="3" fill="#a5876a" opacity="0.35"/>
  <rect x="150" y="455" width="2" height="145" fill="#a5876a" opacity="0.25"/>
  <rect x="470" y="455" width="2" height="145" fill="#a5876a" opacity="0.25"/>
  <rect x="690" y="455" width="2" height="145" fill="#a5876a" opacity="0.25"/>

  <!-- ambient warm light patch on wall -->
  <ellipse cx="250" cy="200" rx="180" ry="200" fill="#cf9f5c" opacity="0.06"/>

  <!-- ===== CABINET ===== -->
  <!-- floor shadow -->
  <ellipse cx="250" cy="470" rx="150" ry="20" fill="#1f1b16" opacity="0.12"/>

  <!-- cabinet outer body -->
  <rect x="150" y="70" width="200" height="392" rx="10" fill="url(#cabBody)"/>
  <rect x="150" y="70" width="200" height="392" rx="10" fill="none" stroke="#15130f" stroke-width="2"/>
  <!-- side light edge -->
  <rect x="154" y="76" width="6" height="380" rx="3" fill="#5c4632" opacity="0.25"/>

  <!-- inner recess -->
  <rect x="172" y="92" width="156" height="348" rx="6" fill="url(#cabInner)"/>

  <!-- LED strip top -->
  <rect x="180" y="98" width="140" height="6" rx="3" fill="#cf9f5c"/>
  <rect x="180" y="104" width="140" height="70" fill="url(#ledGlow)"/>

  <!-- shelf lines -->
  <rect x="172" y="212" width="156" height="5" fill="#15130f"/>
  <rect x="172" y="214" width="156" height="2" fill="#cf9f5c" opacity="0.5"/>
  <rect x="172" y="332" width="156" height="5" fill="#15130f"/>
  <rect x="172" y="334" width="156" height="2" fill="#cf9f5c" opacity="0.5"/>

  <!-- ==== BAG 1 (amber, top shelf) ==== -->
  <ellipse cx="250" cy="208" rx="52" ry="7" fill="#15130f" opacity="0.4"/>
  <rect x="204" y="150" width="92" height="58" rx="8" fill="url(#bagA)"/>
  <rect x="204" y="150" width="92" height="20" rx="8" fill="#cf9f5c" opacity="0.7"/>
  <path d="M216 152 q34 -34 68 0" fill="none" stroke="#8a5a20" stroke-width="5" stroke-linecap="round"/>
  <rect x="238" y="170" width="24" height="10" rx="3" fill="#c9c5be"/>
  <rect x="204" y="182" width="92" height="3" fill="#8a5a20" opacity="0.4"/>

  <!-- ==== BAG 2 (chrome/white, middle shelf) ==== -->
  <ellipse cx="248" cy="328" rx="48" ry="7" fill="#15130f" opacity="0.4"/>
  <path d="M210 272 h76 l8 56 h-92 z" fill="url(#bagB)"/>
  <path d="M210 272 h76 l2 14 h-80 z" fill="#ffffff" opacity="0.6"/>
  <path d="M222 272 q26 -30 52 0" fill="none" stroke="#c9c5be" stroke-width="6" stroke-linecap="round"/>
  <path d="M222 272 q26 -30 52 0" fill="none" stroke="#e3e1dc" stroke-width="2" stroke-linecap="round"/>
  <rect x="240" y="296" width="18" height="8" rx="2" fill="#a5876a"/>

  <!-- ==== BAG 3 (olive, bottom shelf) ==== -->
  <ellipse cx="250" cy="436" rx="54" ry="8" fill="#15130f" opacity="0.4"/>
  <rect x="200" y="378" width="100" height="58" rx="10" fill="url(#bagC)"/>
  <rect x="200" y="378" width="100" height="18" rx="10" fill="#8a8c62"/>
  <path d="M214 380 q36 -30 72 0" fill="none" stroke="#5c4632" stroke-width="5" stroke-linecap="round"/>
  <rect x="200" y="404" width="100" height="3" fill="#5c4632" opacity="0.35"/>
  <circle cx="288" cy="416" r="5" fill="#c9c5be"/>

  <!-- glass reflection overlay on cabinet opening -->
  <rect x="172" y="92" width="156" height="348" rx="6" fill="url(#glass)"/>
  <path d="M200 96 L172 160 L172 96 Z" fill="#ffffff" opacity="0.10"/>
  <path d="M300 96 L250 440 L280 440 L328 96 Z" fill="#ffffff" opacity="0.06"/>

  <!-- cabinet feet -->
  <rect x="168" y="462" width="14" height="14" rx="3" fill="#15130f"/>
  <rect x="318" y="462" width="14" height="14" rx="3" fill="#15130f"/>

  <!-- ===== BAMBOO HOOKS ===== -->
  <!-- mounting board -->
  <rect x="470" y="150" width="230" height="30" rx="8" fill="#c8a87c"/>
  <rect x="470" y="150" width="230" height="10" rx="8" fill="#d8c19a"/>
  <rect x="470" y="174" width="230" height="4" fill="#a5876a" opacity="0.5"/>

  <!-- four bamboo hooks -->
  <g>
    <rect x="500" y="178" width="12" height="34" rx="6" fill="url(#bamboo)"/>
    <path d="M506 210 q0 20 18 20" fill="none" stroke="#cbb287" stroke-width="12" stroke-linecap="round"/>
    <path d="M506 210 q0 20 18 20" fill="none" stroke="#a5876a" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <circle cx="506" cy="186" r="4" fill="#5c4632" opacity="0.5"/>
  </g>
  <g>
    <rect x="558" y="178" width="12" height="34" rx="6" fill="url(#bamboo)"/>
    <path d="M564 210 q0 20 18 20" fill="none" stroke="#cbb287" stroke-width="12" stroke-linecap="round"/>
    <path d="M564 210 q0 20 18 20" fill="none" stroke="#a5876a" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <circle cx="564" cy="186" r="4" fill="#5c4632" opacity="0.5"/>
  </g>
  <g>
    <rect x="616" y="178" width="12" height="34" rx="6" fill="url(#bamboo)"/>
    <path d="M622 210 q0 20 18 20" fill="none" stroke="#cbb287" stroke-width="12" stroke-linecap="round"/>
    <path d="M622 210 q0 20 18 20" fill="none" stroke="#a5876a" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <circle cx="622" cy="186" r="4" fill="#5c4632" opacity="0.5"/>
  </g>
  <g>
    <rect x="674" y="178" width="12" height="34" rx="6" fill="url(#bamboo)"/>
    <path d="M680 210 q0 20 18 20" fill="none" stroke="#cbb287" stroke-width="12" stroke-linecap="round"/>
    <path d="M680 210 q0 20 18 20" fill="none" stroke="#a5876a" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <circle cx="680" cy="186" r="4" fill="#5c4632" opacity="0.5"/>
  </g>

  <!-- ===== TOTE on hooks ===== -->
  <ellipse cx="560" cy="470" rx="90" ry="16" fill="#1f1b16" opacity="0.10"/>
  <!-- straps looping over first hooks -->
  <path d="M524 218 C 520 300, 512 360, 522 400" fill="none" stroke="#a5876a" stroke-width="9" stroke-linecap="round"/>
  <path d="M582 218 C 588 300, 600 360, 606 400" fill="none" stroke="#a5876a" stroke-width="9" stroke-linecap="round"/>
  <!-- tote body -->
  <path d="M500 396 q64 -22 128 0 l10 78 q-74 20 -148 0 z" fill="url(#tote)"/>
  <path d="M500 396 q64 -22 128 0 l3 22 q-67 -18 -134 0 z" fill="#d8c19a" opacity="0.7"/>
  <!-- tote seams and pocket -->
  <rect x="524" y="426" width="80" height="42" rx="6" fill="#a5876a" opacity="0.35"/>
  <path d="M506 470 q58 14 116 0" fill="none" stroke="#5c4632" stroke-width="3" opacity="0.4"/>
  <path d="M564 400 v72" stroke="#5c4632" stroke-width="2" opacity="0.25"/>

  <!-- small graphite tag on tote -->
  <rect x="600" y="430" width="18" height="26" rx="3" fill="#3d3a36"/>
  <rect x="604" y="434" width="10" height="3" rx="1" fill="#c9c5be" opacity="0.6"/>

  <!-- subtle floor light near tote -->
  <ellipse cx="560" cy="472" rx="70" ry="10" fill="#cf9f5c" opacity="0.05"/>

  <!-- baseboard -->
  <rect x="0" y="446" width="800" height="8" fill="#e3e1dc" opacity="0.5"/>
</svg>
