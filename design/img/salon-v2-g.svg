    <line x1="140" y1="245" x2="215" y2="245" stroke="#7a7c5c" stroke-width="2" opacity="0.6"/>
    <rect x="132" y="124" width="34" height="4" rx="2" fill="#b98a4a" opacity="0.5"/>
