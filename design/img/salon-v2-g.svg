    <path d="M362 240 C360 205 395 210 392 178 C390 150 425 158 428 128" fill="none" stroke="url(#amber)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="362" cy="240" r="4" fill="#cf9f5c"/>
