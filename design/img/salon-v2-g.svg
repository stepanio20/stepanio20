  <!-- SLIM BLACK FLOOR LAMP (left of sofa) -->
  <g>
    <ellipse cx="524" cy="500" rx="34" ry="9" fill="#1f1b16" opacity="0.14"/>
    <rect x="500" y="494" width="48" height="8" rx="4" fill="#15130f"/>
