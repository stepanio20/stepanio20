      <circle cx="614" cy="420" r="3"/><circle cx="642" cy="426" r="3"/><circle cx="670" cy="420" r="3"/>
      <circle cx="698" cy="426" r="3"/><circle cx="726" cy="420" r="3"/><circle cx="754" cy="426" r="3"/>
      <circle cx="560" cy="388" r="3"/><circle cx="574" cy="410" r="3"/><circle cx="566" cy="432" r="3"/>
