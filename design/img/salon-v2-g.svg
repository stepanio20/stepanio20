  <line x1="0" y1="502" x2="800" y2="510" stroke="#a5876a" stroke-width="1.4" opacity="0.35"/>
  <line x1="0" y1="560" x2="800" y2="570" stroke="#a5876a" stroke-width="1.4" opacity="0.3"/>
