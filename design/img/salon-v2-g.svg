  <line x1="430" y1="452" x2="418" y2="510" stroke="#b89a68" stroke-width="1" opacity="0.3"/>
  <line x1="640" y1="400" x2="632" y2="452" stroke="#b89a68" stroke-width="1" opacity="0.3"/>
