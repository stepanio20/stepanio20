      <line x1="278" y1="444" x2="278" y2="476"/>
      <line x1="286" y1="444" x2="286" y2="476"/>
      <line x1="294" y1="444" x2="294" y2="476"/>
      <line x1="302" y1="444" x2="302" y2="476"/>
      <line x1="310" y1="444" x2="310" y2="476"/>
      <line x1="318" y1="444" x2="318" y2="476"/>
      <line x1="326" y1="444" x2="326" y2="476"/>
      <line x1="334" y1="444" x2="334" y2="476"/>
    </g>
    <rect x="384" y="440" width="118" height="40" rx="3" fill="#1c1a16"/>
    <rect x="392" y="448" width="102" height="24" rx="2" fill="#242220"/>
    <line x1="392" y1="460" x2="494" y2="460" stroke="#3d3a36" stroke-width="1" opacity="0.6"/>
    <!-- steel feet -->
