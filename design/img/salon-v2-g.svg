      <rect x="292" y="356" width="176" height="8" rx="4" fill="#3d3a36"/>
      <ellipse cx="368" cy="390" rx="58" ry="26" fill="url(#platter)"/>
      <ellipse cx="368" cy="390" rx="58" ry="26" fill="none" stroke="#4a4744" stroke-width="1.5"/>
      <ellipse cx="368" cy="390" rx="46" ry="20" fill="url(#vinyl)"/>
      <ellipse cx="368" cy="390" rx="40" ry="17" fill="none" stroke="#3d3a36" stroke-width="0.8" opacity="0.7"/>
      <ellipse cx="368" cy="390" rx="33" ry="14" fill="none" stroke="#3d3a36" stroke-width="0.8" opacity="0.6"/>
      <ellipse cx="368" cy="390" rx="26" ry="11" fill="none" stroke="#3d3a36" stroke-width="0.8" opacity="0.5"/>
      <ellipse cx="368" cy="390" rx="12" ry="5" fill="url(#amber)"/>
