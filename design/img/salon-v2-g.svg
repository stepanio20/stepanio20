  <rect x="90" y="52" width="620" height="3" rx="1.5" fill="#4a4744" opacity="0.7"/>
  <g>
    <rect x="176" y="62" width="8" height="18" rx="3" fill="#2a2724"/>
    <circle cx="180" cy="82" r="9" fill="#15130f"/>
