<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f7f3ec"/>
    </linearGradient>
    <linearGradient id="wallLight" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#fffdf8" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#faf7f2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="floorGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6d4b0" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#d8c19a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cabWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2724"/>
      <stop offset="0.5" stop-color="#3d3a36"/>
      <stop offset="1" stop-color="#2a2724"/>
    </linearGradient>
    <linearGradient id="cabTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a4642"/>
      <stop offset="0.5" stop-color="#3d3a36"/>
      <stop offset="1" stop-color="#2a2724"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e1dc"/>
      <stop offset="0.45" stop-color="#c9c5be"/>
      <stop offset="1" stop-color="#9a968f"/>
    </linearGradient>
    <linearGradient id="chromeRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e1dc"/>
      <stop offset="1" stop-color="#9a968f"/>
    </linearGradient>
    <radialGradient id="platter" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#4a4642"/>
      <stop offset="0.72" stop-color="#2a2724"/>
      <stop offset="1" stop-color="#15130f"/>
    </radialGradient>
    <linearGradient id="glassCab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8cdd6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a968f" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e3e1dc"/>
      <stop offset="1" stop-color="#c9c5be"/>
    </linearGradient>
    <linearGradient id="olive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8c62"/>
      <stop offset="1" stop-color="#63654a"/>
    </linearGradient>
    <linearGradient id="poster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4642"/>
      <stop offset="1" stop-color="#2a2724"/>
    </linearGradient>
    <linearGradient id="amberVase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf9f5c"/>
      <stop offset="0.55" stop-color="#b98a4a"/>
      <stop offset="1" stop-color="#8a5a20"/>
    </linearGradient>
    <linearGradient id="bookA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8c62"/>
      <stop offset="1" stop-color="#63654a"/>
    </linearGradient>
    <linearGradient id="bookB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d5138"/>
      <stop offset="1" stop-color="#4a3624"/>
    </linearGradient>
    <linearGradient id="bookC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8dcc6"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8c62"/>
      <stop offset="1" stop-color="#63654a"/>
    </linearGradient>
    <linearGradient id="railGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3a36"/>
      <stop offset="1" stop-color="#15130f"/>
    </linearGradient>
    <radialGradient id="lightPool" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#fff6e4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff6e4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- WALL -->
  <rect x="0" y="0" width="800" height="600" fill="url(#wall)"/>
  <rect x="0" y="0" width="800" height="430" fill="url(#wallLight)"/>

  <!-- FLOOR band lower third -->
  <rect x="0" y="404" width="800" height="196" fill="url(#floor)"/>
  <rect x="0" y="404" width="800" height="196" fill="url(#floorGlow)"/>
  <!-- skirting line -->
  <rect x="0" y="398" width="800" height="10" fill="#e8dcc6"/>
  <rect x="0" y="404" width="800" height="3" fill="#a5876a" opacity="0.5"/>
  <!-- plank lines -->
  <g stroke="#a5876a" stroke-width="1.4" opacity="0.35">
    <line x1="0" y1="452" x2="800" y2="452"/>
    <line x1="0" y1="506" x2="800" y2="506"/>
    <line x1="0" y1="560" x2="800" y2="560"/>
  </g>
  <g stroke="#a5876a" stroke-width="1.2" opacity="0.22">
    <line x1="150" y1="407" x2="150" y2="452"/>
    <line x1="420" y1="407" x2="420" y2="452"/>
    <line x1="640" y1="407" x2="640" y2="452"/>
    <line x1="70" y1="452" x2="70" y2="506"/>
    <line x1="330" y1="452" x2="330" y2="506"/>
    <line x1="560" y1="452" x2="560" y2="506"/>
    <line x1="240" y1="506" x2="240" y2="560"/>
    <line x1="520" y1="506" x2="520" y2="560"/>
    <line x1="700" y1="506" x2="700" y2="560"/>
  </g>

  <!-- warm side light pool -->
  <ellipse cx="250" cy="150" rx="360" ry="300" fill="url(#lightPool)"/>

  <!-- TRACK-LIGHT RAIL -->
  <rect x="120" y="52" width="560" height="12" rx="6" fill="url(#railGrad)"/>
  <g fill="#15130f">
    <rect x="200" y="64" width="14" height="20" rx="4"/>
    <rect x="393" y="64" width="14" height="20" rx="4"/>
    <rect x="586" y="64" width="14" height="20" rx="4"/>
  </g>
  <g fill="#3d3a36">
    <circle cx="207" cy="86" r="9"/>
    <circle cx="400" cy="86" r="9"/>
    <circle cx="593" cy="86" r="9"/>
  </g>
  <g fill="#cf9f5c" opacity="0.85">
    <circle cx="207" cy="88" r="4"/>
    <circle cx="400" cy="88" r="4"/>
    <circle cx="593" cy="88" r="4"/>
  </g>
  <!-- soft light cones onto posters -->
  <g fill="#fff6e4" opacity="0.25">
    <polygon points="207,92 178,150 236,150"/>
    <polygon points="400,92 371,150 429,150"/>
    <polygon points="593,92 564,150 622,150"/>
  </g>

  <!-- THREE F1 / CIRCUIT POSTERS -->
  <g>
    <!-- poster 1 -->
    <rect x="150" y="112" width="118" height="164" rx="4" fill="#15130f"/>
    <rect x="158" y="120" width="102" height="148" rx="2" fill="url(#poster)"/>
    <path d="M172 240 C 176 200 210 214 200 176 C 194 152 226 148 236 172 C 244 192 220 200 228 224 L 214 244 Z" fill="none" stroke="#cf9f5c" stroke-width="3.4" stroke-linejoin="round" opacity="0.9"/>
    <rect x="170" y="252" width="34" height="4" rx="2" fill="#8a8c62"/>
    <!-- poster 2 -->
    <rect x="343" y="112" width="118" height="164" rx="4" fill="#15130f"/>
    <rect x="351" y="120" width="102" height="148" rx="2" fill="url(#poster)"/>
    <path d="M366 250 L 388 156 L 402 210 L 420 148 L 436 250" fill="none" stroke="#b98a4a" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="402" cy="196" r="6" fill="#cf9f5c"/>
    <!-- poster 3 -->
    <rect x="536" y="112" width="118" height="164" rx="4" fill="#15130f"/>
    <rect x="544" y="120" width="102" height="148" rx="2" fill="url(#poster)"/>
    <path d="M560 244 C 600 236 566 200 604 196 C 636 192 626 158 596 160 C 574 162 588 190 560 190" fill="none" stroke="#cf9f5c" stroke-width="3.4" stroke-linejoin="round" opacity="0.9"/>
    <rect x="600" y="252" width="34" height="4" rx="2" fill="#8a8c62"/>
  </g>

  <!-- ANTHRACITE GLASS DISPLAY CABINET (right, partly in frame) -->
  <g>
    <ellipse cx="678" cy="470" rx="120" ry="20" fill="#1f1b16" opacity="0.12"/>
    <rect x="596" y="196" width="176" height="270" rx="8" fill="#2a2724"/>
    <rect x="606" y="206" width="156" height="230" rx="5" fill="url(#glassCab)"/>
    <rect x="606" y="206" width="156" height="230" rx="5" fill="url(#glassSheen)"/>
    <line x1="606" y1="322" x2="762" y2="322" stroke="#3d3a36" stroke-width="3"/>
    <rect x="596" y="436" width="176" height="30" rx="6" fill="#3d3a36"/>
    <!-- helmet white & olive -->
    <g>
      <ellipse cx="682" cy="300" rx="46" ry="8" fill="#1f1b16" opacity="0.12"/>
      <path d="M638 262 C 638 232 664 216 690 216 C 720 216 738 236 738 264 C 738 282 726 292 726 292 L 646 292 C 646 292 638 282 638 262 Z" fill="url(#helmet)"/>
      <path d="M648 254 C 648 246 660 240 678 240 L 720 240 C 726 240 730 246 730 254 L 730 266 L 648 266 Z" fill="#3d3a36"/>
      <path d="M652 258 L 726 258 L 726 264 L 652 264 Z" fill="#b8cdd6" opacity="0.7"/>
      <path d="M690 216 C 712 217 730 233 736 254 L 712 256 C 708 238 700 226 686 219 Z" fill="url(#olive)"/>
      <rect x="640" y="288" width="88" height="10" rx="4" fill="#c9c5be"/>
      <path d="M654 232 C 660 226 672 222 684 223" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>

  <!-- WHITE BOUCLE SOFA (left edge, background) -->
  <g>
    <ellipse cx="150" cy="470" rx="150" ry="22" fill="#1f1b16" opacity="0.1"/>
    <rect x="0" y="360" width="250" height="110" rx="26" fill="#f7f3ec"/>
    <rect x="0" y="336" width="250" height="60" rx="26" fill="#faf7f2"/>
    <rect x="16" y="356" width="106" height="52" rx="18" fill="#f0e9dd"/>
    <rect x="130" y="356" width="106" height="52" rx="18" fill="#f0e9dd"/>
    <g fill="#e3ddcf" opacity="0.7">
      <circle cx="40" cy="378" r="3"/><circle cx="70" cy="366" r="3"/><circle cx="100" cy="386" r="3"/>
      <circle cx="150" cy="372" r="3"/><circle cx="188" cy="384" r="3"/><circle cx="214" cy="368" r="3"/>
      <circle cx="55" cy="398" r="3"/><circle cx="170" cy="396" r="3"/>
    </g>
    <rect x="150" y="330" width="70" height="60" rx="14" fill="url(#olive)"/>
  </g>

  <!-- GRAPHITE WOOL RUG -->
  <ellipse cx="360" cy="540" rx="300" ry="46" fill="#3d3a36" opacity="0.9"/>
  <ellipse cx="360" cy="540" rx="300" ry="46" fill="none" stroke="#2a2724" stroke-width="4"/>
  <ellipse cx="360" cy="536" rx="256" ry="34" fill="none" stroke="#4a4642" stroke-width="2" opacity="0.6"/>

  <!-- SLIM BLACK FLOOR LAMP (behind cabinet, left) -->
  <g>
    <ellipse cx="300" cy="470" rx="30" ry="7" fill="#1f1b16" opacity="0.12"/>
    <rect x="296" y="150" width="6" height="320" rx="3" fill="#2a2724"/>
    <path d="M296 152 C 296 152 262 150 262 128 L 296 128 Z" fill="#3d3a36"/>
    <ellipse cx="279" cy="128" rx="20" ry="7" fill="#15130f"/>
    <ellipse cx="279" cy="126" rx="14" ry="4" fill="#cf9f5c" opacity="0.7"/>
    <rect x="284" y="466" width="30" height="8" rx="4" fill="#15130f"/>
  </g>

  <!-- SIGNATURE PIECE: LOW BLACK STEEL VINYL CABINET with TURNTABLE (center, styled close-up) -->
  <g>
    <ellipse cx="380" cy="478" rx="230" ry="26" fill="#1f1b16" opacity="0.14"/>
    <!-- cabinet body -->
    <rect x="196" y="352" width="372" height="118" rx="10" fill="url(#cabWood)"/>
    <rect x="196" y="352" width="372" height="14" rx="7" fill="url(#cabTop)"/>
    <!-- steel legs -->
    <g fill="#15130f">
      <rect x="214" y="466" width="10" height="22" rx="3"/>
      <rect x="540" y="466" width="10" height="22" rx="3"/>
    </g>
    <!-- doors / grooves -->
    <rect x="212" y="376" width="164" height="82" rx="6" fill="#2a2724"/>
    <rect x="388" y="376" width="164" height="82" rx="6" fill="#2a2724"/>
    <line x1="382" y1="376" x2="382" y2="458" stroke="#15130f" stroke-width="2"/>
    <g stroke="#4a4642" stroke-width="1.4" opacity="0.6">
      <line x1="228" y1="392" x2="360" y2="392"/>
      <line x1="228" y1="410" x2="360" y2="410"/>
      <line x1="228" y1="428" x2="360" y2="428"/>
      <line x1="404" y1="392" x2="536" y2="392"/>
      <line x1="404" y1="410" x2="536" y2="410"/>
      <line x1="404" y1="428" x2="536" y2="428"/>
    </g>
    <g fill="#c9c5be">
      <rect x="290" y="412" width="10" height="4" rx="2"/>
      <rect x="464" y="412" width="10" height="4" rx="2"/>
    </g>

    <!-- TURNTABLE on top -->
    <g>
      <rect x="368" y="316" width="176" height="42" rx="8" fill="#15130f"/>
      <rect x="368" y="316" width="176" height="10" rx="5" fill="#3d3a36"/>
      <ellipse cx="452" cy="332" rx="66" ry="14" fill="#2a2724"/>
      <ellipse cx="452" cy="330" rx="58" ry="12" fill="url(#platter)"/>
      <ellipse cx="452" cy="330" rx="40" ry="8.2" fill="none" stroke="#3d3a36" stroke-width="1" opacity="0.7"/>
      <ellipse cx="452" cy="330" rx="26" ry="5.4" fill="none" stroke="#3d3a36" stroke-width="1" opacity="0.7"/>
      <ellipse cx="452" cy="330" rx="12" ry="2.6" fill="#cf9f5c"/>
      <circle cx="452" cy="330" r="2.4" fill="#15130f"/>
      <!-- tonearm -->
      <circle cx="522" cy="336" r="5" fill="#9a968f"/>
      <line x1="522" y1="336" x2="474" y2="326" stroke="url(#chrome)" stroke-width="3" stroke-linecap="round"/>
      <rect x="470" y="322" width="8" height="7" rx="2" fill="#c9c5be"/>
      <!-- speed knob -->
      <circle cx="392" cy="342" r="6" fill="#3d3a36"/>
      <circle cx="392" cy="342" r="2.4" fill="#cf9f5c"/>
    </g>

    <!-- STYLING PROPS on cabinet top left -->
    <!-- stacked books -->
    <g>
      <rect x="214" y="336" width="118" height="10" rx="2" fill="url(#bookC)"/>
      <rect x="214" y="336" width="118" height="3" rx="1.5" fill="#f7f3ec"/>
      <rect x="220" y="324" width="106" height="12" rx="2" fill="url(#bookB)"/>
      <rect x="220" y="324" width="106" height="3" rx="1.5" fill="#6d5138"/>
      <rect x="226" y="310" width="94" height="14" rx="2" fill="url(#bookA)"/>
      <rect x="226" y="310" width="94" height="3.4" rx="1.5" fill="#8a8c62"/>
      <line x1="232" y1="317" x2="314" y2="317" stroke="#63654a" stroke-width="1.4" opacity="0.7"/>
    </g>
    <!-- amber vase with plant, on the books -->
    <g>
      <ellipse cx="266" cy="308" rx="20" ry="5" fill="#1f1b16" opacity="0.1"/>
      <path d="M250 306 C 248 286 254 272 266 272 C 278 272 284 286 282 306 C 281 314 274 316 266 316 C 258 316 251 314 250 306 Z" fill="url(#amberVase)"/>
      <path d="M252 288 C 258 284 274 284 280 288 C 278 296 254 296 252 288 Z" fill="#e8dcc6" opacity="0.35"/>
      <ellipse cx="266" cy="272" rx="14" ry="4" fill="#8a5a20"/>
      <!-- stems / leaves -->
      <g stroke="#63654a" stroke-width="2.4" fill="none" stroke-linecap="round">
        <path d="M266 272 C 258 250 244 244 240 224"/>
        <path d="M266 272 C 270 246 282 240 292 226"/>
        <path d="M266 272 C 266 250 266 240 266 218"/>
      </g>
      <path d="M240 224 C 230 216 228 202 238 200 C 244 210 246 218 240 224 Z" fill="url(#leaf)"/>
      <path d="M292 226 C 302 218 306 204 296 200 C 288 210 286 220 292 226 Z" fill="url(#leaf)"/>
      <path d="M266 218 C 258 208 258 194 268 190 C 274 200 274 212 266 218 Z" fill="#8a8c62"/>
      <path d="M266 218 C 274 210 286 208 290 214 C 282 220 272 222 266 218 Z" fill="#7a7c5c"/>
    </g>
    <!-- small objects: sphere + a short candle -->
    <g>
      <ellipse cx="360" cy="349" rx="12" ry="3.2" fill="#1f1b16" opacity="0.1"/>
      <circle cx="360" cy="340" r="11" fill="url(#chromeRim)"/>
      <ellipse cx="356" cy="336" rx="4" ry="3" fill="#ffffff" opacity="0.7"/>
    </g>
    <g>
      <rect x="342" y="330" width="12" height="18" rx="3" fill="#e8dcc6"/>
      <rect x="342" y="330" width="12" height="4" rx="2" fill="#cbb287"/>
      <line x1="348" y1="326" x2="348" y2="330" stroke="#3d3a36" stroke-width="1.6"/>
      <circle cx="348" cy="324" r="2.4" fill="#cf9f5c"/>
    </g>
  </g>

  <!-- SMALL ROBOT-VACUUM DISC on rug -->
  <g>
    <ellipse cx="150" cy="548" rx="42" ry="12" fill="#1f1b16" opacity="0.16"/>
    <ellipse cx="150" cy="540" rx="40" ry="14" fill="#2a2724"/>
    <ellipse cx="150" cy="536" rx="40" ry="14" fill="#3d3a36"/>
    <ellipse cx="150" cy="533" rx="30" ry="10" fill="#4a4642"/>
    <circle cx="150" cy="531" r="5" fill="#15130f"/>
    <circle cx="150" cy="530" r="2" fill="#cf9f5c" opacity="0.8"/>
    <path d="M120 530 A 40 14 0 0 1 180 530" fill="none" stroke="#9a968f" stroke-width="1.4" opacity="0.5"/>
  </g>

  <!-- floor warm reflection under signature piece -->
  <ellipse cx="360" cy="486" rx="150" ry="10" fill="#e6d4b0" opacity="0.3"/>
</svg>
