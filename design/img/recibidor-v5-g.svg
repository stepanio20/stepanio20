  <circle cx="245.5" cy="464" r="1.6" fill="#9a968f"/>
  <circle cx="284.5" cy="404" r="1.6" fill="#9a968f"/>
  <circle cx="284.5" cy="464" r="1.6" fill="#9a968f"/>

