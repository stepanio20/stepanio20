  <path d="M138 262 L232 262 L226 214 C226 208 220 204 214 204 L156 204 C150 204 144 208 144 214 Z" fill="url(#leather)"/>
  <path d="M138 232 L232 232 L230 262 L140 262 Z" fill="#8a5a20" opacity="0.35"/>
  <path d="M158 204 C158 188 172 182 185 182 C198 182 212 188 212 204" fill="none" stroke="#8a5a20" stroke-width="5" stroke-linecap="round"/>
  <path d="M158 204 C158 190 170 184 185 184 C200 184 212 190 212 204" fill="none" stroke="#cf9f5c" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  <rect x="178" y="228" width="14" height="10" rx="2.5" fill="url(#chromeKnob)"/>
  <path d="M144 216 L226 216" stroke="#cf9f5c" stroke-width="1.4" opacity="0.4"/>

