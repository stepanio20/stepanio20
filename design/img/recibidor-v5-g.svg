  <polygon points="540,0 762,0 486,600 262,600" fill="url(#warmBeam)" opacity="0.26" filter="url(#softlg)"/>
  <ellipse cx="400" cy="30" rx="420" ry="130" fill="#faf7f2" opacity="0.3" filter="url(#softlg)"/>

