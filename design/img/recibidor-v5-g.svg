  <rect x="242" y="398" width="7" height="72" rx="3.5" fill="url(#chrome)"/>
  <rect x="243.6" y="400" width="1.6" height="68" rx="0.8" fill="#faf7f2" opacity="0.7"/>
  <rect x="281" y="398" width="7" height="72" rx="3.5" fill="url(#chrome)"/>
