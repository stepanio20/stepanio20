  <rect x="98" y="106" width="334" height="178" rx="8" fill="url(#glass)" fill-opacity="0.34"/>
  <polygon points="120,106 170,106 96,284 96,224" fill="#ffffff" opacity="0.16"/>
  <polygon points="220,106 246,106 150,284 128,284" fill="#ffffff" opacity="0.1"/>
  <rect x="98" y="106" width="334" height="178" rx="8" fill="none" stroke="#a5876a" stroke-width="2.4" opacity="0.55"/>
  <rect x="98" y="106" width="334" height="178" rx="8" fill="none" stroke="#f0e6d2" stroke-width="1" opacity="0.3"/>

