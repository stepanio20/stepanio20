  <ellipse cx="320" cy="474" rx="180" ry="34" fill="#cf9f5c" opacity="0.12" filter="url(#softlg)"/>
  <path d="M0 430 C200 424 560 436 800 428" stroke="#a5876a" stroke-width="2" fill="none" opacity="0.28"/>
  <path d="M0 470 C220 476 540 464 800 472" stroke="#8a6a4a" stroke-width="2" fill="none" opacity="0.22"/>
  <path d="M0 510 C240 504 560 516 800 508" stroke="#a5876a" stroke-width="2" fill="none" opacity="0.26"/>
  <path d="M0 550 C220 556 560 544 800 552" stroke="#8a6a4a" stroke-width="2" fill="none" opacity="0.2"/>
  <line x1="180" y1="430" x2="180" y2="470" stroke="#8a6a4a" stroke-width="1.5" opacity="0.18"/>
  <line x1="470" y1="470" x2="470" y2="510" stroke="#8a6a4a" stroke-width="1.5" opacity="0.18"/>
  <line x1="300" y1="510" x2="300" y2="550" stroke="#8a6a4a" stroke-width="1.5" opacity="0.18"/>
  <line x1="620" y1="430" x2="620" y2="470" stroke="#8a6a4a" stroke-width="1.5" opacity="0.16"/>

  <!-- skirting where wall meets floor -->
  <rect x="0" y="390" width="800" height="12" fill="url(#oakDark)"/>
  <rect x="0" y="389" width="800" height="2.4" fill="#d8c19a" opacity="0.5"/>

  <!-- background framed circuit poster (soft focus) -->
  <g filter="url(#softsm)" opacity="0.92">
    <rect x="590" y="30" width="152" height="172" rx="6" fill="#15130f"/>
    <rect x="600" y="40" width="132" height="152" rx="3" fill="#f7f3ec"/>
    <rect x="608" y="48" width="116" height="136" rx="3" fill="#3d3a36"/>
    <path d="M624 158 C616 128 648 122 656 100 C662 82 636 72 648 58 C660 46 700 52 706 76 C712 100 686 108 692 132 C698 154 672 160 660 168 C644 178 632 176 624 158 Z" fill="none" stroke="#cf9f5c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M632 150 C626 128 652 122 658 104" fill="none" stroke="#8a8c62" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>
    <circle cx="648" cy="58" r="3.4" fill="#b98a4a"/>
  </g>

  <!-- cabinet ground shadow -->
  <ellipse cx="266" cy="552" rx="214" ry="17" fill="url(#shadowG)" filter="url(#soft)"/>

  <!-- ===== oak display cabinet ===== -->
  <rect x="70" y="80" width="390" height="466" rx="14" fill="url(#oakH)"/>
  <rect x="74" y="84" width="382" height="458" rx="11" fill="none" stroke="#e8dcc6" stroke-width="1.4" opacity="0.35"/>
  <rect x="74" y="82" width="382" height="3.2" fill="#f7f3ec" opacity="0.35"/>

  <!-- warm interior glow behind glass -->
  <ellipse cx="262" cy="150" rx="158" ry="94" fill="#cf9f5c" opacity="0.2" filter="url(#soft)"/>

  <!-- glass compartment back + shelf -->
  <rect x="98" y="106" width="334" height="178" rx="8" fill="url(#glassWarm)"/>
  <rect x="100" y="195" width="330" height="6" rx="3" fill="url(#oakDark)"/>
  <rect x="100" y="194" width="330" height="1.6" fill="#e8dcc6" opacity="0.5"/>

  <!-- helmet as art (upper shelf) -->
  <rect x="288" y="190" width="66" height="8" rx="3" fill="url(#oakDark)"/>
  <ellipse cx="322" cy="166" rx="42" ry="36" fill="url(#helmetG)"/>
  <path d="M282 168 C282 150 300 134 322 134 C344 134 362 150 362 168 C362 176 356 184 348 188 L296 188 C288 184 282 176 282 168 Z" fill="#9aa7ac" opacity="0.55"/>
  <path d="M290 172 C290 158 304 148 322 148 C332 148 342 152 348 158 L346 176 L294 176 Z" fill="#b8cdd6" opacity="0.75"/>
  <path d="M300 148 C308 142 320 140 330 142" stroke="#faf7f2" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>

