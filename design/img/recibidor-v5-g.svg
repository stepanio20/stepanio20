  <path d="M124 350 C128 400 120 450 126 508" stroke="#6d5138" stroke-width="1.2" fill="none" opacity="0.14"/>
  <path d="M152 350 C156 402 148 452 154 508" stroke="#6d5138" stroke-width="1.2" fill="none" opacity="0.12"/>
  <path d="M182 350 C186 400 178 452 184 508" stroke="#6d5138" stroke-width="1.2" fill="none" opacity="0.15"/>
  <path d="M212 350 C216 402 208 450 214 508" stroke="#6d5138" stroke-width="1.2" fill="none" opacity="0.12"/>
  <path d="M312 350 C316 400 308 450 314 508" stroke="#6d5138" stroke-width="1.2" fill="none" opacity="0.14"/>
  <path d="M342 350 C346 402 338 452 344 508" stroke="#6d5138" stroke-width="1.2" fill="none" opacity="0.12"/>
  <path d="M372 350 C376 400 368 452 374 508" stroke="#6d5138" stroke-width="1.2" fill="none" opacity="0.15"/>
  <path d="M402 350 C406 402 398 450 404 508" stroke="#6d5138" stroke-width="1.2" fill="none" opacity="0.12"/>
