  <path d="M457 92 L457 536" stroke="#f0e6d2" stroke-width="3" opacity="0.32" stroke-linecap="round"/>
  <path d="M84 90 L84 300" stroke="#8a6a4a" stroke-width="2" opacity="0.2" stroke-linecap="round"/>

  <!-- ===== rope bench (foreground right) ===== -->
  <ellipse cx="638" cy="556" rx="150" ry="14" fill="url(#shadowG)" filter="url(#soft)"/>
  <!-- legs -->
  <rect x="540" y="470" width="16" height="88" rx="6" fill="url(#oakV)"/>
  <rect x="724" y="470" width="16" height="88" rx="6" fill="url(#oakV)"/>
  <ellipse cx="548" cy="498" rx="9" ry="4" fill="#a5876a" opacity="0.6"/>
  <ellipse cx="732" cy="498" rx="9" ry="4" fill="#a5876a" opacity="0.6"/>
  <rect x="540" y="470" width="4" height="88" rx="2" fill="#e8dcc6" opacity="0.3"/>
  <rect x="724" y="470" width="4" height="88" rx="2" fill="#e8dcc6" opacity="0.3"/>
  <!-- seat frame -->
  <rect x="518" y="426" width="240" height="54" rx="11" fill="url(#oakH)"/>
  <rect x="518" y="426" width="240" height="3" rx="1.5" fill="#f0e6d2" opacity="0.4"/>
  <rect x="530" y="434" width="216" height="34" rx="8" fill="url(#oakDark)"/>
  <!-- wound rope cords -->
  <rect x="534" y="436" width="208" height="7" rx="3.5" fill="url(#ropeCord)"/>
  <rect x="534" y="444.5" width="208" height="7" rx="3.5" fill="url(#ropeCord)"/>
  <rect x="534" y="453" width="208" height="7" rx="3.5" fill="url(#ropeCord)"/>
  <rect x="534" y="461.5" width="208" height="6" rx="3" fill="url(#ropeCord)"/>
  <g stroke="#cbb287" stroke-width="1.1" opacity="0.55">
    <line x1="548" y1="437" x2="554" y2="442"/>
    <line x1="572" y1="437" x2="578" y2="442"/>
    <line x1="596" y1="437" x2="602" y2="442"/>
    <line x1="620" y1="437" x2="626" y2="442"/>
    <line x1="644" y1="437" x2="650" y2="442"/>
    <line x1="668" y1="437" x2="674" y2="442"/>
    <line x1="692" y1="437" x2="698" y2="442"/>
    <line x1="716" y1="437" x2="722" y2="442"/>
    <line x1="560" y1="454" x2="566" y2="459"/>
    <line x1="584" y1="454" x2="590" y2="459"/>
    <line x1="608" y1="454" x2="614" y2="459"/>
    <line x1="632" y1="454" x2="638" y2="459"/>
    <line x1="656" y1="454" x2="662" y2="459"/>
    <line x1="680" y1="454" x2="686" y2="459"/>
    <line x1="704" y1="454" x2="710" y2="459"/>
  </g>
  <rect x="574" y="434" width="4" height="34" rx="2" fill="#a5876a" opacity="0.35"/>
  <rect x="698" y="434" width="4" height="34" rx="2" fill="#a5876a" opacity="0.35"/>

  <!-- olive velvet cushion on bench end -->
  <ellipse cx="700" cy="430" rx="52" ry="12" fill="url(#shadowG)" opacity="0.7" filter="url(#softsm)"/>
  <rect x="654" y="398" width="94" height="34" rx="14" fill="url(#velvet)"/>
  <path d="M660 404 C680 398 722 398 742 406" stroke="#a1a37a" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
  <ellipse cx="690" cy="410" rx="30" ry="10" fill="#9a9c70" opacity="0.35"/>
  <path d="M656 424 C680 428 722 428 746 424" stroke="#4f5138" stroke-width="1.6" fill="none" opacity="0.6"/>
  <circle cx="654" cy="415" r="3.4" fill="#63654a"/>
  <circle cx="748" cy="415" r="3.4" fill="#63654a"/>

  <!-- bench rim light -->
  <path d="M519 430 C560 424 720 424 757 430" stroke="#f0e6d2" stroke-width="2" fill="none" opacity="0.3" stroke-linecap="round"/>

  <!-- floating dust in raking light -->
  <g fill="#f0e6d2" filter="url(#softsm)">
    <circle cx="330" cy="180" r="2.4" opacity="0.5"/>
    <circle cx="392" cy="250" r="1.8" opacity="0.45"/>
    <circle cx="360" cy="330" r="2.6" opacity="0.4"/>
    <circle cx="430" cy="300" r="1.6" opacity="0.5"/>
    <circle cx="300" cy="360" r="2" opacity="0.38"/>
    <circle cx="470" cy="210" r="2.2" opacity="0.42"/>
    <circle cx="510" cy="360" r="1.8" opacity="0.4"/>
  </g>

  <!-- final soft warm wash over foreground -->
  <ellipse cx="470" cy="120" rx="240" ry="150" fill="#cf9f5c" opacity="0.08" filter="url(#softlg)"/>
