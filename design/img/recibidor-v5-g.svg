  <rect x="96" y="344" width="150" height="170" rx="6" fill="url(#oakV)" stroke="#a5876a" stroke-width="1.4" opacity="0.95"/>
  <rect x="284" y="344" width="150" height="170" rx="6" fill="url(#oakV)" stroke="#a5876a" stroke-width="1.4" opacity="0.95"/>
