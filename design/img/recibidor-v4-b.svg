<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f7f3ec"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="pineTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="pineFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="pineLeg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8a87c"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="drawer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8a87c"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="cushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#e3ddcf"/>
    </linearGradient>
    <linearGradient id="cushionSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3ddcf"/>
      <stop offset="1" stop-color="#d8c19a"/>
    </linearGradient>
    <linearGradient id="chromePull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3e1dc"/>
      <stop offset="0.5" stop-color="#c9c5be"/>
      <stop offset="1" stop-color="#e3e1dc"/>
    </linearGradient>
    <radialGradient id="glassBlue" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#d3e0e6"/>
      <stop offset="1" stop-color="#b8cdd6"/>
    </radialGradient>
    <linearGradient id="jute" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#cf9f5c"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="800" height="600" fill="url(#wall)"/>
  <rect x="0" y="418" width="800" height="182" fill="url(#floor)"/>
  <rect x="0" y="414" width="800" height="8" fill="#a5876a" opacity="0.35"/>

  <!-- baseboard -->
  <rect x="0" y="400" width="800" height="18" rx="4" fill="#ffffff"/>
  <rect x="0" y="412" width="800" height="6" fill="#e3ddcf"/>

  <!-- floor plank seams -->
  <rect x="120" y="418" width="3" height="182" fill="#a5876a" opacity="0.18"/>
  <rect x="360" y="418" width="3" height="182" fill="#a5876a" opacity="0.18"/>
  <rect x="620" y="418" width="3" height="182" fill="#a5876a" opacity="0.18"/>
  <rect x="0" y="500" width="800" height="2" fill="#a5876a" opacity="0.12"/>

  <!-- wall frame accent (empty) -->
  <rect x="470" y="70" width="150" height="110" rx="8" fill="#ffffff"/>
  <rect x="482" y="82" width="126" height="86" rx="4" fill="#f7f3ec"/>
  <rect x="482" y="82" width="126" height="86" rx="4" fill="none" stroke="#cbb287" stroke-width="3"/>

  <!-- small wall hook -->
  <rect x="176" y="120" width="10" height="30" rx="4" fill="#3d3a36"/>
  <circle cx="181" cy="118" r="7" fill="#2a2724"/>

  <!-- ================= BENCH ================= -->
  <!-- bench shadow -->
  <ellipse cx="330" cy="470" rx="240" ry="26" fill="rgba(31,27,22,0.12)"/>

  <!-- bench body -->
  <rect x="150" y="300" width="360" height="150" rx="10" fill="url(#pineFront)"/>
  <!-- seat top overhang -->
  <rect x="140" y="286" width="380" height="30" rx="10" fill="url(#pineTop)"/>
  <rect x="140" y="308" width="380" height="8" fill="#a5876a" opacity="0.4"/>

  <!-- wood grain on front -->
  <path d="M180 340 q80 -8 160 0 t160 0" fill="none" stroke="#a5876a" stroke-width="2" opacity="0.25"/>
  <path d="M180 372 q90 -6 180 0 t150 0" fill="none" stroke="#a5876a" stroke-width="2" opacity="0.2"/>

  <!-- storage drawer -->
  <rect x="172" y="330" width="316" height="86" rx="8" fill="url(#drawer)"/>
  <rect x="172" y="330" width="316" height="86" rx="8" fill="none" stroke="#a5876a" stroke-width="3"/>
  <rect x="184" y="342" width="292" height="62" rx="5" fill="#c8a87c" opacity="0.55"/>
  <!-- chrome drawer pull -->
  <rect x="300" y="366" width="60" height="12" rx="6" fill="url(#chromePull)"/>
  <rect x="300" y="366" width="60" height="4" rx="2" fill="#e3e1dc"/>
  <circle cx="306" cy="372" r="3" fill="#c9c5be"/>
  <circle cx="354" cy="372" r="3" fill="#c9c5be"/>

  <!-- legs -->
  <rect x="164" y="446" width="26" height="34" rx="4" fill="url(#pineLeg)"/>
  <rect x="470" y="446" width="26" height="34" rx="4" fill="url(#pineLeg)"/>
  <rect x="164" y="446" width="8" height="34" rx="3" fill="#d8c19a" opacity="0.5"/>
  <rect x="470" y="446" width="8" height="34" rx="3" fill="#d8c19a" opacity="0.5"/>

  <!-- ================= CUSHION ================= -->
  <rect x="150" y="248" width="360" height="44" rx="18" fill="url(#cushionSide)"/>
  <rect x="150" y="240" width="360" height="30" rx="15" fill="url(#cushion)"/>
  <!-- tufting dips -->
  <ellipse cx="230" cy="255" rx="6" ry="4" fill="#d8c19a" opacity="0.5"/>
  <ellipse cx="330" cy="255" rx="6" ry="4" fill="#d8c19a" opacity="0.5"/>
  <ellipse cx="430" cy="255" rx="6" ry="4" fill="#d8c19a" opacity="0.5"/>
  <!-- piping seam -->
  <path d="M156 270 q174 -10 348 0" fill="none" stroke="#d8c19a" stroke-width="2.5" opacity="0.6"/>
  <!-- soft highlight -->
  <path d="M170 248 q160 -8 320 0" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>

  <!-- small folded throw on cushion end -->
  <rect x="392" y="232" width="104" height="42" rx="8" fill="#8a8c62"/>
  <rect x="392" y="232" width="104" height="14" rx="7" fill="#7a7c5c"/>
  <path d="M400 252 h88 M400 262 h88" stroke="#7a7c5c" stroke-width="2" opacity="0.6"/>

  <!-- glass-blue vase on bench top corner -->
  <ellipse cx="470" cy="240" rx="24" ry="6" fill="rgba(31,27,22,0.10)"/>
  <path d="M452 236 q0 -34 18 -34 q18 0 18 34 q0 6 -18 6 q-18 0 -18 -6 z" fill="url(#glassBlue)"/>
  <ellipse cx="470" cy="204" rx="16" ry="4" fill="#b8cdd6" opacity="0.8"/>
  <rect x="461" y="188" width="4" height="20" rx="2" fill="#7a7c5c"/>
  <rect x="473" y="182" width="4" height="26" rx="2" fill="#8a8c62"/>
  <circle cx="463" cy="184" r="8" fill="#8a8c62"/>
  <circle cx="475" cy="178" r="9" fill="#7a7c5c"/>
  <circle cx="482" cy="188" r="7" fill="#8a8c62"/>

  <!-- ================= JUTE DOORMAT ================= -->
  <ellipse cx="650" cy="530" rx="130" ry="30" fill="rgba(31,27,22,0.12)"/>
  <g>
    <ellipse cx="648" cy="524" rx="122" ry="40" fill="#b98a4a"/>
    <ellipse cx="648" cy="520" rx="122" ry="40" fill="url(#jute)"/>
    <ellipse cx="648" cy="520" rx="122" ry="40" fill="none" stroke="#8a5a20" stroke-width="4" opacity="0.5"/>
    <ellipse cx="648" cy="520" rx="98" ry="30" fill="none" stroke="#b98a4a" stroke-width="3" opacity="0.7"/>
    <ellipse cx="648" cy="520" rx="70" ry="21" fill="none" stroke="#8a5a20" stroke-width="2.5" opacity="0.45"/>
    <ellipse cx="648" cy="520" rx="42" ry="12" fill="none" stroke="#b98a4a" stroke-width="2.5" opacity="0.6"/>
    <!-- woven cross hatching -->
    <path d="M560 508 l176 24 M556 522 l184 -20 M580 536 l140 -32" stroke="#8a5a20" stroke-width="1.5" opacity="0.25"/>
    <!-- fringe -->
    <path d="M534 522 l-10 3 M540 534 l-10 5 M760 522 l10 3 M754 536 l10 5 M600 552 l-4 8 M690 552 l4 8 M648 558 l0 9" stroke="#8a5a20" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- foreground floor light -->
  <ellipse cx="400" cy="580" rx="360" ry="40" fill="#faf7f2" opacity="0.12"/>
</svg>
