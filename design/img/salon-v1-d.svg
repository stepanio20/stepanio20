    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8cdd6" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#b8cdd6" stop-opacity="0"/>
