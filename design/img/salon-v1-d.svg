    <line x1="150" y1="412" x2="150" y2="600"/>
    <line x1="230" y1="412" x2="230" y2="600"/>
    <line x1="310" y1="412" x2="310" y2="600"/>
    <line x1="400" y1="412" x2="400" y2="600"/>
    <line x1="490" y1="412" x2="490" y2="600"/>
    <line x1="570" y1="412" x2="570" y2="600"/>
