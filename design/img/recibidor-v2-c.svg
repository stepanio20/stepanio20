<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f7f3ec"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="cabBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbb287"/>
      <stop offset="0.5" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="cabTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0cba6"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="doorL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d3bc95"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="doorR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8a87c"/>
      <stop offset="1" stop-color="#bfa074"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e1dc"/>
      <stop offset="0.5" stop-color="#c9c5be"/>
      <stop offset="1" stop-color="#e3e1dc"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf9f5c"/>
      <stop offset="1" stop-color="#b98a4a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cddbe1"/>
      <stop offset="1" stop-color="#b8cdd6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d5138"/>
      <stop offset="1" stop-color="#5c4632"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="600" fill="url(#wall)"/>
  <rect x="0" y="430" width="800" height="170" fill="url(#floor)"/>
  <rect x="0" y="428" width="800" height="6" fill="#a5876a" opacity="0.5"/>
  <rect x="0" y="0" width="800" height="600" fill="url(#glow)"/>

  <!-- wall trim / hint of framed art edge -->
  <rect x="70" y="60" width="150" height="120" rx="8" fill="#ffffff" opacity="0.85"/>
  <rect x="82" y="72" width="126" height="96" rx="4" fill="#eef0e6"/>
  <rect x="82" y="72" width="126" height="96" rx="4" fill="none" stroke="#8a8c62" stroke-width="3" opacity="0.5"/>
  <rect x="118" y="96" width="54" height="48" rx="4" fill="#7a7c5c" opacity="0.7"/>

  <!-- floor shadow under cabinet -->
  <ellipse cx="440" cy="510" rx="290" ry="34" fill="rgba(31,27,22,0.12)"/>

  <!-- ===== CABINET ===== -->
  <!-- legs -->
  <rect x="240" y="470" width="20" height="46" rx="5" fill="url(#leg)"/>
  <rect x="620" y="470" width="20" height="46" rx="5" fill="url(#leg)"/>
  <rect x="256" y="472" width="6" height="42" rx="3" fill="#a5876a" opacity="0.4"/>
  <rect x="636" y="472" width="6" height="42" rx="3" fill="#a5876a" opacity="0.4"/>

  <!-- body -->
  <rect x="222" y="250" width="436" height="228" rx="12" fill="url(#cabBody)"/>
  <!-- side shade -->
  <rect x="612" y="256" width="40" height="216" rx="10" fill="#bfa074" opacity="0.55"/>

  <!-- top slab -->
  <rect x="210" y="234" width="460" height="30" rx="10" fill="url(#cabTop)"/>
  <rect x="210" y="256" width="460" height="8" rx="4" fill="#a5876a" opacity="0.4"/>

  <!-- doors -->
  <rect x="238" y="270" width="196" height="190" rx="8" fill="url(#doorL)"/>
  <rect x="446" y="270" width="196" height="190" rx="8" fill="url(#doorR)"/>
  <!-- door inset panels -->
  <rect x="256" y="288" width="160" height="154" rx="6" fill="none" stroke="#a5876a" stroke-width="3" opacity="0.45"/>
  <rect x="464" y="288" width="160" height="154" rx="6" fill="none" stroke="#a5876a" stroke-width="3" opacity="0.45"/>
  <!-- subtle grain -->
  <rect x="272" y="300" width="128" height="4" rx="2" fill="#c8a87c" opacity="0.5"/>
  <rect x="272" y="336" width="128" height="4" rx="2" fill="#c8a87c" opacity="0.4"/>
  <rect x="272" y="372" width="128" height="4" rx="2" fill="#c8a87c" opacity="0.5"/>
  <rect x="272" y="408" width="128" height="4" rx="2" fill="#c8a87c" opacity="0.35"/>
  <rect x="480" y="300" width="128" height="4" rx="2" fill="#b89a6e" opacity="0.5"/>
  <rect x="480" y="336" width="128" height="4" rx="2" fill="#b89a6e" opacity="0.4"/>
  <rect x="480" y="372" width="128" height="4" rx="2" fill="#b89a6e" opacity="0.5"/>
  <rect x="480" y="408" width="128" height="4" rx="2" fill="#b89a6e" opacity="0.35"/>

  <!-- door seam -->
  <rect x="438" y="272" width="6" height="186" rx="3" fill="#a5876a" opacity="0.45"/>

  <!-- chrome handles -->
  <rect x="416" y="344" width="10" height="42" rx="5" fill="url(#chrome)"/>
  <rect x="454" y="344" width="10" height="42" rx="5" fill="url(#chrome)"/>
  <rect x="418" y="348" width="3" height="34" rx="1.5" fill="#ffffff" opacity="0.6"/>
  <rect x="456" y="348" width="3" height="34" rx="1.5" fill="#ffffff" opacity="0.6"/>

  <!-- ===== ITEMS ON TOP ===== -->
  <!-- soft shadow on slab -->
  <ellipse cx="300" cy="236" rx="80" ry="10" fill="rgba(31,27,22,0.12)"/>
  <ellipse cx="540" cy="236" rx="70" ry="9" fill="rgba(31,27,22,0.12)"/>

  <!-- folded items (stack of towels/linens) -->
  <rect x="228" y="204" width="150" height="30" rx="8" fill="#ffffff"/>
  <rect x="228" y="206" width="150" height="14" rx="7" fill="#f7f3ec"/>
  <rect x="236" y="180" width="134" height="28" rx="8" fill="#e3e1dc"/>
  <rect x="236" y="182" width="134" height="12" rx="6" fill="#f0eee9"/>
  <rect x="244" y="158" width="118" height="26" rx="8" fill="#c9c5be"/>
  <rect x="244" y="160" width="118" height="10" rx="5" fill="#d6d3cd"/>
  <!-- fold lines -->
  <rect x="300" y="210" width="4" height="20" rx="2" fill="#d8c19a" opacity="0.4"/>
  <rect x="300" y="186" width="4" height="18" rx="2" fill="#c9c5be" opacity="0.5"/>
  <!-- thin olive ribbon accent -->
  <rect x="228" y="222" width="150" height="6" rx="3" fill="#8a8c62" opacity="0.7"/>

  <!-- ===== SMALL PLANT ===== -->
  <!-- pot -->
  <path d="M 500 236 L 580 236 L 572 196 L 508 196 Z" fill="url(#pot)"/>
  <rect x="502" y="184" width="76" height="16" rx="6" fill="#cf9f5c"/>
  <rect x="502" y="184" width="76" height="7" rx="3" fill="#dbb078"/>
  <path d="M 508 196 L 512 226 L 520 226 L 516 196 Z" fill="#8a5a20" opacity="0.35"/>

  <!-- foliage -->
  <ellipse cx="540" cy="170" rx="52" ry="26" fill="#7a7c5c" opacity="0.25"/>
  <path d="M 540 188 Q 500 150 512 108 Q 528 148 540 188 Z" fill="#7a7c5c"/>
  <path d="M 540 188 Q 512 140 540 96 Q 552 148 540 188 Z" fill="#8a8c62"/>
  <path d="M 540 188 Q 578 148 570 106 Q 550 150 540 188 Z" fill="#7a7c5c"/>
  <path d="M 540 186 Q 520 156 528 122 Q 540 152 540 186 Z" fill="#8a8c62" opacity="0.8"/>
  <path d="M 540 186 Q 560 152 556 120 Q 542 154 540 186 Z" fill="#7a7c5c" opacity="0.9"/>
  <!-- leaf highlights -->
  <path d="M 524 150 Q 526 128 534 112" fill="none" stroke="#a8aa80" stroke-width="2.5" opacity="0.6" stroke-linecap="round"/>
  <path d="M 556 148 Q 556 126 550 112" fill="none" stroke="#a8aa80" stroke-width="2.5" opacity="0.6" stroke-linecap="round"/>

  <!-- small chrome/glass vase detail on right corner of top -->
  <path d="M 600 234 L 632 234 L 628 204 Q 640 190 616 186 Q 592 190 604 204 Z" fill="url(#glass)" opacity="0.9"/>
  <path d="M 606 232 L 610 210" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  <path d="M 616 188 Q 616 170 622 156" fill="none" stroke="#8a8c62" stroke-width="3" opacity="0.8" stroke-linecap="round"/>
  <ellipse cx="622" cy="152" rx="10" ry="7" fill="#8a8c62"/>
  <ellipse cx="612" cy="162" rx="8" ry="6" fill="#7a7c5c"/>

  <!-- warm light streak on wall -->
  <rect x="690" y="90" width="60" height="300" rx="30" fill="#ffffff" opacity="0.18"/>
</svg>
