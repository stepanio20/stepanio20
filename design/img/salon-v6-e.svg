  <path d="M584 220 q-6 -46 18 -70 q22 -22 14 -46 q18 20 4 50 q-10 22 -6 66 Z" fill="#7a7c5c"/>
  <path d="M628 240 q20 -30 8 -64 q-8 -24 12 -44 q6 26 -2 48 q-10 30 6 60 Z" fill="#8a8c62"/>
  <circle cx="642" cy="120" r="15" fill="#cf9f5c" opacity="0.85"/>
  <path d="M598 150 q18 -8 30 6 q-16 14 -30 -6 Z" fill="#63654a"/>

