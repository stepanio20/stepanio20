    <circle cx="640" cy="330" r="2.5"/><circle cx="665" cy="345" r="2.5"/><circle cx="700" cy="335" r="2.5"/>
    <circle cx="510" cy="392" r="2.5"/><circle cx="560" cy="400" r="2.5"/><circle cx="660" cy="392" r="2.5"/><circle cx="710" cy="400" r="2.5"/>
