  <ellipse cx="298" cy="548" rx="70" ry="18" fill="#1f1b16" opacity="0.12"/>
  <ellipse cx="298" cy="512" rx="66" ry="40" fill="url(#pouf)"/>
  <ellipse cx="298" cy="506" rx="66" ry="34" fill="#8a8c62"/>
  <g stroke="#63654a" stroke-width="1.6" opacity="0.6" fill="none">
