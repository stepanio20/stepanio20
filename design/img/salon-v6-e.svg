      <stop offset="0.32" stop-color="#e3e1dc"/>
      <stop offset="0.62" stop-color="#c9c5be"/>
      <stop offset="0.86" stop-color="#9a968f"/>
      <stop offset="1" stop-color="#3d3a36"/>
