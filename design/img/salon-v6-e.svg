    <path d="M264 480 q6 30 4 54"/>
    <path d="M332 480 q-6 30 -4 54"/>
    <path d="M240 498 q28 -12 58 -12 q30 0 58 12"/>
  </g>
  <ellipse cx="298" cy="490" rx="18" ry="9" fill="#9a9c70" opacity="0.6"/>
  <circle cx="298" cy="504" r="5" fill="#63654a"/>

  <!-- gentle evening reflections on floor -->
  <ellipse cx="158" cy="475" rx="40" ry="8" fill="#cf9f5c" opacity="0.18"/>
  <ellipse cx="404" cy="512" rx="46" ry="7" fill="#f0d493" opacity="0.14"/>

