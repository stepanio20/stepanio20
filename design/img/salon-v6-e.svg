    <line x1="185" y1="404" x2="168" y2="600"/>
    <line x1="300" y1="404" x2="296" y2="600"/>
    <line x1="415" y1="404" x2="424" y2="600"/>
    <line x1="530" y1="404" x2="552" y2="600"/>
    <line x1="645" y1="404" x2="680" y2="600"/>
    <line x1="760" y1="404" x2="808" y2="600"/>
