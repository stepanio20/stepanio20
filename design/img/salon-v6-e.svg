  <ellipse cx="600" cy="500" rx="165" ry="30" fill="#1f1b16" opacity="0.12"/>
  <ellipse cx="300" cy="545" rx="72" ry="18" fill="#1f1b16" opacity="0.12"/>
  <ellipse cx="440" cy="512" rx="58" ry="16" fill="#1f1b16" opacity="0.12"/>

