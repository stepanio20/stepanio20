    <rect x="640" y="322" width="70" height="66" rx="16" fill="url(#cushion)" transform="rotate(7 675 355)"/>
    <path d="M535 330 q0 24 0 44" stroke="#4f5138" stroke-width="1.5" opacity="0.5"/>
    <path d="M675 330 q0 24 0 44" stroke="#4f5138" stroke-width="1.5" opacity="0.5"/>
  </g>
  <!-- sofa legs -->
  <g fill="#4a3624">
    <rect x="460" y="450" width="10" height="20" rx="3"/>
    <rect x="742" y="450" width="10" height="20" rx="3"/>
  </g>

  <!-- ===== CHROME DRUM SIDE TABLE ===== -->
  <ellipse cx="440" cy="512" rx="52" ry="14" fill="#1f1b16" opacity="0.10"/>
  <rect x="398" y="438" width="84" height="72" rx="6" fill="url(#chromeCyl)"/>
  <ellipse cx="440" cy="438" rx="42" ry="12" fill="#e8e6e1"/>
  <ellipse cx="440" cy="438" rx="42" ry="12" fill="none" stroke="#9a968f" stroke-width="1.5"/>
  <ellipse cx="440" cy="510" rx="42" ry="11" fill="#8f8b84"/>
  <rect x="422" y="440" width="6" height="68" fill="#f4f2ee" opacity="0.6"/>
