<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f7f3ec"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="oakBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="0.55" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="oakDoor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="oakTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0cba6"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a968f"/>
      <stop offset="0.5" stop-color="#e3e1dc"/>
      <stop offset="1" stop-color="#c9c5be"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8cdd6" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#e3e1dc" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b8cdd6" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="velvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8c62"/>
      <stop offset="0.6" stop-color="#7a7c5c"/>
      <stop offset="1" stop-color="#63654a"/>
    </linearGradient>
    <linearGradient id="linen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3a36"/>
      <stop offset="1" stop-color="#2a2724"/>
    </linearGradient>
    <linearGradient id="boucle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f7f3ec"/>
      <stop offset="1" stop-color="#e8dcc6"/>
    </linearGradient>
    <linearGradient id="boucleArm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8dcc6"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8dcc6"/>
      <stop offset="1" stop-color="#d8c19a"/>
    </linearGradient>
    <radialGradient id="ricePaper" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="0.6" stop-color="#e8dcc6"/>
      <stop offset="1" stop-color="#cf9f5c"/>
    </radialGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3a36"/>
      <stop offset="1" stop-color="#15130f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2724"/>
      <stop offset="1" stop-color="#15130f"/>
    </linearGradient>
    <linearGradient id="helmetA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf9f5c"/>
      <stop offset="0.6" stop-color="#b98a4a"/>
      <stop offset="1" stop-color="#8a5a20"/>
    </linearGradient>
    <linearGradient id="helmetB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8cdd6"/>
      <stop offset="0.6" stop-color="#9a968f"/>
      <stop offset="1" stop-color="#63654a"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d5138"/>
      <stop offset="1" stop-color="#4a3624"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8c62"/>
      <stop offset="1" stop-color="#63654a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cf9f5c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#cf9f5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8dcc6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#e8dcc6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8dcc6"/>
      <stop offset="1" stop-color="#d8c19a"/>
    </linearGradient>
  </defs>

  <!-- ROOM SHELL -->
  <rect x="0" y="0" width="800" height="405" fill="url(#wall)"/>
  <rect x="0" y="405" width="800" height="195" fill="url(#floor)"/>
  <!-- warm ambient light wash -->
  <ellipse cx="300" cy="120" rx="360" ry="220" fill="url(#glowWarm)" opacity="0.5"/>
  <!-- skirting -->
  <rect x="0" y="397" width="800" height="12" fill="#a5876a"/>
  <rect x="0" y="397" width="800" height="3" fill="#cbb287"/>
  <!-- floor plank seams -->
  <g stroke="#a5876a" stroke-width="1.4" opacity="0.35">
    <line x1="90" y1="409" x2="70" y2="600"/>
    <line x1="220" y1="409" x2="210" y2="600"/>
    <line x1="350" y1="409" x2="350" y2="600"/>
    <line x1="480" y1="409" x2="492" y2="600"/>
    <line x1="610" y1="409" x2="632" y2="600"/>
    <line x1="730" y1="409" x2="762" y2="600"/>
  </g>
  <g stroke="#b89a72" stroke-width="1" opacity="0.3">
    <line x1="0" y1="470" x2="800" y2="470"/>
    <line x1="0" y1="540" x2="800" y2="540"/>
  </g>

  <!-- ABSTRACT WALL ART (no text) -->
  <g>
    <rect x="120" y="90" width="90" height="120" rx="6" fill="#faf7f2" stroke="#cbb287" stroke-width="4"/>
    <circle cx="165" cy="135" r="24" fill="#8a8c62" opacity="0.85"/>
    <rect x="138" y="165" width="54" height="30" rx="4" fill="#cf9f5c" opacity="0.7"/>
    <rect x="235" y="105" width="80" height="95" rx="6" fill="#faf7f2" stroke="#cbb287" stroke-width="4"/>
    <path d="M248 185 Q275 120 305 185 Z" fill="#7a7c5c" opacity="0.8"/>
    <circle cx="275" cy="130" r="10" fill="#b98a4a"/>
  </g>

  <!-- PENDANT GLOWS on wall -->
  <ellipse cx="330" cy="160" rx="95" ry="95" fill="url(#glowA)"/>
  <ellipse cx="560" cy="150" rx="60" ry="60" fill="url(#glowA)" opacity="0.8"/>

  <!-- FLOOR SHADOWS -->
  <ellipse cx="230" cy="512" rx="215" ry="34" fill="#1f1b16" opacity="0.12"/>
  <ellipse cx="415" cy="470" rx="150" ry="24" fill="#1f1b16" opacity="0.12"/>
  <ellipse cx="655" cy="470" rx="110" ry="22" fill="#1f1b16" opacity="0.12"/>
  <ellipse cx="735" cy="560" rx="70" ry="20" fill="#1f1b16" opacity="0.12"/>

  <!-- WOOL RUG -->
  <ellipse cx="360" cy="530" rx="360" ry="72" fill="url(#rug)"/>
  <ellipse cx="360" cy="528" rx="315" ry="60" fill="none" stroke="#cbb287" stroke-width="3" opacity="0.6"/>
  <ellipse cx="360" cy="527" rx="255" ry="46" fill="none" stroke="#faf7f2" stroke-width="2" opacity="0.5"/>

  <!-- ============ TALL OAK CABINET (right, back) ============ -->
  <g>
    <!-- steel legs -->
    <rect x="600" y="392" width="9" height="22" rx="3" fill="#2a2724"/>
    <rect x="710" y="392" width="9" height="22" rx="3" fill="#2a2724"/>
    <!-- body -->
    <rect x="585" y="150" width="150" height="248" rx="10" fill="url(#oakBody)"/>
    <rect x="585" y="150" width="150" height="14" rx="7" fill="url(#oakTop)"/>
    <!-- upper glass door frame -->
    <rect x="596" y="170" width="128" height="128" rx="6" fill="#2a2724"/>
    <rect x="601" y="175" width="55" height="118" rx="4" fill="url(#glass)"/>
    <rect x="663" y="175" width="55" height="118" rx="4" fill="url(#glass)"/>
    <line x1="659.5" y1="175" x2="659.5" y2="293" stroke="#15130f" stroke-width="3"/>
    <!-- glass highlights -->
    <path d="M606 180 L624 180 L611 289 L602 289 Z" fill="#ffffff" opacity="0.18"/>
    <path d="M668 180 L682 180 L671 289 L666 289 Z" fill="#ffffff" opacity="0.16"/>
    <!-- inner shelf + helmet glow -->
    <rect x="601" y="255" width="117" height="5" rx="2" fill="#a5876a"/>
    <ellipse cx="632" cy="235" rx="34" ry="30" fill="url(#glowA)" opacity="0.7"/>
    <ellipse cx="688" cy="235" rx="30" ry="26" fill="url(#glowA)" opacity="0.6"/>
    <!-- helmet A (amber) -->
    <path d="M614 250 A20 20 0 0 1 654 250 L654 253 L614 253 Z" fill="url(#helmetA)"/>
    <ellipse cx="634" cy="230" rx="20" ry="19" fill="url(#helmetA)"/>
    <path d="M619 226 Q634 214 649 226 L649 234 L619 234 Z" fill="#b8cdd6" opacity="0.85"/>
    <path d="M619 226 Q634 214 649 226" fill="none" stroke="#e3e1dc" stroke-width="1.5"/>
    <ellipse cx="627" cy="222" rx="5" ry="7" fill="#ffffff" opacity="0.4"/>
    <!-- helmet B (glass-blue) -->
    <path d="M672 250 A18 18 0 0 1 708 250 L708 253 L672 253 Z" fill="url(#helmetB)"/>
    <ellipse cx="690" cy="232" rx="18" ry="17" fill="url(#helmetB)"/>
    <path d="M676 229 Q690 218 704 229 L704 236 L676 236 Z" fill="#3d3a36" opacity="0.85"/>
    <path d="M676 229 Q690 218 704 229" fill="none" stroke="#c9c5be" stroke-width="1.5"/>
    <ellipse cx="684" cy="225" rx="4" ry="6" fill="#ffffff" opacity="0.4"/>
    <!-- lower doors -->
    <rect x="596" y="306" width="128" height="84" rx="6" fill="url(#oakDoor)"/>
    <line x1="660" y1="310" x2="660" y2="386" stroke="#a5876a" stroke-width="2"/>
    <circle cx="650" cy="348" r="4" fill="url(#chrome)"/>
    <circle cx="670" cy="348" r="4" fill="url(#chrome)"/>
    <rect x="602" y="312" width="52" height="72" rx="4" fill="none" stroke="#b89a72" stroke-width="1.5" opacity="0.5"/>
    <rect x="666" y="312" width="52" height="72" rx="4" fill="none" stroke="#b89a72" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- ============ TV CONSOLE (center, oak + black steel) ============ -->
  <g>
    <!-- TV -->
    <rect x="332" y="205" width="176" height="108" rx="6" fill="#15130f"/>
    <rect x="338" y="211" width="164" height="96" rx="3" fill="url(#screen)"/>
    <path d="M346 214 L392 214 L360 300 L342 300 Z" fill="#3d3a36" opacity="0.5"/>
    <rect x="414" y="313" width="12" height="16" fill="#2a2724"/>
    <rect x="398" y="327" width="44" height="6" rx="3" fill="#2a2724"/>
    <!-- console body -->
    <rect x="300" y="333" width="240" height="60" rx="8" fill="url(#oakBody)"/>
    <rect x="300" y="333" width="240" height="10" rx="5" fill="url(#oakTop)"/>
    <!-- drawers -->
    <rect x="312" y="349" width="104" height="36" rx="4" fill="url(#oakDoor)"/>
    <rect x="424" y="349" width="104" height="36" rx="4" fill="url(#oakDoor)"/>
    <rect x="340" y="365" width="48" height="5" rx="2.5" fill="url(#chrome)"/>
    <rect x="452" y="365" width="48" height="5" rx="2.5" fill="url(#chrome)"/>
    <!-- black steel splayed legs -->
    <rect x="312" y="391" width="7" height="20" rx="2" fill="#2a2724" transform="rotate(9 315 401)"/>
    <rect x="521" y="391" width="7" height="20" rx="2" fill="#2a2724" transform="rotate(-9 524 401)"/>
    <!-- decor: small warm accent objects -->
    <rect x="356" y="315" width="10" height="18" rx="3" fill="#8a8c62"/>
    <ellipse cx="482" cy="326" rx="14" ry="8" fill="#cf9f5c"/>
    <rect x="476" y="312" width="12" height="16" rx="4" fill="#b98a4a"/>
  </g>

  <!-- ============ PENDANTS ============ -->
  <!-- rice-paper globe -->
  <line x1="330" y1="0" x2="330" y2="118" stroke="#3d3a36" stroke-width="2.5"/>
  <ellipse cx="330" cy="160" rx="46" ry="46" fill="url(#ricePaper)"/>
  <ellipse cx="330" cy="160" rx="46" ry="46" fill="none" stroke="#cbb287" stroke-width="1.5" opacity="0.6"/>
  <path d="M290 148 A46 46 0 0 0 292 182" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.4"/>
  <line x1="288" y1="160" x2="372" y2="160" stroke="#cf9f5c" stroke-width="0.8" opacity="0.5"/>
  <!-- black dome pendant -->
  <line x1="560" y1="0" x2="560" y2="112" stroke="#2a2724" stroke-width="2.5"/>
  <path d="M524 148 A36 30 0 0 1 596 148 Z" fill="url(#dome)"/>
  <rect x="548" y="146" width="24" height="6" rx="3" fill="#15130f"/>
  <ellipse cx="560" cy="150" rx="18" ry="4" fill="#cf9f5c" opacity="0.8"/>
  <path d="M534 138 A36 30 0 0 1 552 122" fill="none" stroke="#9a968f" stroke-width="3" opacity="0.4"/>

  <!-- ============ FLOOR PLANT (right foreground) ============ -->
  <g>
    <ellipse cx="735" cy="565" rx="60" ry="16" fill="#1f1b16" opacity="0.1"/>
    <!-- leaves (snake-plant blades) -->
    <path d="M735 540 Q702 400 712 250 Q726 400 738 540 Z" fill="url(#leaf)"/>
    <path d="M735 540 Q760 410 780 300 Q766 430 745 540 Z" fill="#7a7c5c"/>
    <path d="M735 540 Q724 420 730 320 Q744 430 745 540 Z" fill="#8a8c62"/>
    <path d="M735 540 Q690 440 668 360 Q712 450 728 540 Z" fill="#63654a"/>
    <path d="M712 250 Q715 340 730 430" fill="none" stroke="#63654a" stroke-width="1.5" opacity="0.6"/>
    <path d="M780 300 Q760 400 745 470" fill="none" stroke="#4a3624" stroke-width="1.5" opacity="0.4"/>
    <!-- pot -->
    <path d="M702 538 L768 538 L760 592 Q735 600 710 592 Z" fill="url(#pot)"/>
    <ellipse cx="735" cy="538" rx="33" ry="9" fill="#7a5a3c"/>
    <path d="M708 552 L762 552" stroke="#4a3624" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- ============ WHITE BOUCLE SOFA (left foreground) ============ -->
  <g>
    <!-- soft contact shadow -->
    <ellipse cx="225" cy="516" rx="205" ry="26" fill="#1f1b16" opacity="0.1"/>
    <!-- backrest -->
    <rect x="70" y="352" width="310" height="86" rx="26" fill="url(#boucle)"/>
    <!-- back cushion tufts -->
    <path d="M110 360 Q108 400 112 432" stroke="#e8dcc6" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M180 358 Q178 398 182 432" stroke="#e8dcc6" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M250 358 Q248 398 252 432" stroke="#e8dcc6" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M320 360 Q318 400 322 432" stroke="#e8dcc6" stroke-width="2" fill="none" opacity="0.7"/>
    <!-- seat base -->
    <rect x="66" y="418" width="322" height="70" rx="22" fill="url(#boucle)"/>
    <rect x="66" y="418" width="322" height="20" rx="12" fill="#ffffff" opacity="0.6"/>
    <!-- arms -->
    <rect x="58" y="378" width="52" height="112" rx="24" fill="url(#boucleArm)"/>
    <rect x="344" y="378" width="52" height="112" rx="24" fill="url(#boucleArm)"/>
    <ellipse cx="84" cy="392" rx="20" ry="14" fill="#ffffff" opacity="0.55"/>
    <ellipse cx="370" cy="392" rx="20" ry="14" fill="#ffffff" opacity="0.5"/>
    <!-- oak legs -->
    <rect x="90" y="485" width="12" height="22" rx="4" fill="#a5876a"/>
    <rect x="352" y="485" width="12" height="22" rx="4" fill="#a5876a"/>

    <!-- CUSHIONS -->
    <!-- olive velvet -->
    <g transform="rotate(-8 158 405)">
      <rect x="120" y="368" width="76" height="76" rx="14" fill="url(#velvet)"/>
      <path d="M158 372 L158 440" stroke="#63654a" stroke-width="2" opacity="0.6"/>
      <ellipse cx="140" cy="388" rx="16" ry="10" fill="#8a8c62" opacity="0.7"/>
    </g>
    <!-- graphite linen -->
    <g transform="rotate(7 250 406)">
      <rect x="212" y="370" width="74" height="74" rx="12" fill="url(#linen)"/>
      <path d="M218 376 L280 438" stroke="#2a2724" stroke-width="1.5" opacity="0.7"/>
      <path d="M280 376 L218 438" stroke="#2a2724" stroke-width="1.5" opacity="0.5"/>
      <ellipse cx="232" cy="388" rx="14" ry="9" fill="#4a3f38" opacity="0.6"/>
    </g>
    <!-- small olive accent cushion -->
    <g transform="rotate(4 320 410)">
      <rect x="296" y="382" width="52" height="52" rx="12" fill="#7a7c5c"/>
      <ellipse cx="308" cy="396" rx="10" ry="7" fill="#8a8c62" opacity="0.7"/>
    </g>

    <!-- DRAPED SAND THROW over right seat/arm -->
    <path d="M300 430 Q345 420 386 430 L392 478 Q360 500 330 486 Q312 470 300 486 Z" fill="url(#sand)"/>
    <path d="M312 438 Q345 430 380 440" stroke="#d8c19a" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M320 458 Q350 452 378 462" stroke="#d8c19a" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M392 478 Q388 494 372 498" stroke="#cbb287" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- small ceramic side accent between console and cabinet -->
  <g>
    <ellipse cx="560" cy="450" rx="26" ry="8" fill="#1f1b16" opacity="0.1"/>
    <path d="M544 452 L576 452 L570 408 Q560 402 550 408 Z" fill="#8a8c62"/>
    <ellipse cx="560" cy="408" rx="10" ry="4" fill="#63654a"/>
    <path d="M556 402 Q560 386 566 400" fill="none" stroke="#7a7c5c" stroke-width="4"/>
  </g>
</svg>
