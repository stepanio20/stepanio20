<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f7f3ec"/>
    </linearGradient>
    <radialGradient id="wallGlow" cx="0.32" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#faf5ea"/>
      <stop offset="1" stop-color="#faf5ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="globe" cx="0.38" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#fdf6e6"/>
      <stop offset="0.55" stop-color="#f4e6c6"/>
      <stop offset="1" stop-color="#e6d0a4"/>
    </radialGradient>
    <radialGradient id="globeHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7e7bf" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#f2ddab" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f2ddab" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="oakDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e1dc"/>
      <stop offset="0.5" stop-color="#c9c5be"/>
      <stop offset="1" stop-color="#e3e1dc"/>
    </linearGradient>
    <linearGradient id="poster" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f0e6d4"/>
    </linearGradient>
    <linearGradient id="vase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c5be"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
  </defs>

  <!-- wall -->
  <rect x="0" y="0" width="800" height="600" fill="url(#wall)"/>
  <rect x="0" y="0" width="800" height="470" fill="url(#wallGlow)"/>

  <!-- oak floor / surface below -->
  <rect x="0" y="470" width="800" height="130" fill="url(#oak)"/>
  <rect x="0" y="470" width="800" height="10" fill="#a5876a" opacity="0.5"/>
  <g stroke="#a5876a" stroke-width="1.4" opacity="0.4">
    <line x1="0" y1="508" x2="800" y2="508"/>
    <line x1="0" y1="548" x2="800" y2="548"/>
    <line x1="220" y1="480" x2="220" y2="508"/>
    <line x1="470" y1="480" x2="470" y2="508"/>
    <line x1="640" y1="480" x2="640" y2="508"/>
    <line x1="120" y1="508" x2="120" y2="548"/>
    <line x1="360" y1="508" x2="360" y2="548"/>
    <line x1="580" y1="508" x2="580" y2="548"/>
    <line x1="300" y1="548" x2="300" y2="600"/>
    <line x1="540" y1="548" x2="540" y2="600"/>
  </g>

  <!-- ===== framed poster (right) ===== -->
  <ellipse cx="600" cy="474" rx="150" ry="12" fill="#1f1b16" opacity="0.10"/>
  <!-- thin black frame -->
  <rect x="500" y="150" width="200" height="270" rx="4" fill="#15130f"/>
  <rect x="507" y="157" width="186" height="256" rx="2" fill="#2a2724"/>
  <rect x="514" y="164" width="172" height="242" rx="1" fill="url(#poster)"/>
  <!-- sand-tone abstract composition -->
  <clipPath id="posterClip"><rect x="514" y="164" width="172" height="242" rx="1"/></clipPath>
  <g clip-path="url(#posterClip)">
    <rect x="514" y="164" width="172" height="242" fill="#f2e7d2"/>
    <path d="M514 320 Q600 270 686 315 L686 406 L514 406 Z" fill="#cbb287"/>
    <path d="M514 350 Q600 315 686 352 L686 406 L514 406 Z" fill="#b98a4a"/>
    <circle cx="600" cy="238" r="42" fill="#cf9f5c"/>
    <path d="M558 238 a42 42 0 0 1 84 0 Z" fill="#8a5a20" opacity="0.55"/>
    <rect x="514" y="300" width="172" height="4" fill="#8a5a20" opacity="0.5"/>
    <path d="M540 164 L540 300 M660 164 L660 300" stroke="#d8c19a" stroke-width="6" opacity="0.4"/>
  </g>

  <!-- ===== pendant cord + globe (left) ===== -->
  <rect x="272" y="0" width="4" height="150" fill="#3d3a36"/>
  <rect x="266" y="146" width="16" height="12" rx="3" fill="url(#chrome)"/>
  <rect x="268" y="156" width="12" height="6" rx="2" fill="#a5876a"/>

  <!-- warm halo behind globe -->
  <circle cx="274" cy="270" r="150" fill="url(#globeHalo)"/>
  <!-- rice-paper globe -->
  <circle cx="274" cy="270" r="108" fill="url(#globe)"/>
  <circle cx="274" cy="270" r="108" fill="none" stroke="#e6d0a4" stroke-width="2" opacity="0.6"/>
  <!-- paper ribbing -->
  <g stroke="#e6d0a4" stroke-width="1.6" opacity="0.55" fill="none">
    <path d="M274 162 Q210 270 274 378"/>
    <path d="M274 162 Q150 270 274 378"/>
    <path d="M274 162 Q338 270 274 378"/>
    <path d="M274 162 Q398 270 274 378"/>
  </g>
  <g stroke="#e6d0a4" stroke-width="1.4" opacity="0.5" fill="none">
    <path d="M166 270 Q274 214 382 270"/>
    <path d="M172 232 Q274 190 376 232"/>
    <path d="M172 308 Q274 350 376 308"/>
  </g>
  <!-- soft inner highlight -->
  <ellipse cx="240" cy="238" rx="46" ry="36" fill="#fdf6e6" opacity="0.75"/>
  <!-- top fitting -->
  <rect x="260" y="158" width="28" height="10" rx="4" fill="#c9c5be"/>

  <!-- ===== console / oak shelf detail below poster ===== -->
  <ellipse cx="600" cy="500" rx="120" ry="10" fill="#1f1b16" opacity="0.12"/>
  <!-- ceramic vase -->
  <path d="M568 480 Q560 452 578 448 L622 448 Q640 452 632 480 Q628 500 600 500 Q572 500 568 480 Z" fill="url(#vase)"/>
  <path d="M578 448 L622 448 Q626 450 624 456 L576 456 Q574 450 578 448 Z" fill="#e3e1dc" opacity="0.7"/>
  <ellipse cx="588" cy="470" rx="6" ry="16" fill="#faf7f2" opacity="0.35"/>
  <!-- single olive stem -->
  <path d="M600 448 Q596 420 600 396" stroke="#7a7c5c" stroke-width="3" fill="none"/>
  <path d="M600 420 Q588 414 582 402 Q596 404 600 416 Z" fill="#8a8c62"/>
  <path d="M600 410 Q612 404 618 392 Q604 394 600 406 Z" fill="#7a7c5c"/>
  <path d="M600 398 Q592 392 590 382 Q600 386 601 396 Z" fill="#8a8c62"/>

  <!-- small stacked books -->
  <g>
    <rect x="470" y="486" width="86" height="10" rx="2" fill="#7a7c5c"/>
    <rect x="476" y="476" width="78" height="10" rx="2" fill="#cbb287"/>
    <rect x="482" y="466" width="70" height="10" rx="2" fill="#6d5138"/>
    <rect x="470" y="486" width="86" height="3" fill="#8a8c62" opacity="0.6"/>
  </g>

  <!-- faint wall trim shadow under floor line -->
  <rect x="0" y="466" width="800" height="4" fill="#1f1b16" opacity="0.06"/>
</svg>