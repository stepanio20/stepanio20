    <linearGradient id="oakUpVert" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="0.5" stop-color="#e0cba6"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="oakShelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0cba6"/>
      <stop offset="1" stop-color="#c8a87c"/>
