<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <!-- Ambient room light -->
    <radialGradient id="roomLight" cx="34%" cy="24%" r="85%">
      <stop offset="0%" stop-color="#faf3e6"/>
      <stop offset="34%" stop-color="#efe4d0"/>
      <stop offset="68%" stop-color="#e2d3b9"/>
      <stop offset="100%" stop-color="#cbb99b"/>
    </radialGradient>
    <linearGradient id="wallFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5ecdb" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#e6d7bd" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b7a07f" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Floor -->
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a87c"/>
      <stop offset="40%" stop-color="#b8946a"/>
      <stop offset="100%" stop-color="#8f6f4c"/>
    </linearGradient>
    <linearGradient id="floorSheen" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="42%" stop-color="#fdf3df" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- Oak frame gradients -->
    <linearGradient id="oakFrame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5876a"/>
      <stop offset="30%" stop-color="#cbb287"/>
      <stop offset="55%" stop-color="#d8c19a"/>
      <stop offset="80%" stop-color="#bfa079"/>
      <stop offset="100%" stop-color="#9c7e5f"/>
    </linearGradient>
    <linearGradient id="oakFrameV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8c19a"/>
      <stop offset="45%" stop-color="#c8a87c"/>
      <stop offset="100%" stop-color="#a5876a"/>
    </linearGradient>
    <!-- Mirror glass reflection -->
    <linearGradient id="mirrorGlass" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#e7e0d2"/>
      <stop offset="28%" stop-color="#d3cbbb"/>
      <stop offset="52%" stop-color="#c3bba9"/>
      <stop offset="78%" stop-color="#b1a894"/>
      <stop offset="100%" stop-color="#9c9280"/>
    </linearGradient>
    <radialGradient id="mirrorGlow" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fdf6e6" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#efe3cc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b7ac96" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mirrorBeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8ea" stop-opacity="0"/>
      <stop offset="46%" stop-color="#fff8ea" stop-opacity="0.6"/>
      <stop offset="54%" stop-color="#fff8ea" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fff8ea" stop-opacity="0"/>
    </linearGradient>
    <!-- Console wood -->
    <linearGradient id="consoleTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d5138"/>
      <stop offset="40%" stop-color="#7a5c40"/>
      <stop offset="70%" stop-color="#5c4632"/>
      <stop offset="100%" stop-color="#4a3624"/>
    </linearGradient>
    <linearGradient id="consoleFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c4632"/>
      <stop offset="100%" stop-color="#3c2c1e"/>
    </linearGradient>
    <linearGradient id="consoleLegSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="45%" stop-color="#5c4632"/>
      <stop offset="60%" stop-color="#7a5c40"/>
      <stop offset="100%" stop-color="#33271b"/>
    </linearGradient>
    <!-- Leather tray -->
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#8a5a20"/>
      <stop offset="45%" stop-color="#a06a2c"/>
      <stop offset="72%" stop-color="#8a5a20"/>
      <stop offset="100%" stop-color="#6a4418"/>
    </linearGradient>
    <linearGradient id="leatherInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a4418"/>
      <stop offset="100%" stop-color="#8a5a20"/>
    </linearGradient>
    <!-- Chrome sculpture -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f1ec"/>
      <stop offset="24%" stop-color="#e3e1dc"/>
      <stop offset="42%" stop-color="#9a968f"/>
      <stop offset="58%" stop-color="#c9c5be"/>
      <stop offset="74%" stop-color="#6f6b64"/>
      <stop offset="100%" stop-color="#b4b0a8"/>
    </linearGradient>
    <linearGradient id="chrome2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9d5ce"/>
      <stop offset="35%" stop-color="#f4f2ee"/>
      <stop offset="60%" stop-color="#8f8b84"/>
      <stop offset="100%" stop-color="#c4c0b9"/>
    </linearGradient>
    <!-- Stoneware vase -->
    <linearGradient id="stoneware" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#63654a"/>
      <stop offset="30%" stop-color="#8a8c62"/>
      <stop offset="52%" stop-color="#7a7c5c"/>
      <stop offset="78%" stop-color="#63654a"/>
      <stop offset="100%" stop-color="#4c4d38"/>
    </linearGradient>
    <radialGradient id="stonewareTop" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#3a3b2b"/>
      <stop offset="70%" stop-color="#565840"/>
      <stop offset="100%" stop-color="#7a7c5c"/>
    </radialGradient>
    <!-- Light beam -->
    <linearGradient id="lightBeam" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#fff6e2" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fff6e2" stop-opacity="0"/>
    </linearGradient>
    <!-- Soft shadow -->
    <radialGradient id="softShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a2c1c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a2c1c" stop-opacity="0"/>
    </radialGradient>
    <!-- Dried branch -->
    <linearGradient id="branch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5876a"/>
      <stop offset="100%" stop-color="#6d5138"/>
    </linearGradient>
    <linearGradient id="linenWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e6d3" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d8c7a8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- BACKDROP -->
  <rect x="0" y="0" width="600" height="750" fill="url(#roomLight)"/>
  <rect x="0" y="0" width="600" height="620" fill="url(#wallFade)"/>
  <rect x="0" y="0" width="600" height="620" fill="url(#linenWall)"/>

  <!-- linen weave texture on wall -->
  <g opacity="0.06" stroke="#8a7455" stroke-width="0.6">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="440" x2="600" y2="440"/>
    <line x1="0" y1="480" x2="600" y2="480"/>
    <line x1="0" y1="520" x2="600" y2="520"/>
    <line x1="0" y1="560" x2="600" y2="560"/>
    <line x1="80" y1="0" x2="80" y2="620"/>
    <line x1="180" y1="0" x2="180" y2="620"/>
    <line x1="280" y1="0" x2="280" y2="620"/>
    <line x1="380" y1="0" x2="380" y2="620"/>
    <line x1="480" y1="0" x2="480" y2="620"/>
    <line x1="560" y1="0" x2="560" y2="620"/>
  </g>

  <!-- Big soft beam of window light from upper-left -->
  <polygon points="-40,-10 260,-10 150,700 -120,700" fill="url(#lightBeam)" opacity="0.55"/>
  <polygon points="60,-10 150,-10 90,560 20,560" fill="#fff6e2" opacity="0.18"/>

  <!-- FLOOR -->
  <rect x="0" y="600" width="600" height="150" fill="url(#floor)"/>
  <g opacity="0.18" stroke="#5c4632" stroke-width="1.4">
    <line x1="0" y1="630" x2="600" y2="622"/>
    <line x1="0" y1="672" x2="600" y2="662"/>
    <line x1="0" y1="718" x2="600" y2="706"/>
  </g>
  <rect x="0" y="600" width="600" height="150" fill="url(#floorSheen)" opacity="0.6"/>
  <!-- floor plank seams vertical -->
  <g opacity="0.12" stroke="#4a3624" stroke-width="1">
    <line x1="120" y1="600" x2="110" y2="750"/>
    <line x1="300" y1="600" x2="300" y2="750"/>
    <line x1="470" y1="600" x2="486" y2="750"/>
  </g>

  <!-- ============ MIRROR (hero, slightly left of center) ============ -->
  <!-- floor shadow under mirror -->
  <ellipse cx="230" cy="612" rx="150" ry="26" fill="url(#softShadow)"/>

  <!-- Outer oak frame -->
  <rect x="120" y="120" width="220" height="490" rx="10" fill="url(#oakFrameV)"/>
  <!-- frame side bevels -->
  <rect x="120" y="120" width="26" height="490" rx="8" fill="url(#oakFrame)"/>
  <rect x="314" y="120" width="26" height="490" rx="8" fill="url(#oakFrame)"/>
  <rect x="120" y="120" width="220" height="24" rx="8" fill="url(#oakFrame)"/>
  <rect x="120" y="586" width="220" height="24" rx="8" fill="url(#oakFrame)"/>
  <!-- wood grain lines on frame -->
  <g opacity="0.22" stroke="#8a6f52" stroke-width="0.8" fill="none">
    <path d="M133,130 Q131,360 133,600"/>
    <path d="M139,130 Q141,360 139,600"/>
    <path d="M327,130 Q329,360 327,600"/>
    <path d="M333,130 Q331,360 333,600"/>
  </g>

  <!-- Inner mirror glass -->
  <rect x="150" y="150" width="160" height="430" rx="4" fill="url(#mirrorGlass)"/>
  <rect x="150" y="150" width="160" height="430" rx="4" fill="url(#mirrorGlow)"/>
  <!-- reflected diagonal light beam inside mirror -->
  <clipPath id="mirClip"><rect x="150" y="150" width="160" height="430" rx="4"/></clipPath>
  <g clip-path="url(#mirClip)">
    <polygon points="150,150 230,150 150,360" fill="url(#mirrorBeam)" opacity="0.8"/>
    <polygon points="200,150 270,150 150,470 150,320" fill="#fff8ea" opacity="0.22"/>
    <!-- soft reflected room warmth -->
    <ellipse cx="210" cy="260" rx="130" ry="150" fill="#fbeecf" opacity="0.28"/>
    <!-- faint reflection of a warm horizon line -->
    <rect x="150" y="430" width="160" height="150" fill="#8a7355" opacity="0.22"/>
    <rect x="150" y="426" width="160" height="6" fill="#e9d9ba" opacity="0.5"/>
    <!-- reflected vertical streaks -->
    <g opacity="0.12" stroke="#fff8ea" stroke-width="2">
      <line x1="185" y1="160" x2="170" y2="570"/>
      <line x1="255" y1="160" x2="272" y2="570"/>
    </g>
  </g>
  <!-- inner bevel highlight -->
  <rect x="150" y="150" width="160" height="430" rx="4" fill="none" stroke="#efe6d2" stroke-width="1.5" opacity="0.5"/>
  <rect x="146" y="146" width="168" height="438" rx="5" fill="none" stroke="#7a5f42" stroke-width="2" opacity="0.5"/>

  <!-- ============ CONSOLE (right of mirror) ============ -->
  <!-- floor shadow under console -->
  <ellipse cx="440" cy="606" rx="140" ry="22" fill="url(#softShadow)"/>

  <!-- Console top -->
  <rect x="340" y="470" width="220" height="20" rx="4" fill="url(#consoleTop)"/>
  <rect x="340" y="470" width="220" height="6" rx="3" fill="#8a6a48" opacity="0.7"/>
  <!-- front apron -->
  <rect x="345" y="490" width="210" height="18" fill="url(#consoleFront)"/>
  <g opacity="0.18" stroke="#2a1c10" stroke-width="0.7">
    <line x1="345" y1="497" x2="555" y2="497"/>
    <line x1="345" y1="502" x2="555" y2="502"/>
  </g>
  <!-- legs -->
  <rect x="356" y="508" width="12" height="100" rx="3" fill="url(#consoleLegSheen)"/>
  <rect x="532" y="508" width="12" height="100" rx="3" fill="url(#consoleLegSheen)"/>
  <rect x="356" y="508" width="12" height="100" rx="3" fill="#000" opacity="0.05"/>

  <!-- ============ LEATHER TRAY on console ============ -->
  <ellipse cx="415" cy="475" rx="66" ry="16" fill="#2c1e10" opacity="0.28"/>
  <rect x="352" y="452" width="126" height="22" rx="8" fill="url(#leather)"/>
  <ellipse cx="415" cy="452" rx="63" ry="12" fill="url(#leatherInner)"/>
  <ellipse cx="415" cy="450" rx="55" ry="8" fill="#7a4c1a" opacity="0.7"/>
  <!-- stitch line -->
  <ellipse cx="415" cy="452" rx="60" ry="11" fill="none" stroke="#4a3018" stroke-width="0.8" stroke-dasharray="3 2.5" opacity="0.6"/>
  <!-- small props in tray -->
  <ellipse cx="392" cy="449" rx="9" ry="4" fill="#cf9f5c" opacity="0.85"/>
  <ellipse cx="392" cy="447" rx="9" ry="4" fill="#e3c188" opacity="0.6"/>
  <rect x="424" y="443" width="26" height="7" rx="3" fill="#3d3a36"/>
  <rect x="424" y="443" width="26" height="3" rx="1.5" fill="#5a564f" opacity="0.7"/>

  <!-- ============ CHROME SCULPTURE ============ -->
  <ellipse cx="500" cy="470" rx="26" ry="7" fill="#2c1e10" opacity="0.3"/>
  <!-- twisted looping chrome form -->
  <path d="M486,468 C476,440 500,430 508,452 C514,470 500,478 490,470 C480,462 494,448 502,458"
        fill="none" stroke="url(#chrome)" stroke-width="11" stroke-linecap="round"/>
  <path d="M486,468 C476,440 500,430 508,452 C514,470 500,478 490,470 C480,462 494,448 502,458"
        fill="none" stroke="url(#chrome2)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <!-- chrome base -->
  <ellipse cx="500" cy="469" rx="16" ry="5" fill="url(#chrome2)"/>
  <ellipse cx="500" cy="467" rx="11" ry="3" fill="#f3f1ec" opacity="0.8"/>
  <!-- specular glints -->
  <circle cx="496" cy="440" r="2.4" fill="#fff" opacity="0.9"/>
  <circle cx="507" cy="456" r="1.8" fill="#fff" opacity="0.85"/>

  <!-- ============ STONEWARE VASE + DRIED BRANCH (far right, tall) ============ -->
  <ellipse cx="500" cy="608" rx="42" ry="12" fill="url(#softShadow)"/>
  <!-- Branch behind, tall -->
  <g stroke-linecap="round" fill="none">
    <path d="M500,520 C494,430 512,360 505,270" stroke="url(#branch)" stroke-width="5"/>
    <path d="M505,320 C520,300 534,286 548,258" stroke="url(#branch)" stroke-width="2.6"/>
    <path d="M503,360 C486,344 476,332 462,308" stroke="url(#branch)" stroke-width="2.6"/>
    <path d="M508,285 C520,272 528,262 536,244" stroke="url(#branch)" stroke-width="2"/>
    <path d="M504,300 C494,286 488,278 480,262" stroke="url(#branch)" stroke-width="2"/>
    <path d="M506,255 C512,242 517,232 520,216" stroke="url(#branch)" stroke-width="2"/>
    <path d="M503,258 C496,246 492,238 486,224" stroke="url(#branch)" stroke-width="1.7"/>
    <!-- fine twigs -->
    <path d="M548,258 C556,252 561,248 566,240" stroke="#8a6f52" stroke-width="1.2"/>
    <path d="M462,308 C454,302 449,299 442,292" stroke="#8a6f52" stroke-width="1.2"/>
    <path d="M536,244 C543,239 547,237 552,230" stroke="#8a6f52" stroke-width="1"/>
    <path d="M520,216 C525,209 528,205 531,197" stroke="#8a6f52" stroke-width="1"/>
  </g>
  <!-- a few dried seed pods / leaves -->
  <g fill="#a5876a" opacity="0.85">
    <ellipse cx="566" cy="240" rx="4" ry="9" transform="rotate(28 566 240)"/>
    <ellipse cx="442" cy="292" rx="4" ry="9" transform="rotate(-34 442 292)"/>
    <ellipse cx="552" cy="230" rx="3.4" ry="7.5" transform="rotate(30 552 230)"/>
    <ellipse cx="531" cy="197" rx="3.4" ry="7.5" transform="rotate(22 531 197)"/>
    <ellipse cx="486" cy="224" rx="3.4" ry="7.5" transform="rotate(-28 486 224)"/>
  </g>
  <g fill="#8a8c62" opacity="0.5">
    <ellipse cx="566" cy="240" rx="2" ry="5" transform="rotate(28 566 240)"/>
    <ellipse cx="442" cy="292" rx="2" ry="5" transform="rotate(-34 442 292)"/>
  </g>

  <!-- Stoneware vase -->
  <path d="M474,516 C470,560 476,598 500,600 C524,598 530,560 526,516 Z" fill="url(#stoneware)"/>
  <path d="M474,516 C470,560 476,598 500,600 C524,598 530,560 526,516 Z" fill="#3a3b2b" opacity="0.12"/>
  <!-- vase highlight -->
  <path d="M482,520 C479,556 483,588 494,596" fill="none" stroke="#a9ab80" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
  <path d="M516,520 C520,556 517,586 510,595" fill="none" stroke="#3a3b2b" stroke-width="5" opacity="0.35" stroke-linecap="round"/>
  <!-- vase rim -->
  <ellipse cx="500" cy="516" rx="26" ry="8" fill="url(#stonewareTop)"/>
  <ellipse cx="500" cy="515" rx="26" ry="7.5" fill="none" stroke="#9a9c70" stroke-width="1.4" opacity="0.6"/>
  <ellipse cx="500" cy="516" rx="18" ry="5" fill="#2e2f22" opacity="0.7"/>

  <!-- ============ FOREGROUND PLANT LEAF (soft, lower-left, out of focus) ============ -->
  <g opacity="0.9">
    <path d="M-10,700 C60,660 120,690 150,740 C110,720 40,720 -10,745 Z" fill="#63654a"/>
    <path d="M-10,700 C60,662 116,690 146,736" fill="none" stroke="#4c4d38" stroke-width="2" opacity="0.5"/>
    <path d="M40,690 C70,700 100,712 130,730" fill="none" stroke="#4c4d38" stroke-width="1" opacity="0.35"/>
  </g>
  <g opacity="0.75">
    <path d="M-10,660 C50,628 110,650 140,700 C100,676 40,678 -10,702 Z" fill="#7a7c5c"/>
    <path d="M-10,660 C50,630 106,650 136,696" fill="none" stroke="#565840" stroke-width="1.6" opacity="0.5"/>
  </g>
  <!-- leaf sheen -->
  <path d="M-10,660 C50,630 96,648 120,682" fill="none" stroke="#a9ab80" stroke-width="2" opacity="0.35" stroke-linecap="round"/>

  <!-- ============ ATMOSPHERE overlays ============ -->
  <!-- warm glow bloom upper-left -->
  <ellipse cx="150" cy="150" rx="220" ry="200" fill="#fff2d8" opacity="0.22"/>
  <!-- gentle vignette -->
  <rect x="0" y="0" width="600" height="750" fill="url(#softShadow)" opacity="0"/>
  <radialGradient id="vig" cx="42%" cy="40%" r="72%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#2a1c10" stop-opacity="0.34"/>
  </radialGradient>
  <rect x="0" y="0" width="600" height="750" fill="url(#vig)"/>
  <!-- dust motes in the beam -->
  <g fill="#fff6e2">
    <circle cx="120" cy="220" r="1.6" opacity="0.5"/>
    <circle cx="180" cy="300" r="1.2" opacity="0.4"/>
    <circle cx="90" cy="380" r="1.8" opacity="0.45"/>
    <circle cx="200" cy="180" r="1" opacity="0.5"/>
    <circle cx="150" cy="440" r="1.3" opacity="0.35"/>
    <circle cx="240" cy="260" r="1.1" opacity="0.4"/>
  </g>
</svg>