<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <!-- Ambient warm light wash over the whole board -->
    <radialGradient id="ambientLight" cx="38%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#fff8ec"/>
      <stop offset="38%" stop-color="#f7f0e2"/>
      <stop offset="72%" stop-color="#ede2cf"/>
      <stop offset="100%" stop-color="#ddceb4"/>
    </radialGradient>
    <!-- Light-oak surface gradient -->
    <linearGradient id="oakSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6d4b2"/>
      <stop offset="45%" stop-color="#d8c19a"/>
      <stop offset="100%" stop-color="#c3aa82"/>
    </linearGradient>
    <!-- Soft beam of light -->
    <linearGradient id="beam" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#fff6e2" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#fff2d8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fff2d8" stop-opacity="0"/>
    </linearGradient>

    <!-- Light oak veneer swatch -->
    <linearGradient id="veneerBase" x1="0%" y1="0%" x2="100%" y2="18%">
      <stop offset="0%" stop-color="#e8d3a8"/>
      <stop offset="50%" stop-color="#d8bd8c"/>
      <stop offset="100%" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="veneerSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff7e6" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#fff7e6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff7e6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Dark walnut swatch -->
    <linearGradient id="walnutBase" x1="0%" y1="0%" x2="100%" y2="22%">
      <stop offset="0%" stop-color="#6d5138"/>
      <stop offset="45%" stop-color="#5c4632"/>
      <stop offset="100%" stop-color="#4a3624"/>
    </linearGradient>
    <linearGradient id="walnutSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8a87c" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#c8a87c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c8a87c" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Brushed chrome bar -->
    <linearGradient id="chromeBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8e6e1"/>
      <stop offset="18%" stop-color="#c9c5be"/>
      <stop offset="42%" stop-color="#f2f0ec"/>
      <stop offset="60%" stop-color="#a8a49d"/>
      <stop offset="82%" stop-color="#d4d0c9"/>
      <stop offset="100%" stop-color="#9a968f"/>
    </linearGradient>
    <linearGradient id="chromeHi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Olive velvet -->
    <linearGradient id="velvetBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a8c62"/>
      <stop offset="50%" stop-color="#7a7c5c"/>
      <stop offset="100%" stop-color="#63654a"/>
    </linearGradient>
    <radialGradient id="velvetSheen" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#a9ab7e" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#8a8c62" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4f5138" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="velvetFold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a9c70"/>
      <stop offset="100%" stop-color="#585a40"/>
    </linearGradient>

    <!-- Natural linen -->
    <linearGradient id="linenBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2ead6"/>
      <stop offset="100%" stop-color="#e2d5ba"/>
    </linearGradient>
    <pattern id="linenWeave" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <rect width="7" height="7" fill="#e8dcc6"/>
      <rect width="3.4" height="7" fill="#ddceae" opacity="0.6"/>
      <rect width="7" height="3.4" fill="#f0e6cf" opacity="0.5"/>
    </pattern>

    <!-- Jute weave -->
    <linearGradient id="juteBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cf9f5c"/>
      <stop offset="100%" stop-color="#a5763a"/>
    </linearGradient>
    <pattern id="jutePat" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="14" height="14" fill="#c09250"/>
      <rect x="0" width="6" height="14" fill="#a87a3c"/>
      <rect y="0" width="14" height="6" fill="#d8ab68" opacity="0.7"/>
      <rect x="7" y="7" width="6" height="6" fill="#8a5a20" opacity="0.5"/>
    </pattern>

    <!-- Glass tile -->
    <linearGradient id="glassTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6e6ec"/>
      <stop offset="45%" stop-color="#b8cdd6"/>
      <stop offset="100%" stop-color="#8fb0bc"/>
    </linearGradient>
    <linearGradient id="glassHi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Leaf -->
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a8c62"/>
      <stop offset="100%" stop-color="#5a5c40"/>
    </linearGradient>

    <!-- Soft drop shadow -->
    <radialGradient id="softShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2724" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#2a2724" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2a2724" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ============ BACKGROUND / SURFACE ============ -->
  <rect width="600" height="750" fill="url(#ambientLight)"/>
  <rect width="600" height="750" fill="url(#oakSurface)" opacity="0.55"/>

  <!-- oak surface plank grain lines -->
  <g stroke="#b59a6e" stroke-width="1" opacity="0.22" fill="none">
    <path d="M0 70 C 150 62, 420 78, 600 66"/>
    <path d="M0 170 C 180 160, 400 180, 600 168"/>
    <path d="M0 270 C 160 262, 430 282, 600 270"/>
    <path d="M0 380 C 200 372, 410 390, 600 380"/>
    <path d="M0 500 C 150 492, 440 508, 600 498"/>
    <path d="M0 620 C 180 612, 420 630, 600 620"/>
    <path d="M0 710 C 160 702, 430 720, 600 710"/>
  </g>
  <g stroke="#e9d7b4" stroke-width="0.8" opacity="0.3" fill="none">
    <path d="M0 120 C 180 112, 400 128, 600 118"/>
    <path d="M0 330 C 160 322, 430 340, 600 330"/>
    <path d="M0 560 C 200 552, 410 570, 600 560"/>
  </g>

  <!-- big soft beam of light from upper-left -->
  <polygon points="-40,-40 320,-40 120,790 -180,790" fill="url(#beam)"/>
  <polygon points="120,-40 260,-40 60,500 -60,420" fill="#fff6e2" opacity="0.12"/>

  <!-- ============ SHADOWS UNDER OBJECTS ============ -->
  <ellipse cx="205" cy="235" rx="150" ry="70" fill="url(#softShadow)"/>
  <ellipse cx="400" cy="215" rx="120" ry="60" fill="url(#softShadow)"/>
  <ellipse cx="150" cy="470" rx="130" ry="80" fill="url(#softShadow)"/>
  <ellipse cx="420" cy="510" rx="150" ry="90" fill="url(#softShadow)"/>
  <ellipse cx="330" cy="640" rx="150" ry="70" fill="url(#softShadow)"/>

  <!-- ============ HERO: LIGHT OAK VENEER SWATCH (off-center) ============ -->
  <g transform="rotate(-7 210 220)">
    <rect x="70" y="120" width="280" height="200" rx="6" fill="#8a6f4a" opacity="0.4"/>
    <rect x="66" y="116" width="280" height="200" rx="6" fill="url(#veneerBase)"/>
    <!-- wood grain figuring -->
    <g stroke="#bd9c6a" stroke-width="1.4" fill="none" opacity="0.55">
      <path d="M66 150 C 150 142, 260 158, 346 148"/>
      <path d="M66 172 C 160 165, 250 180, 346 170"/>
      <path d="M66 196 C 140 188, 270 202, 346 194"/>
      <path d="M66 222 C 170 214, 240 228, 346 220"/>
      <path d="M66 250 C 150 242, 260 256, 346 248"/>
      <path d="M66 278 C 160 270, 250 286, 346 276"/>
      <path d="M66 300 C 140 294, 270 306, 346 298"/>
    </g>
    <g stroke="#a5876a" stroke-width="0.8" fill="none" opacity="0.4">
      <path d="M66 160 C 150 154, 260 168, 346 160"/>
      <path d="M66 210 C 170 202, 240 216, 346 208"/>
      <path d="M66 264 C 150 256, 260 270, 346 262"/>
    </g>
    <!-- knot / cathedral figure -->
    <path d="M140 240 C 175 200, 235 200, 270 240 C 235 260, 175 260, 140 240 Z" fill="#c19c66" opacity="0.35"/>
    <path d="M160 240 C 185 214, 225 214, 250 240 C 225 254, 185 254, 160 240 Z" fill="#b08a54" opacity="0.4"/>
    <rect x="66" y="116" width="280" height="200" rx="6" fill="url(#veneerSheen)"/>
    <rect x="66" y="116" width="280" height="200" rx="6" fill="none" stroke="#e8d3a8" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- ============ DARK WALNUT SWATCH (overlapping upper right) ============ -->
  <g transform="rotate(6 420 200)">
    <rect x="304" y="96" width="220" height="180" rx="5" fill="#2e2216" opacity="0.5"/>
    <rect x="300" y="92" width="220" height="180" rx="5" fill="url(#walnutBase)"/>
    <g stroke="#3c2c1c" stroke-width="1.6" fill="none" opacity="0.6">
      <path d="M300 118 C 380 110, 450 126, 520 116"/>
      <path d="M300 144 C 390 136, 440 152, 520 142"/>
      <path d="M300 172 C 370 164, 460 180, 520 170"/>
      <path d="M300 202 C 390 194, 440 210, 520 200"/>
      <path d="M300 232 C 370 224, 460 240, 520 230"/>
      <path d="M300 258 C 390 250, 440 266, 520 256"/>
    </g>
    <g stroke="#7a5c3c" stroke-width="0.9" fill="none" opacity="0.45">
      <path d="M300 130 C 380 124, 450 138, 520 130"/>
      <path d="M300 186 C 390 178, 440 194, 520 186"/>
      <path d="M300 244 C 370 238, 460 252, 520 244"/>
    </g>
    <path d="M370 182 C 400 150, 450 150, 470 182 C 450 200, 400 200, 370 182 Z" fill="#4a3624" opacity="0.6"/>
    <rect x="300" y="92" width="220" height="180" rx="5" fill="url(#walnutSheen)"/>
    <rect x="300" y="92" width="220" height="180" rx="5" fill="none" stroke="#7a5c3c" stroke-width="1.2" opacity="0.5"/>
  </g>

  <!-- ============ BRUSHED CHROME BAR (diagonal, spanning center) ============ -->
  <g transform="rotate(-24 300 400)">
    <rect x="118" y="382" width="380" height="44" rx="8" fill="#5c5852" opacity="0.45"/>
    <rect x="114" y="376" width="380" height="44" rx="8" fill="url(#chromeBar)"/>
    <!-- brushed striations -->
    <g stroke="#8f8b84" stroke-width="0.6" opacity="0.4">
      <line x1="114" y1="384" x2="494" y2="384"/>
      <line x1="114" y1="390" x2="494" y2="390"/>
      <line x1="114" y1="398" x2="494" y2="398"/>
      <line x1="114" y1="406" x2="494" y2="406"/>
      <line x1="114" y1="412" x2="494" y2="412"/>
    </g>
    <g stroke="#f6f4f0" stroke-width="0.5" opacity="0.5">
      <line x1="114" y1="386" x2="494" y2="386"/>
      <line x1="114" y1="401" x2="494" y2="401"/>
    </g>
    <rect x="114" y="378" width="380" height="8" rx="4" fill="url(#chromeHi)"/>
    <rect x="114" y="376" width="380" height="44" rx="8" fill="none" stroke="#f2f0ec" stroke-width="1" opacity="0.7"/>
    <!-- reflected warm glint -->
    <ellipse cx="200" cy="398" rx="60" ry="10" fill="#cf9f5c" opacity="0.18"/>
  </g>

  <!-- ============ FOLDED OLIVE VELVET FABRIC (lower left, plush) ============ -->
  <g transform="rotate(4 160 500)">
    <rect x="46" y="420" width="230" height="150" rx="10" fill="#3f4130" opacity="0.5"/>
    <rect x="42" y="414" width="230" height="150" rx="10" fill="url(#velvetBase)"/>
    <rect x="42" y="414" width="230" height="150" rx="10" fill="url(#velvetSheen)"/>
    <!-- fold ridges -->
    <path d="M42 452 C 110 442, 190 460, 272 448 L 272 470 C 190 482, 110 464, 42 474 Z" fill="url(#velvetFold)" opacity="0.55"/>
    <path d="M42 500 C 110 490, 190 508, 272 496 L 272 516 C 190 528, 110 512, 42 522 Z" fill="url(#velvetFold)" opacity="0.5"/>
    <!-- soft plush highlights -->
    <g stroke="#a9ab7e" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round">
      <path d="M60 440 C 130 432, 200 448, 258 438"/>
      <path d="M60 486 C 130 478, 200 494, 258 484"/>
      <path d="M60 534 C 130 526, 200 542, 258 532"/>
    </g>
    <g stroke="#4f5138" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round">
      <path d="M60 462 C 130 454, 200 470, 258 460"/>
      <path d="M60 510 C 130 502, 200 518, 258 508"/>
    </g>
    <!-- folded corner flap -->
    <path d="M42 414 L 118 414 L 60 470 L 42 452 Z" fill="#8f9166" opacity="0.7"/>
    <path d="M42 414 L 118 414 L 60 470" fill="none" stroke="#a9ab7e" stroke-width="1" opacity="0.5"/>
    <rect x="42" y="414" width="230" height="150" rx="10" fill="none" stroke="#4f5138" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- ============ NATURAL LINEN (center-right, draped) ============ -->
  <g transform="rotate(-5 420 500)">
    <rect x="316" y="428" width="210" height="160" rx="4" fill="#c9b89a" opacity="0.5"/>
    <rect x="312" y="422" width="210" height="160" rx="4" fill="url(#linenBase)"/>
    <rect x="312" y="422" width="210" height="160" rx="4" fill="url(#linenWeave)" opacity="0.85"/>
    <!-- soft drape shadow folds -->
    <g stroke="#cbb890" stroke-width="3" fill="none" opacity="0.35" stroke-linecap="round">
      <path d="M330 452 C 400 446, 460 458, 508 450"/>
      <path d="M330 498 C 400 492, 460 504, 508 496"/>
      <path d="M330 544 C 400 538, 460 550, 508 542"/>
    </g>
    <g stroke="#f4ecd8" stroke-width="1.4" fill="none" opacity="0.5" stroke-linecap="round">
      <path d="M330 470 C 400 464, 460 476, 508 468"/>
      <path d="M330 520 C 400 514, 460 526, 508 518"/>
    </g>
    <!-- frayed edge threads -->
    <g stroke="#d8c9a8" stroke-width="1" opacity="0.7">
      <line x1="312" y1="430" x2="304" y2="428"/>
      <line x1="312" y1="440" x2="303" y2="440"/>
      <line x1="312" y1="452" x2="305" y2="454"/>
      <line x1="312" y1="464" x2="303" y2="463"/>
      <line x1="312" y1="476" x2="304" y2="478"/>
      <line x1="312" y1="488" x2="303" y2="488"/>
      <line x1="312" y1="500" x2="305" y2="502"/>
    </g>
    <rect x="312" y="422" width="210" height="160" rx="4" fill="none" stroke="#d8c9a8" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- ============ JUTE WEAVE CORNER (bottom left, layered under) ============ -->
  <g transform="rotate(-14 150 650)">
    <rect x="60" y="596" width="170" height="130" rx="3" fill="#7a5628" opacity="0.5"/>
    <rect x="56" y="590" width="170" height="130" rx="3" fill="url(#juteBase)"/>
    <rect x="56" y="590" width="170" height="130" rx="3" fill="url(#jutePat)" opacity="0.9"/>
    <!-- coarse woven threads -->
    <g stroke="#8a5a20" stroke-width="2.2" opacity="0.5">
      <line x1="56" y1="612" x2="226" y2="612"/>
      <line x1="56" y1="640" x2="226" y2="640"/>
      <line x1="56" y1="668" x2="226" y2="668"/>
      <line x1="56" y1="696" x2="226" y2="696"/>
    </g>
    <g stroke="#d8ab68" stroke-width="1.6" opacity="0.6">
      <line x1="86" y1="590" x2="86" y2="720"/>
      <line x1="126" y1="590" x2="126" y2="720"/>
      <line x1="166" y1="590" x2="166" y2="720"/>
      <line x1="206" y1="590" x2="206" y2="720"/>
    </g>
    <!-- frayed corner -->
    <g stroke="#b98a4a" stroke-width="1.2" opacity="0.75">
      <line x1="226" y1="600" x2="236" y2="596"/>
      <line x1="226" y1="616" x2="238" y2="614"/>
      <line x1="226" y1="632" x2="237" y2="634"/>
    </g>
    <rect x="56" y="590" width="170" height="130" rx="3" fill="none" stroke="#8a5a20" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- ============ SMALL GLASS TILE (glossy accent, resting on chrome/linen) ============ -->
  <g transform="rotate(10 420 660)">
    <rect x="384" y="626" width="86" height="86" rx="8" fill="#4a6068" opacity="0.4"/>
    <rect x="380" y="620" width="86" height="86" rx="8" fill="url(#glassTile)"/>
    <rect x="380" y="620" width="86" height="86" rx="8" fill="url(#glassHi)"/>
    <!-- reflection streak -->
    <path d="M392 632 L 428 632 L 400 694 L 388 694 Z" fill="#ffffff" opacity="0.35"/>
    <path d="M436 636 L 452 636 L 430 700 L 420 700 Z" fill="#ffffff" opacity="0.2"/>
    <rect x="380" y="620" width="86" height="86" rx="8" fill="none" stroke="#d6e6ec" stroke-width="1.5" opacity="0.8"/>
    <rect x="386" y="626" width="74" height="74" rx="5" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- ============ PLANT LEAVES (styling props) ============ -->
  <g transform="rotate(-18 520 150)">
    <path d="M520 60 C 560 90, 566 160, 522 210 C 496 158, 494 96, 520 60 Z" fill="url(#leaf)" opacity="0.92"/>
    <path d="M520 72 L 522 200" stroke="#4a4c34" stroke-width="1.4" opacity="0.6" fill="none"/>
    <g stroke="#4a4c34" stroke-width="0.9" opacity="0.45" fill="none">
      <path d="M521 100 C 535 106, 545 120, 548 132"/>
      <path d="M521 130 C 535 136, 545 150, 548 162"/>
      <path d="M521 100 C 507 106, 498 120, 496 132"/>
      <path d="M521 130 C 507 136, 498 150, 496 162"/>
    </g>
  </g>
  <g transform="rotate(28 60 300)">
    <path d="M60 240 C 92 264, 96 322, 62 362 C 40 320, 38 274, 60 240 Z" fill="url(#leaf)" opacity="0.85"/>
    <path d="M60 250 L 62 354" stroke="#4a4c34" stroke-width="1.2" opacity="0.55" fill="none"/>
    <g stroke="#4a4c34" stroke-width="0.8" opacity="0.4" fill="none">
      <path d="M61 280 C 73 286, 80 298, 82 308"/>
      <path d="M61 306 C 73 312, 80 324, 82 334"/>
      <path d="M61 280 C 49 286, 42 298, 40 308"/>
    </g>
  </g>

  <!-- small trailing sprig lower right -->
  <g transform="rotate(160 540 680)" opacity="0.8">
    <path d="M540 640 C 558 658, 560 700, 542 726 C 528 698, 526 664, 540 640 Z" fill="url(#leaf)"/>
    <path d="M540 648 L 542 720" stroke="#4a4c34" stroke-width="1" opacity="0.5" fill="none"/>
  </g>

  <!-- ============ FINE ATMOSPHERE / DUST HIGHLIGHTS ============ -->
  <g fill="#fff6e2" opacity="0.5">
    <circle cx="180" cy="120" r="1.4"/>
    <circle cx="260" cy="90" r="1"/>
    <circle cx="120" cy="200" r="1.2"/>
    <circle cx="340" cy="360" r="1"/>
    <circle cx="470" cy="300" r="1.3"/>
    <circle cx="90" cy="400" r="1"/>
    <circle cx="500" cy="420" r="1.1"/>
    <circle cx="300" cy="480" r="1"/>
  </g>

  <!-- overall warm vignette -->
  <rect width="600" height="750" fill="url(#ambientLight)" opacity="0.12"/>
  <radialGradient id="vign" cx="50%" cy="46%" r="72%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#3d3a36" stop-opacity="0.34"/>
  </radialGradient>
  <rect width="600" height="750" fill="url(#vign)"/>
</svg>
