  <g>
    <rect x="632" y="392" width="150" height="88" rx="8" fill="url(#shoeCab)"/>
    <rect x="632" y="392" width="150" height="10" rx="5" fill="#e0cba4"/>
    <rect x="638" y="406" width="66" height="66" rx="5" fill="url(#oakEdge)"/>
    <rect x="710" y="406" width="66" height="66" rx="5" fill="url(#oakEdge)"/>
    <!-- wood grain -->
    <g stroke="#a5876a" stroke-width="1" opacity="0.4" fill="none">
      <path d="M644 418 Q671 415 698 418"/>
      <path d="M644 432 Q671 429 698 433"/>
      <path d="M644 448 Q671 446 698 449"/>
      <path d="M644 462 Q671 460 698 463"/>
      <path d="M716 418 Q743 415 770 418"/>
      <path d="M716 434 Q743 431 770 435"/>
      <path d="M716 450 Q743 448 770 451"/>
      <path d="M716 464 Q743 462 770 465"/>
    </g>
    <circle cx="700" cy="439" r="3" fill="#5c4632"/>
    <circle cx="714" cy="439" r="3" fill="#5c4632"/>
    <rect x="632" y="474" width="150" height="8" rx="4" fill="#a5876a" opacity="0.7"/>
    <ellipse cx="654" cy="483" rx="8" ry="4" fill="#3d3a36"/>
    <ellipse cx="760" cy="483" rx="8" ry="4" fill="#3d3a36"/>
  </g>

  <!-- SLIM OAK + BLACK STEEL CONSOLE (center) -->
  <g>
    <!-- steel legs -->
    <rect x="398" y="428" width="9" height="112" rx="3" fill="url(#steel)"/>
    <rect x="399" y="430" width="2" height="108" fill="#5c4632" opacity="0.5"/>
    <rect x="600" y="428" width="9" height="112" rx="3" fill="url(#steel)"/>
    <rect x="601" y="430" width="2" height="108" fill="#5c4632" opacity="0.5"/>
    <line x1="402" y1="510" x2="605" y2="510" stroke="#15130f" stroke-width="6"/>
    <line x1="402" y1="510" x2="605" y2="510" stroke="#3d3a36" stroke-width="1.5" opacity="0.6"/>
    <!-- oak top -->
    <rect x="372" y="416" width="262" height="20" rx="6" fill="url(#oakConsole)"/>
    <rect x="372" y="416" width="262" height="5" rx="2.5" fill="#e6d4b0"/>
    <rect x="372" y="430" width="262" height="6" rx="3" fill="#a5876a" opacity="0.6"/>
    <g stroke="#a5876a" stroke-width="0.9" opacity="0.4" fill="none">
