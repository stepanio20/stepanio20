    <rect x="62" y="200" width="216" height="6" rx="3" fill="url(#glassGrad)"/>
    <rect x="62" y="320" width="216" height="6" rx="3" fill="#e3e1dc"/>
    <rect x="62" y="320" width="216" height="6" rx="3" fill="url(#glassGrad)"/>

    <!-- LED strips + glow (top of each compartment) -->
    <rect x="70" y="88" width="200" height="4" rx="2" fill="#faf7f2"/>
    <rect x="70" y="88" width="200" height="3" rx="1.5" fill="#f7e6c0"/>
    <rect x="66" y="92" width="208" height="46" fill="url(#ledGlow)"/>
    <rect x="70" y="210" width="200" height="4" rx="2" fill="#faf7f2"/>
    <rect x="70" y="210" width="200" height="3" rx="1.5" fill="#f7e6c0"/>
