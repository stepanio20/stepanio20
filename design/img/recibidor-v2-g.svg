    <line x1="360" y1="412" x2="360" y2="452"/>
    <line x1="600" y1="412" x2="600" y2="452"/>
    <line x1="70" y1="452" x2="70" y2="500"/>
    <line x1="300" y1="452" x2="300" y2="500"/>
    <line x1="520" y1="452" x2="520" y2="500"/>
    <line x1="700" y1="452" x2="700" y2="500"/>
    <line x1="180" y1="500" x2="180" y2="552"/>
    <line x1="430" y1="500" x2="430" y2="552"/>
    <line x1="640" y1="500" x2="640" y2="552"/>
  </g>
  <g stroke="#e6d4b0" stroke-width="0.8" opacity="0.4">
