      <ellipse cx="452" cy="418" rx="52" ry="9" fill="rgba(31,27,22,0.16)"/>
      <rect x="404" y="402" width="96" height="16" rx="6" fill="url(#walnutTray)"/>
      <rect x="404" y="402" width="96" height="5" rx="2.5" fill="#6d5138"/>
      <rect x="410" y="405" width="84" height="8" rx="3" fill="#4a3624"/>
      <path d="M414 407 L490 407" stroke="#6d5138" stroke-width="1" opacity="0.6"/>
      <!-- keys detail -->
      <circle cx="430" cy="409" r="3.5" fill="#e3e1dc"/>
      <rect x="430" y="409" width="14" height="3" rx="1.5" fill="#c9c5be"/>
      <circle cx="470" cy="409" r="3" fill="#cf9f5c"/>
    </g>

    <!-- CERAMIC VASE -->
    <g>
      <ellipse cx="566" cy="418" rx="26" ry="7" fill="rgba(31,27,22,0.16)"/>
      <path d="M550 416 Q544 388 552 372 Q560 362 566 362 Q572 362 580 372 Q588 388 582 416 Z" fill="url(#vase)"/>
      <path d="M553 410 Q549 388 555 374 Q560 368 564 368" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
      <ellipse cx="566" cy="416" rx="16" ry="4" fill="#8ba7b0" opacity="0.6"/>
