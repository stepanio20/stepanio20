      <line x1="324" y1="524" x2="324" y2="586"/>
      <line x1="348" y1="524" x2="348" y2="586"/>
      <line x1="372" y1="524" x2="372" y2="586"/>
      <line x1="396" y1="524" x2="396" y2="586"/>
      <line x1="420" y1="524" x2="420" y2="586"/>
      <line x1="444" y1="524" x2="444" y2="586"/>
      <line x1="468" y1="524" x2="468" y2="586"/>
      <line x1="492" y1="524" x2="492" y2="586"/>
      <line x1="516" y1="524" x2="516" y2="586"/>
      <line x1="540" y1="524" x2="540" y2="586"/>
    </g>
    <g stroke="#e8dcc6" stroke-width="1" opacity="0.5">
      <line x1="280" y1="540" x2="560" y2="540"/>
      <line x1="280" y1="554" x2="560" y2="554"/>
      <line x1="280" y1="568" x2="560" y2="568"/>
    </g>
    <rect x="280" y="527" width="280" height="4" rx="2" fill="#f0e6d2" opacity="0.6"/>
