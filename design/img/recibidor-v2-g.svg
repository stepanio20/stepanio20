    <rect x="276" y="524" width="288" height="62" rx="10" fill="none" stroke="#a5876a" stroke-width="2" opacity="0.6"/>
    <rect x="286" y="533" width="268" height="44" rx="6" fill="none" stroke="#a5876a" stroke-width="1.4" opacity="0.5"/>
