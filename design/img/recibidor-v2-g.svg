  <rect x="0" y="412" width="800" height="188" fill="url(#floorSheen)"/>
  <!-- plank seams -->
  <g stroke="#a5876a" stroke-width="1.3" opacity="0.35">
    <line x1="0" y1="452" x2="800" y2="452"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="552" x2="800" y2="552"/>
  </g>
  <g stroke="#a5876a" stroke-width="1" opacity="0.28">
