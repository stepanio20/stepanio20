  <!-- warm raking light overlay -->
  <rect x="0" y="0" width="800" height="600" fill="url(#rakeLight)"/>
  <path d="M0 0 L250 0 L120 600 L0 600 Z" fill="#fbe9c4" opacity="0.10"/>
