      <ellipse cx="170" cy="440" rx="50" ry="7" fill="rgba(31,27,22,0.18)"/>
      <path d="M134 440 L130 400 Q130 392 140 392 L200 392 Q210 392 210 400 L206 440 Z" fill="url(#bagSand)"/>
      <path d="M140 392 Q170 386 200 392 L198 402 Q170 396 142 402 Z" fill="#ffffff" opacity="0.55"/>
      <path d="M146 396 Q170 366 194 396" fill="none" stroke="#cbb287" stroke-width="5" stroke-linecap="round"/>
      <path d="M146 396 Q170 368 194 396" fill="none" stroke="#f0e6d2" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <rect x="164" y="410" width="12" height="8" rx="2" fill="#cf9f5c"/>
