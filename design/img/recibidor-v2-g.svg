    <circle cx="502" cy="208" r="122" fill="url(#mirrorFrame)"/>
    <circle cx="502" cy="208" r="122" fill="none" stroke="#a5876a" stroke-width="1.5" opacity="0.5"/>
    <circle cx="502" cy="208" r="106" fill="#a5876a"/>
    <circle cx="502" cy="208" r="102" fill="url(#mirrorGlass)"/>
    <path d="M440 150 Q470 130 520 132" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.55"/>
    <path d="M432 176 Q452 164 476 166" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
    <ellipse cx="548" cy="262" rx="40" ry="60" fill="#e8f0f2" opacity="0.25"/>
    <circle cx="502" cy="208" r="102" fill="none" stroke="#8ba7b0" stroke-width="2" opacity="0.35"/>
  </g>

  <!-- BLACK WALL COAT RACK (right) -->
  <g>
    <rect x="704" y="120" width="46" height="272" rx="8" fill="url(#coatBoard)"/>
    <rect x="710" y="126" width="6" height="260" rx="3" fill="#3d3a36" opacity="0.6"/>
    <g fill="#15130f" stroke="#3d3a36" stroke-width="1">
      <circle cx="727" cy="170" r="9"/>
      <rect x="723" y="170" width="8" height="20" rx="4"/>
      <circle cx="727" cy="240" r="9"/>
      <rect x="723" y="240" width="8" height="20" rx="4"/>
      <circle cx="727" cy="310" r="9"/>
      <rect x="723" y="310" width="8" height="20" rx="4"/>
    </g>
    <circle cx="724" cy="167" r="3" fill="#5c4632" opacity="0.6"/>
    <circle cx="724" cy="237" r="3" fill="#5c4632" opacity="0.6"/>
    <circle cx="724" cy="307" r="3" fill="#5c4632" opacity="0.6"/>
  </g>

