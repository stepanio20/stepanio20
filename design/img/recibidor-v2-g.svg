    <rect x="52" y="76" width="236" height="388" rx="12" fill="url(#glassGrad)"/>
    <path d="M78 92 L108 92 L64 440 L60 420 Z" fill="#ffffff" opacity="0.16"/>
    <path d="M150 90 L166 90 L120 448 L110 448 Z" fill="#ffffff" opacity="0.12"/>
