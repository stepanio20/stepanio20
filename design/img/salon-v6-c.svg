<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f7f3ec"/>
    </linearGradient>
    <radialGradient id="wallGlow" cx="0.55" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#cbb287"/>
    </linearGradient>
    <radialGradient id="rugGrad" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f7f3ec"/>
    </radialGradient>
    <linearGradient id="chromeSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a968f"/>
      <stop offset="0.12" stop-color="#e3e1dc"/>
      <stop offset="0.30" stop-color="#c9c5be"/>
      <stop offset="0.45" stop-color="#f2f1ee"/>
      <stop offset="0.56" stop-color="#e3e1dc"/>
      <stop offset="0.74" stop-color="#b4b0a9"/>
      <stop offset="0.88" stop-color="#d8d5cf"/>
      <stop offset="1" stop-color="#8f8b84"/>
    </linearGradient>
    <linearGradient id="chromeTop" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#f2f1ee"/>
      <stop offset="0.5" stop-color="#d5d2cc"/>
      <stop offset="1" stop-color="#e3e1dc"/>
    </linearGradient>
    <radialGradient id="poufTop" cx="0.42" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#8a8c62"/>
      <stop offset="0.6" stop-color="#7a7c5c"/>
      <stop offset="1" stop-color="#6a6c4e"/>
    </radialGradient>
    <linearGradient id="poufSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a7c5c"/>
      <stop offset="1" stop-color="#63654a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf9f5c"/>
      <stop offset="0.55" stop-color="#b98a4a"/>
      <stop offset="1" stop-color="#8a5a20"/>
    </linearGradient>
  </defs>

  <!-- wall -->
  <rect x="0" y="0" width="800" height="392" fill="url(#wallGrad)"/>
  <ellipse cx="470" cy="180" rx="360" ry="220" fill="url(#wallGlow)"/>

  <!-- floor -->
  <rect x="0" y="380" width="800" height="220" fill="url(#floorGrad)"/>
  <rect x="0" y="378" width="800" height="7" fill="#a5876a" opacity="0.55"/>
  <path d="M40,470 Q400,462 760,470" fill="none" stroke="#a5876a" stroke-width="2" opacity="0.25"/>
  <path d="M20,540 Q400,532 780,540" fill="none" stroke="#a5876a" stroke-width="2" opacity="0.2"/>

  <!-- wool rug -->
  <ellipse cx="400" cy="492" rx="360" ry="98" fill="url(#rugGrad)"/>
  <ellipse cx="400" cy="492" rx="360" ry="98" fill="none" stroke="#d8c19a" stroke-width="3" opacity="0.5"/>
  <ellipse cx="400" cy="492" rx="326" ry="86" fill="none" stroke="#cbb287" stroke-width="2" opacity="0.4"/>
  <ellipse cx="400" cy="492" rx="290" ry="74" fill="none" stroke="#faf7f2" stroke-width="2" opacity="0.7"/>

  <!-- ===================== POUF (left) ===================== -->
  <ellipse cx="250" cy="476" rx="150" ry="34" fill="#1f1b16" opacity="0.12"/>
  <path d="M115,383 L115,426 Q250,470 385,426 L385,383 Z" fill="url(#poufSide)"/>
  <!-- side seams -->
  <path d="M115,383 L118,426" stroke="#4f5139" stroke-width="2" opacity="0.5" fill="none"/>
  <path d="M154,412 L156,447" stroke="#4f5139" stroke-width="2" opacity="0.5" fill="none"/>
  <path d="M250,427 L250,469" stroke="#4f5139" stroke-width="2" opacity="0.5" fill="none"/>
  <path d="M346,412 L344,447" stroke="#4f5139" stroke-width="2" opacity="0.5" fill="none"/>
  <path d="M385,383 L382,426" stroke="#4f5139" stroke-width="2" opacity="0.5" fill="none"/>
  <ellipse cx="250" cy="383" rx="135" ry="44" fill="url(#poufTop)"/>
  <!-- tuft seams on top -->
  <path d="M250,383 L385,383" stroke="#63654a" stroke-width="2" opacity="0.55" fill="none"/>
  <path d="M250,383 L115,383" stroke="#63654a" stroke-width="2" opacity="0.55" fill="none"/>
  <path d="M250,383 L346,414" stroke="#63654a" stroke-width="2" opacity="0.55" fill="none"/>
  <path d="M250,383 L154,414" stroke="#63654a" stroke-width="2" opacity="0.55" fill="none"/>
  <path d="M250,383 L346,352" stroke="#63654a" stroke-width="2" opacity="0.45" fill="none"/>
  <path d="M250,383 L154,352" stroke="#63654a" stroke-width="2" opacity="0.45" fill="none"/>
  <path d="M250,383 L250,427" stroke="#63654a" stroke-width="2" opacity="0.55" fill="none"/>
  <path d="M250,383 L250,339" stroke="#63654a" stroke-width="2" opacity="0.45" fill="none"/>
  <ellipse cx="250" cy="383" rx="9" ry="4" fill="#63654a"/>
  <ellipse cx="216" cy="366" rx="70" ry="20" fill="#8a8c62" opacity="0.35"/>

  <!-- ===================== CHROME DRUM TABLE (right) ===================== -->
  <ellipse cx="555" cy="452" rx="108" ry="26" fill="#1f1b16" opacity="0.12"/>
  <path d="M465,290 L465,440 Q555,470 645,440 L645,290 Z" fill="url(#chromeSide)"/>
  <!-- reflection streaks -->
  <rect x="503" y="296" width="13" height="146" rx="6" fill="#ffffff" opacity="0.30"/>
  <rect x="602" y="298" width="18" height="140" rx="8" fill="#3d3a36" opacity="0.12"/>
  <rect x="486" y="298" width="6" height="138" rx="3" fill="#ffffff" opacity="0.22"/>
  <!-- drum groove bands -->
  <path d="M465,352 Q555,368 645,352" fill="none" stroke="#f2f1ee" stroke-width="2" opacity="0.7"/>
  <path d="M465,356 Q555,372 645,356" fill="none" stroke="#8f8b84" stroke-width="2" opacity="0.5"/>
  <path d="M465,404 Q555,420 645,404" fill="none" stroke="#f2f1ee" stroke-width="2" opacity="0.6"/>
  <path d="M465,408 Q555,424 645,408" fill="none" stroke="#8f8b84" stroke-width="2" opacity="0.45"/>
  <!-- top surface -->
  <ellipse cx="555" cy="290" rx="90" ry="26" fill="url(#chromeTop)"/>
  <ellipse cx="555" cy="290" rx="90" ry="26" fill="none" stroke="#8f8b84" stroke-width="2" opacity="0.4"/>
  <ellipse cx="555" cy="288" rx="74" ry="19" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.55"/>
  <ellipse cx="533" cy="284" rx="34" ry="8" fill="#ffffff" opacity="0.45"/>

  <!-- amber lowball tumbler -->
  <ellipse cx="512" cy="288" rx="30" ry="8" fill="#1f1b16" opacity="0.10"/>
  <path d="M488,252 L490,282 Q512,292 534,282 L536,252 Z" fill="url(#amber)"/>
  <ellipse cx="512" cy="252" rx="24" ry="7" fill="#cf9f5c"/>
  <ellipse cx="512" cy="252" rx="24" ry="7" fill="none" stroke="#8a5a20" stroke-width="1.5" opacity="0.5"/>
  <rect x="497" y="256" width="5" height="24" rx="2.5" fill="#f7f3ec" opacity="0.5"/>

  <!-- amber bud vase -->
  <ellipse cx="596" cy="286" rx="16" ry="6" fill="#1f1b16" opacity="0.10"/>
  <path d="M588,232 C585,256 590,283 596,283 C602,283 607,256 604,232 Q596,239 588,232 Z" fill="url(#amber)"/>
  <ellipse cx="596" cy="232" rx="8" ry="3" fill="#8a5a20"/>
  <path d="M592,240 C591,255 593,272 595,278" fill="none" stroke="#f7f3ec" stroke-width="2.5" opacity="0.45"/>
</svg>