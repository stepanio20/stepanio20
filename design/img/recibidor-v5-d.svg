<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f2ece1"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="oakV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8c19a"/>
      <stop offset="0.5" stop-color="#cbb287"/>
      <stop offset="1" stop-color="#a5876a"/>
    </linearGradient>
    <linearGradient id="oakLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0cba6"/>
      <stop offset="1" stop-color="#c8a87c"/>
    </linearGradient>
    <linearGradient id="oakDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5876a"/>
      <stop offset="1" stop-color="#6d5138"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf7f2" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#e3e1dc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b8cdd6" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="glassGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f3ec"/>
      <stop offset="1" stop-color="#e8dcc6"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e1dc"/>
      <stop offset="0.5" stop-color="#c9c5be"/>
      <stop offset="1" stop-color="#9a968f"/>
    </linearGradient>
    <linearGradient id="grey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c5be"/>
      <stop offset="1" stop-color="#9a968f"/>
    </linearGradient>
    <linearGradient id="mirror" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e1dc"/>
      <stop offset="0.45" stop-color="#c9c5be"/>
      <stop offset="0.55" stop-color="#b8cdd6"/>
      <stop offset="1" stop-color="#9a968f"/>
    </linearGradient>
    <linearGradient id="poster" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3ec"/>
      <stop offset="1" stop-color="#e8dcc6"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cf9f5c"/>
      <stop offset="1" stop-color="#b98a4a"/>
    </linearGradient>
    <radialGradient id="cabGlow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#e8dcc6"/>
    </radialGradient>
  </defs>

  <!-- WALL -->
  <rect x="0" y="0" width="800" height="600" fill="url(#wall)"/>
  <!-- soft warm light wash -->
  <ellipse cx="400" cy="150" rx="360" ry="200" fill="#faf7f2" opacity="0.5"/>

  <!-- FLOOR band lower third -->
  <rect x="0" y="410" width="800" height="190" fill="url(#floor)"/>
  <!-- skirting line -->
  <rect x="0" y="404" width="800" height="8" fill="#a5876a"/>
  <rect x="0" y="402" width="800" height="3" fill="#e0cba6"/>
  <!-- plank lines -->
  <g stroke="#a5876a" stroke-width="1.4" opacity="0.35">
    <line x1="0" y1="452" x2="800" y2="452"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="552" x2="800" y2="552"/>
  </g>
  <g stroke="#a5876a" stroke-width="1" opacity="0.25">
    <line x1="120" y1="412" x2="120" y2="452"/>
    <line x1="330" y1="452" x2="330" y2="500"/>
    <line x1="540" y1="412" x2="540" y2="452"/>
    <line x1="240" y1="500" x2="240" y2="552"/>
    <line x1="600" y1="500" x2="600" y2="552"/>
    <line x1="430" y1="552" x2="430" y2="600"/>
    <line x1="680" y1="452" x2="680" y2="500"/>
  </g>

  <!-- ===================== HERO: DISPLAY CABINET (centered) ===================== -->
  <!-- shadow -->
  <ellipse cx="400" cy="470" rx="185" ry="20" fill="#1f1b16" opacity="0.12"/>

  <!-- cabinet body -->
  <rect x="262" y="120" width="276" height="350" rx="10" fill="url(#oakV)"/>
  <rect x="268" y="126" width="264" height="338" rx="8" fill="url(#oakLight)"/>

  <!-- upper glass display half -->
  <rect x="280" y="138" width="240" height="180" rx="6" fill="url(#cabGlow)"/>
  <!-- interior back warm glow -->
  <rect x="288" y="146" width="224" height="164" rx="5" fill="url(#glassGlow)"/>
  <!-- shelf -->
  <rect x="288" y="228" width="224" height="6" rx="3" fill="#cbb287"/>
  <rect x="288" y="226" width="224" height="2" fill="#e0cba6"/>

  <!-- displayed handbags (top shelf) -->
  <!-- bag 1 -->
  <g>
    <ellipse cx="330" cy="222" rx="30" ry="6" fill="#1f1b16" opacity="0.1"/>
    <path d="M310 178 h40 a6 6 0 0 1 6 6 v28 a6 6 0 0 1 -6 6 h-40 a6 6 0 0 1 -6 -6 v-28 a6 6 0 0 1 6 -6 z" fill="#8a8c62"/>
    <path d="M310 178 h40 a6 6 0 0 1 6 6 v10 h-52 v-10 a6 6 0 0 1 6 -6 z" fill="#7a7c5c"/>
    <path d="M318 178 q12 -18 24 0" fill="none" stroke="#63654a" stroke-width="3" stroke-linecap="round"/>
    <rect x="326" y="192" width="8" height="5" rx="1.5" fill="#cf9f5c"/>
  </g>
  <!-- bag 2 -->
  <g>
    <ellipse cx="400" cy="222" rx="34" ry="6" fill="#1f1b16" opacity="0.1"/>
    <path d="M376 174 h48 a5 5 0 0 1 5 5 v34 a5 5 0 0 1 -5 5 h-48 a5 5 0 0 1 -5 -5 v-34 a5 5 0 0 1 5 -5 z" fill="#c8a87c"/>
    <path d="M376 174 h48 a5 5 0 0 1 5 5 v9 h-58 v-9 a5 5 0 0 1 5 -5 z" fill="#a5876a"/>
    <path d="M383 174 q17 -20 34 0" fill="none" stroke="#8a5a20" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="400" y1="188" x2="400" y2="218" stroke="#a5876a" stroke-width="1.5" opacity="0.5"/>
    <rect x="395" y="196" width="10" height="4" rx="1.5" fill="#cf9f5c"/>
  </g>
  <!-- bag 3 -->
  <g>
    <ellipse cx="470" cy="222" rx="28" ry="6" fill="#1f1b16" opacity="0.1"/>
    <path d="M450 182 h40 a5 5 0 0 1 5 5 v24 a5 5 0 0 1 -5 5 h-40 a5 5 0 0 1 -5 -5 v-24 a5 5 0 0 1 5 -5 z" fill="#63654a"/>
    <path d="M450 182 h40 a5 5 0 0 1 5 5 v8 h-50 v-8 a5 5 0 0 1 5 -5 z" fill="#7a7c5c"/>
    <path d="M456 182 q14 -16 28 0" fill="none" stroke="#4a3624" stroke-width="3" stroke-linecap="round"/>
    <rect x="465" y="194" width="10" height="4" rx="1.5" fill="#c9c5be"/>
  </g>

  <!-- small helmet on lower shelf as art -->
  <g>
    <ellipse cx="400" cy="300" rx="40" ry="7" fill="#1f1b16" opacity="0.12"/>
    <path d="M368 278 a34 30 0 0 1 64 0 v10 a6 6 0 0 1 -6 6 h-52 a6 6 0 0 1 -6 -6 z" fill="url(#chrome)"/>
    <path d="M368 278 a34 30 0 0 1 64 0 v4 h-64 z" fill="#e3e1dc"/>
    <path d="M374 288 h52 v6 a4 4 0 0 1 -4 4 h-44 a4 4 0 0 1 -4 -4 z" fill="#3d3a36"/>
    <path d="M377 289 h46 v5 h-46 z" fill="#2a2724" opacity="0.8"/>
    <path d="M382 264 q18 -12 36 0" fill="none" stroke="#cf9f5c" stroke-width="4" stroke-linecap="round"/>
    <path d="M388 258 q12 -6 24 0" fill="none" stroke="#8a8c62" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="386" cy="276" rx="4" ry="6" fill="#faf7f2" opacity="0.6"/>
  </g>

  <!-- glass panes overlay -->
  <rect x="280" y="138" width="240" height="180" rx="6" fill="url(#glass)" opacity="0.45"/>
  <line x1="400" y1="138" x2="400" y2="318" stroke="#e3e1dc" stroke-width="2" opacity="0.6"/>
  <path d="M290 150 L340 150 L300 300 L290 300 Z" fill="#fff" opacity="0.18"/>
  <path d="M420 145 L440 145 L410 310 L400 310 Z" fill="#fff" opacity="0.12"/>
  <!-- glass frame -->
  <rect x="280" y="138" width="240" height="180" rx="6" fill="none" stroke="#a5876a" stroke-width="4"/>

  <!-- lower closed oak half -->
  <rect x="280" y="330" width="240" height="128" rx="6" fill="url(#oakDark)"/>
  <rect x="286" y="336" width="112" height="116" rx="5" fill="url(#oakLight)"/>
  <rect x="402" y="336" width="112" height="116" rx="5" fill="url(#oakLight)"/>
  <rect x="286" y="336" width="112" height="116" rx="5" fill="none" stroke="#a5876a" stroke-width="2"/>
  <rect x="402" y="336" width="112" height="116" rx="5" fill="none" stroke="#a5876a" stroke-width="2"/>
  <!-- wood grain lower doors -->
  <g stroke="#a5876a" stroke-width="1" opacity="0.3">
    <path d="M300 348 q40 4 80 0" fill="none"/>
    <path d="M300 380 q40 -4 80 0" fill="none"/>
    <path d="M300 412 q40 4 80 0" fill="none"/>
    <path d="M416 348 q40 4 80 0" fill="none"/>
    <path d="M416 380 q40 -4 80 0" fill="none"/>
    <path d="M416 412 q40 4 80 0" fill="none"/>
  </g>
  <!-- handles -->
  <rect x="388" y="388" width="6" height="30" rx="3" fill="url(#chrome)"/>
  <rect x="406" y="388" width="6" height="30" rx="3" fill="url(#chrome)"/>
  <!-- feet -->
  <rect x="292" y="458" width="16" height="14" rx="3" fill="#6d5138"/>
  <rect x="492" y="458" width="16" height="14" rx="3" fill="#6d5138"/>

  <!-- ===================== OAK BENCH with rope seat (left foreground) ===================== -->
  <g>
    <ellipse cx="150" cy="478" rx="105" ry="16" fill="#1f1b16" opacity="0.12"/>
    <!-- legs -->
    <rect x="72" y="418" width="12" height="56" rx="3" fill="url(#oakDark)"/>
    <rect x="216" y="418" width="12" height="56" rx="3" fill="url(#oakDark)"/>
    <!-- frame -->
    <rect x="62" y="404" width="176" height="20" rx="6" fill="url(#oakV)"/>
    <rect x="66" y="406" width="168" height="9" rx="4" fill="url(#oakLight)"/>
    <!-- rope seat -->
    <rect x="70" y="392" width="160" height="16" rx="4" fill="#e8dcc6"/>
    <g stroke="#d8c19a" stroke-width="2" opacity="0.8">
      <line x1="78" y1="392" x2="78" y2="408"/>
      <line x1="88" y1="392" x2="88" y2="408"/>
      <line x1="98" y1="392" x2="98" y2="408"/>
      <line x1="108" y1="392" x2="108" y2="408"/>
      <line x1="118" y1="392" x2="118" y2="408"/>
      <line x1="128" y1="392" x2="128" y2="408"/>
      <line x1="138" y1="392" x2="138" y2="408"/>
      <line x1="148" y1="392" x2="148" y2="408"/>
      <line x1="158" y1="392" x2="158" y2="408"/>
      <line x1="168" y1="392" x2="168" y2="408"/>
      <line x1="178" y1="392" x2="178" y2="408"/>
      <line x1="188" y1="392" x2="188" y2="408"/>
      <line x1="198" y1="392" x2="198" y2="408"/>
      <line x1="208" y1="392" x2="208" y2="408"/>
      <line x1="218" y1="392" x2="218" y2="408"/>
    </g>
    <g stroke="#cbb287" stroke-width="1.4" opacity="0.6">
      <line x1="70" y1="396" x2="230" y2="396"/>
      <line x1="70" y1="402" x2="230" y2="402"/>
    </g>
  </g>

  <!-- ===================== SLIM CONSOLE + POSTER (right) ===================== -->
  <!-- poster on wall -->
  <g>
    <rect x="596" y="120" width="150" height="180" rx="4" fill="#2a2724"/>
    <rect x="602" y="126" width="138" height="168" rx="2" fill="url(#poster)"/>
    <!-- abstract F1 circuit -->
    <path d="M620 260 C620 200 650 210 660 180 C668 156 700 156 712 176 C722 192 705 210 715 230 C724 248 706 270 686 268 C662 266 668 240 648 246 C632 251 640 275 620 275 Z"
          fill="none" stroke="url(#amber)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M620 260 C620 200 650 210 660 180 C668 156 700 156 712 176 C722 192 705 210 715 230 C724 248 706 270 686 268 C662 266 668 240 648 246 C632 251 640 275 620 275 Z"
          fill="none" stroke="#7a7c5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <circle cx="660" cy="180" r="5" fill="#8a5a20"/>
    <rect x="708" y="170" width="10" height="4" rx="2" fill="#63654a"/>
    <rect x="614" y="136" width="60" height="6" rx="3" fill="#8a8c62" opacity="0.5"/>
    <rect x="614" y="148" width="40" height="4" rx="2" fill="#cf9f5c" opacity="0.5"/>
  </g>

  <!-- console -->
  <g>
    <ellipse cx="671" cy="462" rx="90" ry="14" fill="#1f1b16" opacity="0.12"/>
    <rect x="600" y="326" width="142" height="26" rx="5" fill="url(#oakV)"/>
    <rect x="604" y="330" width="134" height="10" rx="4" fill="#e0cba6"/>
    <!-- slim legs -->
    <rect x="608" y="352" width="8" height="106" rx="3" fill="url(#oakDark)"/>
    <rect x="726" y="352" width="8" height="106" rx="3" fill="url(#oakDark)"/>
    <rect x="608" y="392" width="126" height="6" rx="3" fill="#a5876a"/>
    <!-- small tray + vase on console -->
    <rect x="630" y="312" width="46" height="6" rx="3" fill="#c9c5be"/>
    <path d="M645 288 q-6 12 0 22 h16 q6 -10 0 -22 z" fill="#8a8c62"/>
    <path d="M645 288 q8 -4 16 0 q-6 10 0 22 h-16 q-6 -12 0 -22 z" fill="#7a7c5c"/>
  </g>

  <!-- ===================== FULL-HEIGHT OAK MIRROR (right of cabinet) ===================== -->
  <g>
    <ellipse cx="560" cy="472" rx="46" ry="12" fill="#1f1b16" opacity="0.12"/>
    <rect x="524" y="150" width="72" height="316" rx="12" fill="url(#oakV)"/>
    <rect x="530" y="156" width="60" height="304" rx="9" fill="url(#oakLight)"/>
    <rect x="536" y="162" width="48" height="292" rx="7" fill="url(#mirror)"/>
    <!-- mirror reflection sheen -->
    <path d="M542 168 L560 168 L544 448 L536 448 Z" fill="#fff" opacity="0.22"/>
    <path d="M572 175 L580 175 L566 440 L560 440 Z" fill="#fff" opacity="0.12"/>
    <rect x="536" y="162" width="48" height="292" rx="7" fill="none" stroke="#a5876a" stroke-width="2"/>
  </g>

  <!-- ===================== GREY SHOE COLUMN (near door, far left) ===================== -->
  <g>
    <ellipse cx="40" cy="470" rx="40" ry="12" fill="#1f1b16" opacity="0.12"/>
    <rect x="8" y="250" width="64" height="216" rx="8" fill="url(#grey)"/>
    <rect x="12" y="254" width="56" height="208" rx="6" fill="#c9c5be"/>
    <!-- open shoe slots -->
    <g fill="#3d3a36" opacity="0.85">
      <rect x="18" y="264" width="44" height="36" rx="4"/>
      <rect x="18" y="308" width="44" height="36" rx="4"/>
      <rect x="18" y="352" width="44" height="36" rx="4"/>
      <rect x="18" y="396" width="44" height="36" rx="4"/>
    </g>
    <!-- shoes -->
    <path d="M24 288 q6 -10 20 -8 q10 2 14 8 z" fill="#5c4632"/>
    <path d="M24 332 q6 -10 22 -8 q8 2 12 8 z" fill="#7a7c5c"/>
    <path d="M24 376 q8 -9 20 -7 q10 2 14 7 z" fill="#a5876a"/>
    <path d="M24 420 q6 -10 22 -8 q8 3 12 8 z" fill="#3d3a36"/>
    <rect x="12" y="254" width="56" height="208" rx="6" fill="none" stroke="#9a968f" stroke-width="1.5"/>
  </g>

  <!-- ===================== PLANT (right foreground) ===================== -->
  <g>
    <ellipse cx="770" cy="474" rx="34" ry="12" fill="#1f1b16" opacity="0.12"/>
    <path d="M752 430 h44 l-6 40 a6 6 0 0 1 -6 5 h-20 a6 6 0 0 1 -6 -5 z" fill="url(#oakDark)"/>
    <path d="M752 430 h44 l-1.5 10 h-41 z" fill="#c8a87c"/>
    <g fill="#7a7c5c">
      <path d="M774 430 q-30 -40 -46 -78 q34 22 50 74 z"/>
      <path d="M774 430 q30 -46 50 -70 q-16 40 -46 72 z"/>
    </g>
    <g fill="#8a8c62">
      <path d="M774 430 q-10 -54 -6 -96 q18 44 12 94 z"/>
      <path d="M774 430 q22 -40 42 -52 q-12 34 -38 54 z"/>
    </g>
    <g fill="#63654a">
      <path d="M774 430 q-20 -42 -34 -60 q26 18 40 58 z"/>
    </g>
  </g>

  <!-- subtle ceiling spotlight cone toward cabinet glass -->
  <path d="M400 90 L340 138 L460 138 Z" fill="#faf7f2" opacity="0.25"/>

  <!-- small framed accent above bench (olive square) -->
  <g>
    <rect x="110" y="150" width="80" height="80" rx="4" fill="#3d3a36"/>
    <rect x="116" y="156" width="68" height="68" rx="2" fill="#f7f3ec"/>
    <circle cx="150" cy="190" r="20" fill="#8a8c62" opacity="0.7"/>
    <rect x="126" y="200" width="48" height="16" rx="6" fill="#cf9f5c" opacity="0.6"/>
  </g>
</svg>
